<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="./react.production.min.js"></script>
<script src="./react-dom.production.min.js"></script>

<script src="dataset.php?f=data"></script>

<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f0efed;font-family:'Helvetica Neue',Helvetica,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:13px;color:#1c1917}
  input,select,button{font-family:inherit}
  input:focus,select:focus{outline:1px solid #97C459}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:5px}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes miInsightFadeIn{from{opacity:0}to{opacity:1}}
  .ca-source-info-btn{opacity:0;color:#a8a29e;cursor:pointer;transition:opacity .12s,color .12s}
  .ca-source-chip-wrap:hover .ca-source-info-btn{opacity:1}
  .ca-source-info-btn:hover{color:#57534e}
  .ca-source-info-btn.is-open{opacity:1}
  .ca-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
</style>

<body>
<div id="root" style="padding:0;display:flex"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const ACCENT  = '#1D9E75';
const GREEN   = '#639922';
const TINT    = '#EAF3DE';

const STATE_COL = {
  WA:{bg:'#FEF3C7',tx:'#92400E',bd:'#FDE68A'}, QLD:{bg:'#DBEAFE',tx:'#1E40AF',bd:'#BFDBFE'},
  NSW:{bg:'#DCFCE7',tx:'#166534',bd:'#BBF7D0'}, VIC:{bg:'#EDE9FE',tx:'#5B21B6',bd:'#DDD6FE'},
  TAS:{bg:'#ECFDF5',tx:'#065F46',bd:'#A7F3D0'}, NT:{bg:'#FFEDD5',tx:'#9A3412',bd:'#FED7AA'},
  SA:{bg:'#FCE7F3',tx:'#9D174D',bd:'#FBCFE8'}, ACT:{bg:'#E0F2FE',tx:'#075985',bd:'#BAE6FD'},
};
function stateChipStyle(s, small){
  const c = STATE_COL[s] || {bg:'#f5f5f4',tx:'#57534e',bd:'#e7e5e4'};
  return {display:'inline-flex',alignItems:'center',padding:small?'1px 6px':'2px 8px',borderRadius:'4px',
    fontSize:small?'10px':'11px',fontWeight:700,background:c.bg,color:c.tx,border:'0.5px solid '+c.bd,whiteSpace:'nowrap'};
}

// ════════════════════════════════════════════════════════════
// Analytics view — pure CSS charts, no external library
// ════════════════════════════════════════════════════════════

function HBar({items, title, colorFn, labelWidth, note}){
  labelWidth = labelWidth || 160;
  const max = Math.max(...items.map(x=>x.v), 1);
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'8px',padding:'14px 16px',minWidth:0}}>
      <div style={{fontSize:'11px',fontWeight:700,color:'#57534e',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'10px'}}>{title}</div>
      {note && <div style={{fontSize:'10px',color:'#a8a29e',marginBottom:'8px'}}>{note}</div>}
      <div style={{display:'flex',flexDirection:'column',gap:'5px'}}>
        {items.map((x,i)=>{
          const pct = Math.round(x.v/max*100);
          const col = colorFn ? colorFn(x) : '#1D9E75';
          return (
            <div key={i} style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'11px'}}>
              <div style={{width:labelWidth,minWidth:labelWidth,textAlign:'right',color:'#57534e',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flexShrink:0}} title={x.label}>{x.label}</div>
              <div style={{flex:1,height:'16px',background:'#f0efed',borderRadius:'3px',overflow:'hidden'}}>
                <div style={{height:'100%',width:pct+'%',background:col,borderRadius:'3px',transition:'width .3s'}}/>
              </div>
              <div style={{width:'32px',textAlign:'right',fontWeight:600,color:'#1c1917',flexShrink:0}}>{x.v}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function GroupedHBar({items, title, keys, colors, labelWidth, note}){
  // items: [{label, [key]: value}], keys: ['A','B'], colors: {A:'#...', B:'#...'}
  labelWidth = labelWidth || 140;
  const max = Math.max(...items.flatMap(x=>keys.map(k=>x[k]||0)), 1);
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'8px',padding:'14px 16px',minWidth:0}}>
      <div style={{fontSize:'11px',fontWeight:700,color:'#57534e',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'4px'}}>{title}</div>
      {note && <div style={{fontSize:'10px',color:'#a8a29e',marginBottom:'4px'}}>{note}</div>}
      <div style={{display:'flex',gap:'12px',marginBottom:'8px'}}>
        {keys.map(k=><div key={k} style={{display:'flex',alignItems:'center',gap:'4px',fontSize:'10px',color:'#57534e'}}><div style={{width:'10px',height:'10px',borderRadius:'2px',background:colors[k]}}/>{k}</div>)}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
        {items.map((x,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'11px'}}>
            <div style={{width:labelWidth,minWidth:labelWidth,textAlign:'right',color:'#57534e',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flexShrink:0}}>{x.label}</div>
            <div style={{flex:1,display:'flex',flexDirection:'column',gap:'2px'}}>
              {keys.map(k=>(
                <div key={k} style={{display:'flex',alignItems:'center',gap:'4px'}}>
                  <div style={{flex:1,height:'10px',background:'#f0efed',borderRadius:'2px',overflow:'hidden'}}>
                    <div style={{height:'100%',width:Math.round((x[k]||0)/max*100)+'%',background:colors[k],borderRadius:'2px'}}/>
                  </div>
                  <div style={{width:'28px',textAlign:'right',fontSize:'10px',color:'#57534e'}}>{x[k]||0}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// Categorical palette, fixed order (validated adjacent-pair CVD safety) — for the 8-slice category pie.
const QA_CAT = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];

function QaStatTile({label, value}){
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'12px 14px',flex:'1 1 140px',minWidth:'140px'}}>
      <Label>{label}</Label>
      <div style={{fontSize:'22px',fontWeight:600,color:'#1c1917'}}>{value}</div>
    </div>
  );
}

// Small "Table view" link-button + collapsible table, matching the same
// accessibility pattern on every chart: the same data is always reachable
// without hovering/clicking a bar, not gated behind the visual-only chart.
function QaTableToggle({columns, rows}){
  const [open, setOpen] = useState(false);
  return (
    <div style={{marginTop:'8px'}}>
      <button onClick={()=>setOpen(o=>!o)} style={{font:'inherit',fontSize:'11px',background:'none',border:'none',color:'#a8a29e',textDecoration:'underline',textUnderlineOffset:'2px',cursor:'pointer',padding:'2px 0'}}>
        {open ? 'Hide table' : 'Table view'}
      </button>
      {open &&
        <div style={{overflowX:'auto',marginTop:'6px'}}>
          <table style={{width:'auto',borderCollapse:'collapse',fontSize:'11px'}}>
            <thead><tr>{columns.map(c=><th key={c} style={{textAlign:'left',padding:'3px 8px',color:'#a8a29e',fontWeight:600,borderBottom:'0.5px solid #e7e5e4',whiteSpace:'nowrap'}}>{c}</th>)}</tr></thead>
            <tbody>{rows.map((r,i)=><tr key={i}>{r.map((cell,j)=><td key={j} style={{padding:'3px 8px',color:'#57534e',borderBottom:'0.5px solid #f1f0ef',whiteSpace:'nowrap'}}>{cell}</td>)}</tr>)}</tbody>
          </table>
        </div>}
    </div>
  );
}

function QaBarChart({title, data, unit, activeKey, onBarClick, clickable}){
  const entries = Object.entries(data||{});
  const max = entries.reduce((m,[,v])=>Math.max(m,v),0) || 1;
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px',flex:'1 1 380px',minWidth:'320px'}}>
      <div style={{fontSize:'12px',fontWeight:600,marginBottom:'10px'}}>{title}</div>
      <div style={{display:'flex',flexDirection:'column',gap:'7px'}}>
        {entries.map(([label,v],i)=>{
          const isActive = activeKey===label;
          const faded = clickable && activeKey && !isActive;
          return (
          <div key={label} onClick={()=>clickable && onBarClick && onBarClick(label)}
            title={clickable? (isActive? 'Click to clear filter' : 'Click to filter by '+label) : label}
            style={{display:'flex',alignItems:'center',gap:'8px',cursor:clickable?'pointer':'default',opacity:faded?0.45:1,transition:'opacity .15s'}}>
            <div style={{width:'150px',minWidth:'150px',fontSize:'11px',color:isActive?'#184f95':'#57534e',fontWeight:isActive?700:400,textAlign:'right',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{label}</div>
            <div style={{flex:1,minWidth:0,display:'flex',alignItems:'center',gap:'6px'}}>
              <div style={{flex:'1 1 auto',minWidth:0,height:'16px',background:'#f5f5f4',borderRadius:'3px',overflow:'hidden',boxShadow:isActive?'0 0 0 1.5px #184f95':'none'}}>
                <div style={{height:'100%',borderRadius:'3px',background:QA_CAT[i%QA_CAT.length],width:Math.max(2,Math.round(v/max*100))+'%',transition:'width .3s'}}/>
              </div>
              <div style={{fontSize:'11px',color:'#57534e',minWidth:'54px',fontVariantNumeric:'tabular-nums'}}>{v.toLocaleString()}{unit||''}</div>
            </div>
          </div>);
        })}
      </div>
      <QaTableToggle columns={['Label','Value']} rows={entries.map(([label,v])=>[label, v.toLocaleString()+(unit||'')])}/>
    </div>
  );
}

const QA_CITY_PAGE_SIZE = 15;

function QaCityChart({allCities, otherCitiesTotal, citiesBelowThresholdCount, cityThreshold, activeKey, onBarClick, clickable, filtered}){
  const [page, setPage]         = useState(0);
  const [includeTail, setIncludeTail] = useState(false);

  const entries = Object.entries(allCities||{});
  const shown = includeTail ? entries : entries.filter(([,v])=>v>=cityThreshold);
  const totalPages = Math.max(1, Math.ceil(shown.length / QA_CITY_PAGE_SIZE));
  const pageClamped = Math.min(page, totalPages-1);
  const pageEntries = shown.slice(pageClamped*QA_CITY_PAGE_SIZE, pageClamped*QA_CITY_PAGE_SIZE+QA_CITY_PAGE_SIZE);
  const pageData = Object.fromEntries(pageEntries);

  const btnStyle = (on)=>({padding:'4px 9px',fontSize:'11px',fontWeight:600,borderRadius:'5px',border:'0.5px solid #d6d3d1',background:on?'#fff':'#f5f5f4',color:on?'#1c1917':'#cbc9c6',cursor:on?'pointer':'not-allowed'});

  return (
    <div style={{flex:'1 1 380px',minWidth:'320px',display:'flex',flexDirection:'column',gap:'8px'}}>
      <QaBarChart title={filtered? 'Cities (within '+filtered+')' : `Cities by product line items — page ${pageClamped+1} of ${totalPages}`}
        data={pageData} activeKey={activeKey} onBarClick={onBarClick} clickable={clickable}/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'8px',padding:'0 4px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <button onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={pageClamped<=0} style={btnStyle(pageClamped>0)}>‹ Prev</button>
          <button onClick={()=>setPage(p=>Math.min(totalPages-1,p+1))} disabled={pageClamped>=totalPages-1} style={btnStyle(pageClamped<totalPages-1)}>Next ›</button>
        </div>
        {citiesBelowThresholdCount>0 &&
          <label style={{display:'flex',alignItems:'center',gap:'5px',fontSize:'11px',color:'#57534e',cursor:'pointer'}}>
            <input type="checkbox" checked={includeTail} onChange={e=>{setIncludeTail(e.target.checked); setPage(0);}}/>
            Include {citiesBelowThresholdCount} more cities under {cityThreshold} items each (currently folded into "Other", {otherCitiesTotal.toLocaleString()} items total)
          </label>}
      </div>
    </div>
  );
}

function QaParetoChart({title, note, points, eightyPctAtRankPct}){
  const W = 320, H = 150, Pd = {t:14, r:16, b:28, l:36};
  const iw = W-Pd.l-Pd.r, ih = H-Pd.t-Pd.b;
  const x = v => Pd.l + (v/100)*iw;
  const y = v => Pd.t + ih - (v/100)*ih;
  const linePts = (points||[]).map(p=>[x(p.rankPct), y(p.cumPct)]);
  const pathD = linePts.length ? 'M'+x(0)+','+y(0)+'L'+linePts.map(p=>p.join(',')).join('L') : '';
  const areaD = linePts.length ? pathD+'L'+x(100)+','+y(0)+'Z' : '';
  const markerX = eightyPctAtRankPct!=null ? x(eightyPctAtRankPct) : null;
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px',flex:'0 1 520px',minWidth:'280px'}}>
      <div style={{fontSize:'12px',fontWeight:600,marginBottom:'4px'}}>{title}</div>
      {note && <div style={{fontSize:'11px',color:'#a8a29e',marginBottom:'8px'}}>{note}</div>}
      {/* Capped width so this stays a compact chart, not a full-row banner —
          the SVG's own box shrinks; the table toggle below stays full-card-width. */}
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',maxWidth:'488px',display:'block',margin:'0 auto'}} role="img" aria-label="Cumulative share of product line items by product rank">
        {[0,50,100].map(v=>(
          <g key={v}>
            <line x1={Pd.l} x2={Pd.l+iw} y1={y(v)} y2={y(v)} stroke="#e7e5e4" strokeWidth="1"/>
            <text x={Pd.l-7} y={y(v)+3.5} fontSize="9" fill="#a8a29e" textAnchor="end">{v}%</text>
          </g>
        ))}
        {[0,50,100].map(v=>(
          <text key={v} x={x(v)} y={H-11} fontSize="9" fill="#a8a29e" textAnchor="middle">{v}%</text>
        ))}
        <line x1={Pd.l} x2={Pd.l+iw} y1={y(0)} y2={y(0)} stroke="#c3c2b7" strokeWidth="1"/>
        {areaD && <path d={areaD} fill="#2a78d6" opacity="0.09"/>}
        {pathD && <path d={pathD} fill="none" stroke="#2a78d6" strokeWidth="2" strokeLinejoin="round"/>}
        {markerX!=null && <React.Fragment>
          <line x1={markerX} x2={markerX} y1={y(0)} y2={y(80)} stroke="#c3c2b7" strokeWidth="1"/>
          <circle cx={markerX} cy={y(80)} r="3.5" fill="#2a78d6" stroke="#fff" strokeWidth="1.5"/>
        </React.Fragment>}
        <text x={Pd.l+iw/2} y={H-1} fontSize="8" fill="#a8a29e" textAnchor="middle">product rank (cumulative %)</text>
      </svg>
      {eightyPctAtRankPct!=null &&
        <div style={{fontSize:'11px',fontWeight:600,color:'#2a78d6',textAlign:'center',marginTop:'2px'}}>{eightyPctAtRankPct}% of products → 80% of lines</div>}
      <QaTableToggle columns={['Product rank %','Cumulative %']} rows={(points||[]).map(p=>[p.rankPct+'%', p.cumPct+'%'])}/>
    </div>
  );
}

function QaPieChart({title, data, activeKey, onSliceClick, clickable}){
  const entries = Object.entries(data||{});
  const total = entries.reduce((s,[,v])=>s+v,0) || 1;
  let acc = 0;
  const r = 62, cx = 70, cy = 70;
  const slices = entries.map(([label,v],i)=>{
    const start = acc/total*2*Math.PI - Math.PI/2;
    acc += v;
    const end = acc/total*2*Math.PI - Math.PI/2;
    const large = (end-start) > Math.PI ? 1 : 0;
    const x1 = cx + r*Math.cos(start), y1 = cy + r*Math.sin(start);
    const x2 = cx + r*Math.cos(end),   y2 = cy + r*Math.sin(end);
    const path = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
    return {label, v, path, color: QA_CAT[i % QA_CAT.length]};
  });
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px',flex:'1 1 380px',minWidth:'320px'}}>
      <div style={{fontSize:'12px',fontWeight:600,marginBottom:'10px'}}>{title}</div>
      <div style={{display:'flex',gap:'16px',alignItems:'center',flexWrap:'wrap'}}>
        <svg width="140" height="140" viewBox="0 0 140 140" style={{flexShrink:0}}>
          {slices.map(s=>{
            const isActive = activeKey===s.label;
            const faded = clickable && activeKey && !isActive;
            return (
            <path key={s.label} d={s.path} fill={s.color} stroke="#fff" strokeWidth={isActive?3:2}
              opacity={faded?0.35:1} style={{cursor:clickable?'pointer':'default',transition:'opacity .15s'}}
              onClick={()=>clickable && onSliceClick && onSliceClick(s.label)}>
              <title>{clickable? (isActive? 'Click to clear filter' : 'Click to filter by '+s.label) : s.label}</title>
            </path>);
          })}
        </svg>
        <div style={{display:'flex',flexDirection:'column',gap:'4px',flex:'1 1 160px',minWidth:'160px'}}>
          {slices.map(s=>{
            const isActive = activeKey===s.label;
            const faded = clickable && activeKey && !isActive;
            return (
            <div key={s.label} onClick={()=>clickable && onSliceClick && onSliceClick(s.label)}
              title={clickable? (isActive? 'Click to clear filter' : 'Click to filter by '+s.label) : s.label}
              style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'11px',cursor:clickable?'pointer':'default',opacity:faded?0.45:1}}>
              <span style={{width:'9px',height:'9px',borderRadius:'2px',background:s.color,flexShrink:0,boxShadow:isActive?'0 0 0 1.5px #1c1917':'none'}}/>
              <span style={{color:isActive?'#1c1917':'#57534e',fontWeight:isActive?700:400,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.label}</span>
              <span style={{fontVariantNumeric:'tabular-nums',color:'#1c1917',fontWeight:600}}>{Math.round(s.v/total*100)}%</span>
            </div>);
          })}
        </div>
      </div>
      <QaTableToggle columns={['Category','Count','Share']} rows={slices.map(s=>[s.label, s.v.toLocaleString(), Math.round(s.v/total*100)+'%'])}/>
    </div>
  );
}

function QaCallout({title, children, tone}){
  const borderColor = tone==='crit' ? '#e34948' : tone==='warn' ? '#eda100' : '#2a78d6';
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderLeft:'3px solid '+borderColor,borderRadius:'10px',padding:'16px 18px',flex:'1 1 100%'}}>
      {title && <div style={{fontSize:'13px',fontWeight:700,marginBottom:'6px'}}>{title}</div>}
      <div style={{fontSize:'12px',color:'#57534e',lineHeight:1.55}}>{children}</div>
    </div>
  );
}

// Sequential blue ramp for heatmap cells — magnitude, not category, so a single-hue ramp is correct here.
const QA_HEAT_RAMP = ['#eaf1fb','#cde2fb','#9ec5f4','#6da7ec','#3987e5','#2a78d6','#1c5cab'];
function qaHeatColor(pct, max){
  if (!max) return QA_HEAT_RAMP[0];
  const idx = Math.round((pct/max) * (QA_HEAT_RAMP.length-1));
  return QA_HEAT_RAMP[Math.min(QA_HEAT_RAMP.length-1, Math.max(0, idx))];
}

function QaHeatmap({title, note, rows, months}){
  const cityNames = Object.keys(rows||{});
  let max = 0;
  cityNames.forEach(c=> months.forEach(m=>{ max = Math.max(max, rows[c].byMonth[m]||0); }));
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px',flex:'1 1 100%',minWidth:'320px'}}>
      <div style={{fontSize:'12px',fontWeight:600,marginBottom:'4px'}}>{title}</div>
      {note && <div style={{fontSize:'11px',color:'#a8a29e',marginBottom:'10px'}}>{note}</div>}
      <div style={{overflowX:'auto'}}>
        <table style={{borderCollapse:'collapse',fontSize:'11px',width:'100%'}}>
          <thead>
            <tr>
              <th style={{textAlign:'left',padding:'4px 8px',color:'#a8a29e',fontWeight:600,whiteSpace:'nowrap'}}>City</th>
              <th style={{textAlign:'right',padding:'4px 8px',color:'#a8a29e',fontWeight:600,whiteSpace:'nowrap'}}>n</th>
              {months.map(m=><th key={m} style={{padding:'4px 6px',color:'#a8a29e',fontWeight:600,whiteSpace:'nowrap'}}>{m}</th>)}
            </tr>
          </thead>
          <tbody>
            {cityNames.map(city=>(
              <tr key={city}>
                <td style={{padding:'4px 8px',color:'#1c1917',fontWeight:600,whiteSpace:'nowrap'}}>{city}</td>
                <td style={{padding:'4px 8px',textAlign:'right',color:'#57534e',fontVariantNumeric:'tabular-nums'}}>{rows[city].n.toLocaleString()}</td>
                {months.map(m=>{
                  const pct = rows[city].byMonth[m]||0;
                  return (
                    <td key={m} title={city+' · '+m+': '+pct+'%'} style={{padding:'4px 6px',textAlign:'center',background:qaHeatColor(pct,max),color:pct/max>0.6?'#fff':'#1c1917',fontVariantNumeric:'tabular-nums',minWidth:'36px'}}>{pct}</td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function QaSectionTitle({children, sub}){
  return (
    <div style={{marginTop:'6px'}}>
      <div style={{fontSize:'14px',fontWeight:700,color:'#1c1917'}}>{children}</div>
      {sub && <div style={{fontSize:'11px',color:'#a8a29e',marginTop:'1px'}}>{sub}</div>}
    </div>
  );
}

function QaTable({title, titleExtra, columns, rows, note, compact, onRowClick, activeKey}){
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px',flex:compact?'0 1 auto':'1 1 380px',minWidth:'320px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px',flexWrap:'wrap',marginBottom:'10px'}}>
        <div style={{fontSize:'12px',fontWeight:600}}>{title}</div>
        {titleExtra}
      </div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:compact?'auto':'100%',borderCollapse:'collapse',fontSize:'11px'}}>
          <thead>
            <tr>
              {columns.map(c=><th key={c.key} style={{textAlign:c.align||'left',padding:'4px 8px',color:'#a8a29e',fontWeight:600,borderBottom:'0.5px solid #e7e5e4',whiteSpace:'nowrap'}}>{c.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {rows.map((r,i)=>{
              const isActive = onRowClick && activeKey===r.productname;
              const faded = onRowClick && activeKey && !isActive;
              return (
              <tr key={i} onClick={()=>onRowClick && onRowClick(r)}
                title={onRowClick? (isActive? 'Click to clear filter' : 'Click to filter by '+r.productname) : undefined}
                style={{cursor:onRowClick?'pointer':'default',opacity:faded?0.45:1,transition:'opacity .15s'}}>
                {columns.map(c=><td key={c.key} style={{padding:'5px 8px',color:'#57534e',borderBottom:'0.5px solid #f1f0ef',textAlign:c.align||'left',fontVariantNumeric:c.numeric?'tabular-nums':'normal',whiteSpace:c.wrap?'normal':'nowrap',maxWidth:c.wrap?'260px':'none'}}>{c.render? c.render(r[c.key], r) : r[c.key]}</td>)}
              </tr>);
            })}
          </tbody>
        </table>
      </div>
      {note && <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'8px'}}>{note}</div>}
    </div>
  );
}

const QA_RANKED_PAGE_SIZE = 10;

// Paginated version of QaTable for a full rank-ordered list (e.g. every
// product by volume, not just the top 10) — same visual language as QaTable,
// with a Rank column and Prev/Next paging, mirroring QaCityChart's paging.
function QaRankedTable({title, titleExtra, note, entries, columns, onRowClick, activeKey}){
  const [page, setPage] = useState(0);
  const totalPages = Math.max(1, Math.ceil(entries.length / QA_RANKED_PAGE_SIZE));
  const pageClamped = Math.min(page, totalPages-1);
  const pageEntries = entries.slice(pageClamped*QA_RANKED_PAGE_SIZE, pageClamped*QA_RANKED_PAGE_SIZE+QA_RANKED_PAGE_SIZE);
  const btnStyle = (on)=>({padding:'4px 9px',fontSize:'11px',fontWeight:600,borderRadius:'5px',border:'0.5px solid #d6d3d1',background:on?'#fff':'#f5f5f4',color:on?'#1c1917':'#cbc9c6',cursor:on?'pointer':'not-allowed'});

  return (
    <div style={{display:'flex',flexDirection:'column',gap:'8px',flex:'1 1 280px',minWidth:'260px'}}>
      <QaTable title={`${title} — rank ${pageClamped*QA_RANKED_PAGE_SIZE+1}-${pageClamped*QA_RANKED_PAGE_SIZE+pageEntries.length} of ${entries.length}`}
        titleExtra={titleExtra}
        columns={[{key:'rank', label:'#', align:'right'}, ...columns]}
        rows={pageEntries.map((row,i)=>({...row, rank:pageClamped*QA_RANKED_PAGE_SIZE+i+1}))}
        onRowClick={onRowClick} activeKey={activeKey} note={note}/>
      <div style={{display:'flex',alignItems:'center',gap:'6px',padding:'0 4px'}}>
        <button onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={pageClamped<=0} style={btnStyle(pageClamped>0)}>‹ Prev</button>
        <button onClick={()=>setPage(p=>Math.min(totalPages-1,p+1))} disabled={pageClamped>=totalPages-1} style={btnStyle(pageClamped<totalPages-1)}>Next ›</button>
      </div>
    </div>
  );
}

function QaOutcomeBar({buckets}){
  const total = Object.values(buckets||{}).reduce((s,v)=>s+v,0) || 1;
  const order = [['Accepted','#1baf7a'],['Rejected','#e34948'],['In progress / other','#c3c2b7']];
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px',flex:'1 1 380px',minWidth:'320px'}}>
      <div style={{fontSize:'12px',fontWeight:600,marginBottom:'10px'}}>Quote outcomes</div>
      <div style={{display:'flex',height:'22px',borderRadius:'5px',overflow:'hidden',gap:'2px'}}>
        {order.map(([label,color])=>{
          const v = buckets[label]||0;
          const pct = v/total*100;
          return pct>0 ? <div key={label} style={{background:color,width:pct+'%',minWidth:pct>0?'2px':0}} title={label+': '+v.toLocaleString()}/> : null;
        })}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:'12px',marginTop:'10px'}}>
        {order.map(([label,color])=>(
          <div key={label} style={{display:'flex',alignItems:'center',gap:'5px',fontSize:'11px'}}>
            <span style={{width:'9px',height:'9px',borderRadius:'2px',background:color,flexShrink:0}}/>
            <span style={{color:'#57534e'}}>{label}</span>
            <span style={{fontWeight:600,color:'#1c1917'}}>{(buckets[label]||0).toLocaleString()}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// Simple annotated range bar for a 3-point distribution (p25/median/p75) —
// the trip-length numbers already exist as text in a table note; this gives
// them a visual read without inventing a new chart type.
// Real horizontal box plot: whiskers span min->max, the box spans
// p25->p75, with a median line through the box — standard box-plot
// conventions (not a slider look-alike, and not just the IQR span this
// used to show before whiskers were added).
function QaRangeBar({title, note, min, p25, median, p75, max, unit}){
  const W = 480, H = 104, padX = 20;
  const scaleMax = Math.max(max, 1);
  const x = v => padX + Math.min(1, v/scaleMax) * (W - padX*2);
  const midY = 64, boxH = 22;

  // p25/median/p75 often sit close together (e.g. filtered to one city, the
  // whole IQR can be a handful of days on a 1-30 day scale) — their 3 labels
  // would visually overlap if all drawn on one tier. Stagger any label whose
  // x-position is within MIN_GAP px of a previous one onto a lower tier
  // instead, so labels never merge into unreadable mush regardless of how
  // tightly the underlying values cluster.
  const MIN_GAP = 34;
  const topPoints = [
    {key:'p25', v:p25, label:'25th pct', bold:false},
    {key:'median', v:median, label:'Median', bold:true},
    {key:'p75', v:p75, label:'75th pct', bold:false},
  ].sort((a,b)=>x(a.v)-x(b.v));
  let lastX = -Infinity, tier = 0;
  const tiers = topPoints.map(p=>{
    const px = x(p.v);
    if (px - lastX < MIN_GAP) { tier++; } else { tier = 0; }
    lastX = px;
    return {...p, tier};
  });
  const tierStep = 12; // extra vertical offset per staggered tier (tightened to match the smaller label font)

  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px',flex:'1 1 480px',minWidth:'380px'}}>
      <div style={{fontSize:'12px',fontWeight:600,marginBottom:'10px'}}>{title}</div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block'}} role="img"
        aria-label={`Trip length: minimum ${min}, 25th percentile ${p25}, median ${median}, 75th percentile ${p75}, maximum ${max}${unit||''}`}>
        {/* Whiskers: min->p25 and p75->max */}
        <line x1={x(min)} x2={x(p25)} y1={midY} y2={midY} stroke="#a8a29e" strokeWidth="1.5"/>
        <line x1={x(p75)} x2={x(max)} y1={midY} y2={midY} stroke="#a8a29e" strokeWidth="1.5"/>
        <line x1={x(min)} x2={x(min)} y1={midY-8} y2={midY+8} stroke="#a8a29e" strokeWidth="1.5"/>
        <line x1={x(max)} x2={x(max)} y1={midY-8} y2={midY+8} stroke="#a8a29e" strokeWidth="1.5"/>

        {/* Box: IQR (p25-p75), with median line through it */}
        <rect x={x(p25)} y={midY-boxH/2} width={Math.max(2,x(p75)-x(p25))} height={boxH} fill={QA_CAT[0]} opacity="0.25" stroke={QA_CAT[0]} strokeWidth="1.5"/>
        <line x1={x(median)} x2={x(median)} y1={midY-boxH/2} y2={midY+boxH/2} stroke={QA_CAT[0]} strokeWidth="2.5"/>

        {/* Min/max labels below their whisker tips (fixed, never crowded — always at the far ends).
            Font sizes are ~35% smaller than the original (10/7 -> 6.5/4.5) so more staggered
            tiers fit vertically without clipping at the top of the SVG. */}
        <text x={x(min)} y={midY+20} fontSize="6.5" fill="#57534e" textAnchor="middle">{min}{unit||''}</text>
        <text x={x(min)} y={midY+27} fontSize="4.5" fill="#a8a29e" textAnchor="middle">Min</text>
        <text x={x(max)} y={midY+20} fontSize="6.5" fill="#57534e" textAnchor="middle">{max}{unit||''}</text>
        <text x={x(max)} y={midY+27} fontSize="4.5" fill="#a8a29e" textAnchor="middle">Max</text>

        {/* p25/median/p75: staggered onto extra tiers above the box when they'd otherwise overlap */}
        {tiers.map(p=>{
          const baseY = midY - boxH/2 - 11 - p.tier*tierStep;
          return (
          <g key={p.key}>
            {p.tier>0 && <line x1={x(p.v)} x2={x(p.v)} y1={baseY+6} y2={midY-boxH/2} stroke="#d6d3d1" strokeWidth="1" strokeDasharray="2,2"/>}
            <text x={x(p.v)} y={baseY} fontSize={p.bold?'7':'6.5'} fontWeight={p.bold?'700':'400'} fill={p.bold?'#1c1917':'#57534e'} textAnchor="middle">{p.v}{unit||''}</text>
            <text x={x(p.v)} y={baseY+7} fontSize="4.5" fill="#a8a29e" textAnchor="middle">{p.label}</text>
          </g>);
        })}
      </svg>
      {note && <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'8px'}}>{note}</div>}
    </div>
  );
}

// Stage-picker: same "rate per product" idea as the Accepted/Rejected
// acceptance-rate tables, but selectable by ANY decided stage (Rejected,
// Auto Rejected, On Ground, etc.) via a dropdown, instead of only Accepted.
// Picking a stage re-ranks all qualifying products (>=30 decided quotes) by
// what share of THEIR decided quotes landed in THAT specific stage.
function QaStagePicker({stageTotals, rateByStage, onRowClick, activeKey}){
  const stages = Object.entries(stageTotals||{}).sort((a,b)=>b[1]-a[1]);
  const [stage, setStage] = useState(stages.length ? stages[0][0] : '');
  const rows = rateByStage[stage] || [];

  const picker = (
    <select value={stage} onChange={e=>setStage(e.target.value)}
      style={{padding:'4px 8px',borderRadius:'6px',border:'0.5px solid #d6d3d1',fontSize:'11px',background:'#fff'}}>
      {stages.map(([name,n])=><option key={name} value={name}>{name} ({n.toLocaleString()})</option>)}
    </select>
  );

  return (
    // key=stage resets QaRankedTable's internal page state to 0 whenever the
    // stage changes, so switching stages never leaves you stranded on a page
    // number past the end of a shorter list.
    <QaRankedTable key={stage} title="Rate by decision, per product" titleExtra={picker} columns={[
        {key:'productname', label:'Product', wrap:true},
        {key:'n', label:'Decided quotes', align:'right', numeric:true},
        {key:'rate', label:stage+' %', align:'right', numeric:true, render:v=>v+'%'},
      ]} entries={rows} onRowClick={onRowClick} activeKey={activeKey}
      note={`Restricted to products with ≥30 decided quotes. "${stage} %" = what share of THIS product's decided quotes ended up in the "${stage}" stage specifically — same underlying data as the Accepted/Rejected tables above, just selectable by any stage instead of only Accepted.`}/>
  );
}

function QuotesAnalytics(){
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState(null);
  const [cityFilter, setCityFilter]     = useState(null);
  const [stageFilter, setStageFilter]   = useState(null);
  const [categoryFilter, setCategoryFilter] = useState(null);
  const [productFilter, setProductFilter] = useState(null);
  const [stateFilter, setStateFilter] = useState(null);

  // Every section below reacts to the same city/stage/category/product/state
  // filters — clicking a bar (or, for product, a table row) anywhere on this
  // tab scopes the whole tab, not just the chart it was clicked in.
  // filterQs() builds the shared query string once; each section's own
  // useEffect re-fetches whenever any filter changes.
  function filterQs(){
    const params = new URLSearchParams();
    if (cityFilter)     params.set('city', cityFilter);
    if (stageFilter)    params.set('stage', stageFilter);
    if (categoryFilter) params.set('category', categoryFilter);
    if (productFilter)  params.set('product', productFilter);
    if (stateFilter)    params.set('state', stateFilter);
    const qs = params.toString();
    return qs ? '?'+qs : '';
  }

  const [outcomes, setOutcomes]           = useState(null);
  const [outcomesError, setOutcomesError] = useState(null);
  const [outcomesLoading, setOutcomesLoading] = useState(true);

  useEffect(()=>{
    setOutcomesLoading(true);
    fetch('quotes/outcomes'+filterQs())
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(d=>{ setOutcomes(d); setOutcomesError(null); })
      .catch(()=>setOutcomesError('Could not load the outcomes/patterns report.'))
      .finally(()=>setOutcomesLoading(false));
  }, [cityFilter, stageFilter, categoryFilter, productFilter, stateFilter]);

  useEffect(()=>{
    setLoading(true); setError(null);
    fetch('quotes/analytics'+filterQs())
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setData)
      .catch(()=>setError('Could not load analytics — is the server running?'))
      .finally(()=>setLoading(false));
  }, [cityFilter, stageFilter, categoryFilter, productFilter, stateFilter]);

  function clickStage(label){ setStageFilter(f => f===label ? null : label); }
  function clickCity(label){ setCityFilter(f => f===label ? null : label); }
  function clickCategory(label){ setCategoryFilter(f => f===label ? null : label); }
  function clickProduct(label){ setProductFilter(f => f===label ? null : label); }
  function clickState(label){ setStateFilter(f => f===label ? null : label); }
  function clearAll(){ setCityFilter(null); setStageFilter(null); setCategoryFilter(null); setProductFilter(null); setStateFilter(null); }

  if (loading && !data) return <div style={empty}>Loading…</div>;
  if (error) return <div style={empty}>{error}</div>;
  if (!data) return <div style={empty}>No data.</div>;

  // The KPI tiles below reflect whichever single filter is currently most
  // specific to name in the label — city/state/product/category/stage, in
  // that priority order (city is the most common thing to click first).
  // When more than one filter is active, only the first-priority one is
  // named in the label, but the tiles' VALUES already reflect every active
  // filter combined (that scoping happens server-side in quotes_analytics()).
  const kpiScopeLabel = cityFilter ? ' — '+cityFilter
    : stateFilter ? ' — '+stateFilter
    : productFilter ? ' — '+productFilter
    : categoryFilter ? ' — '+categoryFilter
    : stageFilter ? ' — '+stageFilter
    : '';

  const hasFilter = !!(cityFilter || stageFilter || categoryFilter || productFilter || stateFilter);
  const filterPillStyle = {display:'inline-flex',alignItems:'center',gap:'6px',padding:'4px 10px',borderRadius:'99px',fontSize:'11px',fontWeight:600,background:TINT,color:'#27500A',border:'0.5px solid '+GREEN};
  const clearBtnStyle = {display:'inline-flex',alignItems:'center',justifyContent:'center',width:'15px',height:'15px',borderRadius:'50%',background:'#27500A',color:'#fff',fontSize:'10px',lineHeight:1,cursor:'pointer',flexShrink:0};

  return (
  <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:'14px',opacity:loading?0.6:1,transition:'opacity .15s'}}>
    <div style={{display:'flex',alignItems:'center',gap:'8px',minHeight:'26px',flexWrap:'wrap'}}>
      {!hasFilter && <div style={{fontSize:'11px',color:'#a8a29e'}}>Showing all quotes. Click a bar or pie slice below to filter.</div>}
      {stageFilter &&
        <span style={filterPillStyle}>Stage: {stageFilter}
          <span onClick={()=>setStageFilter(null)} style={clearBtnStyle} title="Clear this filter">✕</span>
        </span>}
      {cityFilter &&
        <span style={filterPillStyle}>City: {cityFilter}
          <span onClick={()=>setCityFilter(null)} style={clearBtnStyle} title="Clear this filter">✕</span>
        </span>}
      {categoryFilter &&
        <span style={filterPillStyle}>Category: {categoryFilter}
          <span onClick={()=>setCategoryFilter(null)} style={clearBtnStyle} title="Clear this filter">✕</span>
        </span>}
      {productFilter &&
        <span style={filterPillStyle}>Product: {productFilter}
          <span onClick={()=>setProductFilter(null)} style={clearBtnStyle} title="Clear this filter">✕</span>
        </span>}
      {stateFilter &&
        <span style={filterPillStyle}>State: {stateFilter}
          <span onClick={()=>setStateFilter(null)} style={clearBtnStyle} title="Clear this filter">✕</span>
        </span>}
      {hasFilter &&
        <button onClick={clearAll} style={{padding:'4px 10px',borderRadius:'99px',fontSize:'11px',fontWeight:600,border:'0.5px solid #d6d3d1',background:'#fff',color:'#57534e',cursor:'pointer'}}>Reset to all data</button>}
    </div>

    <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
      <QaStatTile label={'Total quotes'+kpiScopeLabel} value={data.totalQuotes.toLocaleString()}/>
      <QaStatTile label={'Total products'+kpiScopeLabel} value={data.totalProducts.toLocaleString()}/>
      <QaStatTile label={'Total hotels'+kpiScopeLabel} value={data.totalHotels.toLocaleString()}/>
      <QaStatTile label={'Avg products / quote'+kpiScopeLabel} value={data.avgProductsPerQuote}/>
    </div>
    <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
      <QaBarChart title="Quotes by stage" data={data.byStage} activeKey={stageFilter} onBarClick={clickStage} clickable/>
      <QaPieChart title="Product line items by category" data={data.byCategory} activeKey={categoryFilter} onSliceClick={clickCategory} clickable/>
    </div>
    <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
      <QaCityChart allCities={data.allCities} otherCitiesTotal={data.otherCitiesTotal}
        citiesBelowThresholdCount={data.citiesBelowThresholdCount} cityThreshold={data.cityThreshold}
        activeKey={cityFilter} onBarClick={clickCity} clickable/>
    </div>
    <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
      <QaBarChart title="Product line items by AU state (NZ and unmapped cities excluded)" data={data.byState}
        activeKey={stateFilter} onBarClick={clickState} clickable/>
    </div>

    <hr style={{border:'none',borderTop:'0.5px solid #e7e5e4',margin:'6px 0'}}/>
    <QaSectionTitle sub="From the Objective 2 findings report — reacts to the same city/stage/category/product filters above.">A book of near-misses: 96% of decided quotes are rejected</QaSectionTitle>

    {outcomesError && <div style={empty}>{outcomesError}</div>}
    {!outcomesError && !outcomes && <div style={empty}>Loading…</div>}

    {outcomes && <div style={{opacity:outcomesLoading?0.55:1,transition:'opacity .15s',display:'flex',flexDirection:'column',gap:'14px'}}>
      <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
        <QaStatTile label="Decided quotes" value={outcomes.decidedQuotes.toLocaleString()}/>
        <QaStatTile label="Acceptance rate" value={outcomes.acceptRate+'%'}/>
        <QaStatTile label="Median trip length" value={outcomes.tripLength.median+' days'}/>
        <QaStatTile label="Median hotels / quote" value={outcomes.hotelsPerQuote.median}/>
        <QaStatTile label={'Total hotels'+kpiScopeLabel} value={outcomes.hotelsPerQuote.total.toLocaleString()}/>
      </div>

      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <QaOutcomeBar buckets={outcomes.outcomeBuckets}/>
        <QaBarChart title="Trips by country region" data={outcomes.regionSplit}/>
        <QaRangeBar title="Trip length distribution" unit=" days"
          min={outcomes.tripLength.min} p25={outcomes.tripLength.p25} median={outcomes.tripLength.median}
          p75={outcomes.tripLength.p75} max={outcomes.tripLength.max}
          note="Same figures as the note on the routes table below, shown here as a box plot so the spread is visible at a glance — box is the middle 50% of trips, whiskers reach the shortest and longest trips actually quoted."/>
      </div>

      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <QaTable title="Most common routes" columns={[
            {key:'route', label:'Route', wrap:true},
            {key:'n', label:'Quotes', align:'right', numeric:true},
          ]} rows={Object.entries(outcomes.topRoutes).map(([route,n])=>({route,n:n.toLocaleString()}))}
          note={'Trip length: 25th pct '+outcomes.tripLength.p25+' days · median '+outcomes.tripLength.median+' · 75th pct '+outcomes.tripLength.p75+' days.'}/>
        <QaTable title="Most-booked hotels" columns={[
            {key:'name', label:'Hotel', wrap:true},
            {key:'n', label:'Quotes', align:'right', numeric:true},
          ]} rows={Object.entries(outcomes.topHotels).map(([name,n])=>({name,n:n.toLocaleString()}))}/>
      </div>

      <QaCallout title={`What "decided quotes" means`}>
        A quote is <b>decided</b> once it reaches a final Accepted or Rejected stage — quotes still
        sitting in an in-progress stage (pending, on hold, etc.) don't count yet either way, since we
        don't know their outcome. <b>Acceptance rate</b> below = decided-and-Accepted ÷ all decided,
        for that product. This is a different question from the "Products by volume" list further
        down, which ranks products by how <i>often they're quoted at all</i> — a product can be #1 by
        volume and mediocre by acceptance rate, or the reverse; they don't have to agree.
      </QaCallout>

      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <QaTable title="Products most likely to be accepted (by acceptance rate)" columns={[
            {key:'productname', label:'Product', wrap:true},
            {key:'n', label:'Decided quotes', align:'right', numeric:true},
            {key:'acceptRate', label:'Accept %', align:'right', numeric:true, render:v=>v+'%'},
          ]} rows={outcomes.topAcceptingProducts}
          onRowClick={row=>clickProduct(row.productname)} activeKey={productFilter}
          note={'Restricted to products with ≥30 decided quotes ('+outcomes.productsWithEnoughData+' qualify) — small-sample noise excluded, same threshold as the written report.'}/>
        <QaTable title="Products most likely to be rejected (by acceptance rate)" columns={[
            {key:'productname', label:'Product', wrap:true},
            {key:'n', label:'Decided quotes', align:'right', numeric:true},
            {key:'acceptRate', label:'Accept %', align:'right', numeric:true, render:v=>v+'%'},
          ]} rows={outcomes.bottomAcceptingProducts}
          onRowClick={row=>clickProduct(row.productname)} activeKey={productFilter}
          note="Worth a closer look — either priced wrong, poorly matched, or otherwise turning customers away every time they're included."/>
      </div>

      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <QaStagePicker stageTotals={outcomes.stageTotals} rateByStage={outcomes.rateByStage}
          onRowClick={row=>clickProduct(row.productname)} activeKey={productFilter}/>
      </div>

      <QaSectionTitle sub="A completely different ranking from the acceptance-rate tables above — this is popularity (how often a product is quoted at all), not success rate. Across all 92,124 product line items ever quoted.">The product catalog is far more concentrated than it looks</QaSectionTitle>
      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <div style={{display:'flex',flexDirection:'column',gap:'10px',flex:'0 1 220px',minWidth:'180px'}}>
          <QaStatTile label="Distinct products ever quoted" value={outcomes.catalog.distinctProducts.toLocaleString()}/>
          <QaStatTile label="Total product line items" value={outcomes.catalog.totalLineItems.toLocaleString()}/>
          <QaStatTile label="Products → 80% of volume" value={outcomes.catalog.eightyPctAtRankPct+'%'}/>
        </div>
        <QaParetoChart title="Cumulative share of product line items, by product rank"
          note="A steep early climb means a small set of products dominates what's actually sold — this ranks by HOW OFTEN a product appears, not whether it gets accepted."
          points={outcomes.catalog.pareto} eightyPctAtRankPct={outcomes.catalog.eightyPctAtRankPct}/>
        <QaRankedTable title="Products by volume (how often quoted, not acceptance rate)" columns={[
            {key:'productname', label:'Product', wrap:true},
            {key:'n', label:'Line items', align:'right', numeric:true},
          ]} entries={Object.entries(outcomes.catalog.byVolumeRanked).map(([name,n])=>({productname:name, n:n.toLocaleString()}))}
          onRowClick={row=>clickProduct(row.productname)} activeKey={productFilter}
          note="Ranked by line-item volume across the whole catalog — the top of this list is what's driving the steep early climb in the chart alongside. Not related to acceptance rate."/>
      </div>
    </div>}

    <QaCallout title="Read this before using any figure above" tone="crit">
      The source extract carries <b>no price, no passenger count, and no quote-creation date</b>.
      In FIT travel, price is usually the dominant rejection driver — so acceptance-rate figures
      above describe the <i>composition</i> of quotes, not the <i>cause</i> of rejection. The
      per-product acceptance table is the one exception worth trusting directionally (real
      variation, not noise) — trip length, stop count, and region were all tested and found flat
      against the ~4% baseline, so treat those as ruled out, not unexplored.
    </QaCallout>

  </div>);
}

function QuotesCumulativeAnalytics(){
  // Dataset-wide reference report: seasonality + products deep-dive, plus the
  // states section (minus the removed board/competitor table). Deliberately
  // has NO city/stage/category/product filter state — per product-owner
  // decision this doesn't fit the click-a-bar filter model of the Analytics
  // tab, so every fetch below is unfiltered (no query string at all).
  const [season, setSeason]           = useState(null);
  const [seasonError, setSeasonError] = useState(null);
  const [seasonLoading, setSeasonLoading] = useState(true);

  useEffect(()=>{

    fetch('quotes/seasonality')
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(d=>{ setSeason(d); setSeasonError(null); })
      .catch(()=>setSeasonError('Could not load the seasonality report.'))
      .finally(()=>setSeasonLoading(false));

  const [statesError, setStatesError] = useState(null);
  const [statesLoading, setStatesLoading] = useState(true);

  useEffect(()=>{
    setStatesLoading(true);
    fetch('quotes/states')
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(d=>{ setStates(d); setStatesError(null); })
      .catch(()=>setStatesError('Could not load the state breakdown.'))
      .finally(()=>setStatesLoading(false));
  }, []);

  const [products, setProducts]           = useState(null);
  const [productsError, setProductsError] = useState(null);

  useEffect(()=>{
    setProductsLoading(true);

      .then(d=>{ setProducts(d); setProductsError(null); })

  return (
  <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:'14px'}}>

    {seasonError && <div style={empty}>{seasonError}</div>}
    {!seasonError && !season && <div style={empty}>Loading…</div>}

    {season && <div style={{opacity:seasonLoading?0.55:1,transition:'opacity .15s',display:'flex',flexDirection:'column',gap:'14px'}}>
      <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
        <QaStatTile label="Quotes considered" value={season.totalQuotes.toLocaleString()}/>
        <QaStatTile label="Quotes with a travel date" value={season.datedQuotes.toLocaleString()}/>
        <QaStatTile label="Coverage" value={season.coveragePct+'%'}/>
        <QaStatTile label="Peak month" value={Object.entries(season.byMonth).sort((a,b)=>b[1]-a[1])[0][0]}/>
      </div>

      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <QaBarChart title="Travel volume by month (all years)" data={season.byMonth}/>
        <QaBarChart title="Share of dated quotes by season" data={season.bySeason}/>
        <QaBarChart title="Dated quotes by year" data={Object.fromEntries(Object.entries(season.byYear).sort((a,b)=>a[0]-b[0]))}/>
      </div>

      <QaTable title="Seasonal share by country (% of that country's dated quotes)" columns={[
          {key:'country', label:'Country'},
          ...Object.keys(season.seasonalityByCountry.AU||{}).map(m=>({key:m, label:m, align:'right', numeric:true, render:v=>v+'%'})),
        ]} rows={Object.entries(season.seasonalityByCountry).map(([country,months])=>({country, ...months}))}
        compact
        note="Plotted as share-of-country rather than raw count, since AU carries roughly 3× NZ's volume — the two calendars are otherwise not comparable."/>

      <QaHeatmap title="City demand by travel month (top 12 cities, % of that city's dated quotes)"
        note="Read across a row, not down a column — Australia and New Zealand cities show visibly different bands."
        rows={season.cityHeatmap} months={['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']}/>

      <QaTable title="Loss rate by travel month, 2026 only" columns={[
          {key:'month', label:'Month'},
          {key:'n', label:'Quotes', align:'right', numeric:true},
          {key:'lostPct', label:'Lost %', align:'right', numeric:true, render:v=>v+'%'},
          {key:'openPct', label:'Still open %', align:'right', numeric:true, render:v=>v+'%'},
        ]} rows={Object.entries(season.lossRateByMonth2026).map(([month,v])=>({month, ...v}))}
        compact
        note="Falls from ~92% in January to ~25% in December — but this is NOT seasonality. It's snapshot maturity: this data was pulled in Aug 2026, so trips departing before then have already been decided (mostly rejected, in a book that loses 84% overall), while trips departing after are still open and haven't had a chance to be rejected yet. Volume by month above is valid; conversion/win-rate by month is not comparable without a quote-creation date and a fixed decision window, neither of which exist in this data."/>
    </div>}

    <hr style={{border:'none',borderTop:'0.5px solid #e7e5e4',margin:'6px 0'}}/>
    <QaSectionTitle sub="Product city mapped to its Australian state — NZ cities and anything unmapped are excluded here, not folded in silently. Dataset-wide report, not affected by filters.">Which states we actually quote, vs. what boards promote and competitors sell</QaSectionTitle>

      </div>

      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <QaBarChart title="Product line items by AU state" data={states.byState}/>

          {key:'state', label:'State'},
          {key:'top', label:'Leading categories (share of that state\'s lines)', wrap:true},
        ]} rows={Object.entries(states.byStateCategory).map(([state,cats])=>{
          const total = Object.values(cats).reduce((s,v)=>s+v,0);
          const top = Object.entries(cats).slice(0,4).map(([c,v])=>c+' '+Math.round(v/total*100)+'%').join(' · ');
          return {state, top};
        })}
        note="Categories ranked within each state by their own share of that state's product lines, not compared across states directly — a state with far fewer total lines can still show a meaningful mix."/>
    </div>}

    <hr style={{border:'none',borderTop:'0.5px solid #e7e5e4',margin:'6px 0'}}/>
    <QaSectionTitle sub="Category mix barely moves with trip length; a handful of products are genuinely single-city while others (mostly generic line items like 'Car Hire' or restaurant meals) spread across the whole network. Dataset-wide report, not affected by filters.">What products and categories actually look like, once you dig in</QaSectionTitle>

    {productsError && <div style={empty}>{productsError}</div>}
    {!productsError && !products && <div style={empty}>Loading…</div>}

    {products && <div style={{opacity:productsLoading?0.55:1,transition:'opacity .15s',display:'flex',flexDirection:'column',gap:'14px'}}>

        <QaStatTile label="Products analyzed for comment rate (≥30 line items)" value={products.comments.productsWithEnoughData.toLocaleString()}/>
      </div>

      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <QaTable title="Most single-city products (≥30 line items)" columns={[
            {key:'productname', label:'Product', wrap:true},
            {key:'topCity', label:'City'},
            {key:'topCityShare', label:'Share', align:'right', numeric:true, render:v=>v+'%'},
            {key:'totalLineItems', label:'Lines', align:'right', numeric:true},
          ]} rows={products.cityConcentration.mostConcentrated.map(p=>({...p, topCity:p.topCity.replace(/\b\w/g,c=>c.toUpperCase())}))}
          note="These products are effectively tied to one city — no surprise for tickets like Movie World/Sea World, but useful confirmation the data behaves as expected."/>
        <QaTable title="Most network-wide products (≥30 line items)" columns={[
            {key:'productname', label:'Product', wrap:true},
            {key:'distinctCities', label:'Cities', align:'right', numeric:true},
            {key:'topCityShare', label:'Top city share', align:'right', numeric:true, render:v=>v+'%'},
            {key:'totalLineItems', label:'Lines', align:'right', numeric:true},
          ]} rows={products.cityConcentration.mostSpread}
          note="Mostly generic catch-all line items (car hire, restaurant meals, a day guide) rather than named attractions — makes sense, since these are booked wherever a quote happens to need them, not tied to a destination."/>
      </div>

      <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
        <QaTable title="Products most likely to carry a comment (≥30 line items)" columns={[
            {key:'productname', label:'Product', wrap:true},
            {key:'commentRate', label:'Has comment', align:'right', numeric:true, render:v=>v+'%'},
            {key:'total', label:'Lines', align:'right', numeric:true},
          ]} rows={products.comments.topCommentProducts}
          note={`Car hire products lead by a wide margin (93-100%) — makes sense, since a rental always needs pickup/license details spelled out. Comments exist on ${products.comments.totalWithComment.toLocaleString()} line items overall, median length ${products.comments.medianCommentLength} characters, restricted here to products with ≥30 line items so the rate isn't noise.`}/>

      </div>
    </div>}

function QaStackedBands({title, bands}){
  const bandOrder = ['1-4d','5-7d','8-10d','11-13d','14-16d','17d+'];
  const cats = [...new Set(Object.values(bands||{}).flatMap(b=>Object.keys(b.categoryShare)))];
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px'}}>
      <div style={{fontSize:'12px',fontWeight:600,marginBottom:'10px'}}>{title}</div>
      <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
        {bandOrder.filter(b=>bands[b]).map(band=>{
          const b = bands[band];
          return (
          <div key={band} style={{display:'flex',alignItems:'center',gap:'10px'}}>
            <div style={{width:'56px',minWidth:'56px',fontSize:'11px',color:'#57534e',textAlign:'right'}}>{band}</div>
            <div style={{flex:1,display:'flex',height:'20px',borderRadius:'4px',overflow:'hidden',gap:'2px'}}>
              {Object.entries(b.categoryShare).map(([cat,pct],i)=>{
                const idx = cats.indexOf(cat);
                return pct>0 ? <div key={cat} title={cat+': '+pct+'%'} style={{background:QA_CAT[idx%QA_CAT.length],width:pct+'%',minWidth:pct>0?'2px':0}}/> : null;
              })}
            </div>
            <div style={{width:'70px',minWidth:'70px',fontSize:'10px',color:'#a8a29e',textAlign:'right'}}>{b.totalLineItems.toLocaleString()} lines</div>
          </div>);
        })}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:'10px',marginTop:'12px'}}>
        {cats.map((cat,i)=>(
          <div key={cat} style={{display:'flex',alignItems:'center',gap:'5px',fontSize:'11px'}}>
            <span style={{width:'9px',height:'9px',borderRadius:'2px',background:QA_CAT[i%QA_CAT.length],flexShrink:0}}/>
            <span style={{color:'#57534e'}}>{cat}</span>
          </div>
        ))}
      </div>
      <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'8px'}}>Each row sums to 100% of that band's own product lines — the mix is strikingly flat across trip lengths (Transfers ~40%, Attraction/Tour ~22-28% regardless of how long the trip is).</div>
    </div>
  );
}

function QuotesPairings(){
  const [mode, setMode]   = useState('product'); // 'product' | 'city'
  const [data, setData]   = useState(null);
  const [error, setError] = useState(null);

  useEffect(()=>{
    setData(null); setError(null);
    fetch(mode==='city' ? 'quotes/city-cooccurrence' : 'quotes/cooccurrence')
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setData)
      .catch(()=>setError('Could not load pairing data — is the server running?'));
  }, [mode]);

  const modeBtn = (k)=>({padding:'5px 12px',borderRadius:'6px',fontSize:'12px',fontWeight:600,border:'0.5px solid '+(mode===k?GREEN:'#d6d3d1'),background:mode===k?TINT:'#fff',color:mode===k?'#27500A':'#57534e',cursor:'pointer'});
  const aLabel = mode==='city' ? 'City A' : 'Product A';
  const bLabel = mode==='city' ? 'City B' : 'Product B';
  const ifLabel = mode==='city' ? 'If quote touches…' : 'If quote has…';
  const thenLabel = mode==='city' ? '…then it almost always also touches' : '…then it almost always also has';

  return (
  <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:'14px',overflowY:'auto'}}>
    <div style={{display:'flex',gap:'8px'}}>
      <button onClick={()=>setMode('product')} style={modeBtn('product')}>By product</button>
      <button onClick={()=>setMode('city')} style={modeBtn('city')}>By city</button>
    </div>

    {error && <div style={empty}>{error}</div>}
    {!error && !data && <div style={empty}>Loading…</div>}

    {data && <React.Fragment>
    <QaSectionTitle sub={`Support ≥ ${data.minPairSupport} quotes, lift ≥ ${data.minLift} — pairs retained: ${data.pairsRetained.toLocaleString()} out of all ${mode==='city'?'city':'product'} pairs seen.`}>
      {mode==='city'
        ? 'Which cities travel together — the multi-city routes that keep showing up'
        : 'What goes with what — mostly outbound/return transfers, the single most common thing a quote-build checker should catch'}
    </QaSectionTitle>

    <QaTable title="Strongest pairings by lift" columns={[
        {key:'a', label:aLabel, wrap:true},
        {key:'b', label:bLabel, wrap:true},
        {key:'n', label:'Together', align:'right', numeric:true},
        {key:'lift', label:'Lift', align:'right', numeric:true},
        {key:'confAToB', label:'P(B|A)', align:'right', numeric:true, render:v=>v+'%'},
      ]} rows={data.topPairs.map(p=>({a:p.a, b:p.b, n:p.nTogether.toLocaleString(), lift:p.lift, confAToB:Math.round(p.confAToB*100)}))}
      note="Lift = how much more often these two appear together than chance would predict (1.0 = no association). Higher lift with a real support floor means genuinely associated, not just both-popular."/>

    <QaTable title={`High-confidence rules — if A is present, B is almost always expected (${data.totalRulesCount} total, top 20 shown)`} columns={[
        {key:'if', label:ifLabel, wrap:true},
        {key:'then', label:thenLabel, wrap:true},
        {key:'confidence', label:'Confidence', align:'right', numeric:true, render:v=>v+'%'},
        {key:'n', label:'n', align:'right', numeric:true},
      ]} rows={data.highConfidenceRules.map(r=>({if:r.if, then:r.then, confidence:Math.round(r.confidence*100), n:r.n.toLocaleString()}))}
      note={mode==='city'
        ? '≥50% confidence — when the first city is touched, the second is present in at least this share of those quotes. Lower bar than the product view since city pairs naturally cluster closer to chance (far fewer distinct cities than products).'
        : '≥75% confidence — when the first product appears, the second is present in at least this share of those quotes. A likely quote-build checklist: if A is added and B isn\'t, flag it.'}/>
    </React.Fragment>}
  </div>);
}

  const subTabBtn = (k)=>({padding:'6px 14px',borderRadius:'6px',fontSize:'12px',fontWeight:600,border:'0.5px solid '+(tab===k?GREEN:'#d6d3d1'),background:tab===k?TINT:'#fff',color:tab===k?'#27500A':'#57534e',cursor:'pointer'});

  useEffect(()=>{
    setLoading(true); setError(null);
    const params = new URLSearchParams();
    if (stage) params.set('stage', stage);
    if (q.trim()) params.set('q', q.trim());
    const qs = params.toString();
    fetch('quotes'+(qs?'?'+qs:''))
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(data=>setRows(Array.isArray(data)?data:[]))
      .catch(()=>setError('Could not load quotes — is the server running?'))
      .finally(()=>setLoading(false));
  }, [stage, q]);

  function toggleRow(no){
    if (openNo===no){ setOpenNo(null); setDetail(null); return; }
    setOpenNo(no); setDetail(null); setDetailLoading(true);
    fetch('quotes/'+encodeURIComponent(no))
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setDetail)
      .catch(()=>setDetail({error:true}))
      .finally(()=>setDetailLoading(false));
  }

  const stages = useMemo(()=>{
    const s = new Set(); rows.forEach(r=>s.add(r.quotestage));
    return [...s].sort();
  }, [rows]);

  const inputStyle = {padding:'6px 10px',borderRadius:'6px',border:'0.5px solid #d6d3d1',fontSize:'12px',background:'#fff'};

  if (tab==='analytics') {
    return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{padding:'14px 16px 0',display:'flex',gap:'8px'}}>
        <button onClick={()=>setTab('list')} style={subTabBtn('list')}>List</button>
        <button onClick={()=>setTab('analytics')} style={subTabBtn('analytics')}>Analytics</button>
        <button onClick={()=>setTab('cumulative')} style={subTabBtn('cumulative')}>Cumulative Analytics</button>
        <button onClick={()=>setTab('templates')} style={subTabBtn('templates')}>Templates</button>
        <button onClick={()=>setTab('pairings')} style={subTabBtn('pairings')}>Pairings</button>
      </div>
      <QuotesAnalytics/>
    </div>);
  }

  if (tab==='cumulative') {
    return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{padding:'14px 16px 0',display:'flex',gap:'8px'}}>
        <button onClick={()=>setTab('list')} style={subTabBtn('list')}>List</button>
        <button onClick={()=>setTab('analytics')} style={subTabBtn('analytics')}>Analytics</button>
        <button onClick={()=>setTab('cumulative')} style={subTabBtn('cumulative')}>Cumulative Analytics</button>
        <button onClick={()=>setTab('templates')} style={subTabBtn('templates')}>Templates</button>
        <button onClick={()=>setTab('pairings')} style={subTabBtn('pairings')}>Pairings</button>
      </div>
      <QuotesCumulativeAnalytics/>
    </div>);
  }

  if (tab==='templates') {
    return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      <div style={{padding:'14px 16px 0',display:'flex',gap:'8px'}}>
        <button onClick={()=>setTab('list')} style={subTabBtn('list')}>List</button>
        <button onClick={()=>setTab('analytics')} style={subTabBtn('analytics')}>Analytics</button>
        <button onClick={()=>setTab('cumulative')} style={subTabBtn('cumulative')}>Cumulative Analytics</button>
        <button onClick={()=>setTab('templates')} style={subTabBtn('templates')}>Templates</button>
        <button onClick={()=>setTab('pairings')} style={subTabBtn('pairings')}>Pairings</button>
      </div>
      <QuotesTemplates/>
    </div>);
  }

  if (tab==='pairings') {
    return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      <div style={{padding:'14px 16px 0',display:'flex',gap:'8px'}}>
        <button onClick={()=>setTab('list')} style={subTabBtn('list')}>List</button>
        <button onClick={()=>setTab('analytics')} style={subTabBtn('analytics')}>Analytics</button>
        <button onClick={()=>setTab('cumulative')} style={subTabBtn('cumulative')}>Cumulative Analytics</button>
        <button onClick={()=>setTab('templates')} style={subTabBtn('templates')}>Templates</button>
        <button onClick={()=>setTab('pairings')} style={subTabBtn('pairings')}>Pairings</button>
      </div>
      <QuotesPairings/>
    </div>);
  }

  return (
  <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:'12px'}}>
    <div style={{display:'flex',gap:'8px'}}>
      <button onClick={()=>setTab('list')} style={subTabBtn('list')}>List</button>
      <button onClick={()=>setTab('analytics')} style={subTabBtn('analytics')}>Analytics</button>
      <button onClick={()=>setTab('templates')} style={subTabBtn('templates')}>Templates</button>
      <button onClick={()=>setTab('pairings')} style={subTabBtn('pairings')}>Pairings</button>
    </div>
    <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search quote number…" style={Object.assign({},inputStyle,{flex:'1 1 220px',minWidth:0})}/>
      <select value={stage} onChange={e=>setStage(e.target.value)} style={inputStyle}>
        <option value="">All stages</option>
        {stages.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
    </div>

    {loading && <div style={empty}>Loading…</div>}
    {!loading && error && <div style={empty}>{error}</div>}
    {!loading && !error && !rows.length && <div style={empty}>No quotes match this filter.</div>}

    {!loading && !error && !!rows.length &&
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',overflow:'hidden'}}>
      <div style={{display:'flex',padding:'8px 14px',borderBottom:'0.5px solid #e7e5e4',fontSize:'11px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.03em'}}>
        <div style={{flex:'1 1 140px'}}>Quote #</div>
        <div style={{flex:'2 1 240px'}}>Stage</div>
        <div style={{flex:'1 1 100px'}}>Products</div>

        <div key={r.quote_no}>

            <div style={{flex:'1 1 140px',fontWeight:600}}>{r.quote_no}</div>
            <div style={{flex:'2 1 240px'}}>{r.quotestage}</div>
            <div style={{flex:'1 1 100px'}}>{r.product_count}</div>

          {openNo===r.quote_no &&
          <div style={{padding:'10px 14px 14px 14px',background:'#fafaf9',borderBottom:'0.5px solid #f1f0ef'}}>
            {detailLoading && <div style={{fontSize:'12px',color:'#a8a29e'}}>Loading…</div>}
            {!detailLoading && detail && detail.error && <div style={{fontSize:'12px',color:'#8C2F1E'}}>Could not load this quote.</div>}
            {!detailLoading && detail && !detail.error &&
            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              {!!(detail.products||[]).length &&
              <div>
                <Label>Products</Label>

                <Label>Hotels</Label>

            </div>}
          </div>}

      ))}
    </div>}
  </div>);
}

function AnalyticsView({catalog, THEMES}){
  const stats = useMemo(()=>{
    const allRows = Object.values(catalog).flatMap(s=>s.allRows||[]);
    const allTpls = Object.values(catalog).flatMap(s=>s.templates||[]);

    // de-duplicate tours by url+source (allRows has one row per day)
    const tourMap = new Map();
    allRows.forEach(r=>{ const k=r.url||r.tour; if(!tourMap.has(k)) tourMap.set(k,r); });
    const tours = [...tourMap.values()];

    // headline
    const totalDayRows = allRows.length;
    const totalTours   = tours.length;
    const uniqueSources = new Set(tours.map(t=>t.source)).size;
    const uniqueCities  = new Set(allRows.map(r=>r.city).filter(Boolean)).size;

    // tours by source (colored by type)
    const srcMap = new Map();
    tours.forEach(t=>{
      if(!srcMap.has(t.source)) srcMap.set(t.source,{v:0,type:t.type});
      srcMap.get(t.source).v++;
    });
    const bySource = [...srcMap.entries()].map(([label,x])=>({label,v:x.v,type:x.type})).sort((a,b)=>b.v-a.v);

    // tours by market
    const mktMap = new Map();
    tours.forEach(t=>{ const m=t.sourceLocation||'Unknown'; mktMap.set(m,(mktMap.get(m)||0)+1); });
    const byMarket = [...mktMap.entries()].map(([label,v])=>({label,v})).sort((a,b)=>b.v-a.v);

    // competitor vs board
    const compCount  = tours.filter(t=>t.type==='Competitor').length;
    const boardCount = tours.filter(t=>t.type==='Board').length;

    // tours per state
    const stateMap = new Map();
    Object.entries(catalog).forEach(([abbr, sd])=>{
      const stateUrls = new Set((sd.allRows||[]).map(r=>r.url||r.tour));
      stateMap.set(abbr, stateUrls.size);
    });
    const byState = [...stateMap.entries()].map(([label,v])=>({label,v})).sort((a,b)=>b.v-a.v);

    // comp vs board per state
    const stateCompBoard = Object.entries(catalog).map(([abbr,sd])=>{
      const stateRows = sd.allRows||[];
      const seen = new Map();
      stateRows.forEach(r=>{ const k=r.url||r.tour; if(!seen.has(k)) seen.set(k,r.type); });
      let comp=0,board=0;
      seen.forEach(t=>{ if(t==='Competitor') comp++; else board++; });
      return {label:abbr, Competitor:comp, Board:board};
    }).sort((a,b)=>(b.Competitor+b.Board)-(a.Competitor+a.Board));

    // top 20 cities by day-visits
    const cityCount = new Map();
    allRows.forEach(r=>{ if(r.city) cityCount.set(r.city,(cityCount.get(r.city)||0)+1); });
    const topCities = [...cityCount.entries()].map(([label,v])=>({label,v})).sort((a,b)=>b.v-a.v).slice(0,20);

    // theme frequency
    const themeCount = new Map();
    allRows.forEach(r=>{
      if(r.themes)(r.themes.split(',').map(t=>t.trim()).filter(Boolean)).forEach(t=>themeCount.set(t,(themeCount.get(t)||0)+1));
    });
    allTpls.forEach(t=>(t.themes||[]).forEach(th=>themeCount.set(th,(themeCount.get(th)||0)+1)));
    const byTheme = [...themeCount.entries()].map(([label,v])=>({label,v})).sort((a,b)=>b.v-a.v).slice(0,15);

    // duration distribution (from templates — have days[])
    const buckets = [
      {label:'1–5 days', min:1, max:5, Competitor:0, Board:0},
      {label:'6–7 days', min:6, max:7, Competitor:0, Board:0},
      {label:'8–10 days', min:8, max:10, Competitor:0, Board:0},
      {label:'11–14 days', min:11, max:14, Competitor:0, Board:0},
      {label:'15+ days', min:15, max:999, Competitor:0, Board:0},
    ];
    allTpls.forEach(t=>{
      const d=(t.days||[]).length||1;
      const b=buckets.find(b=>d>=b.min&&d<=b.max);
      if(b) b[t.type==='Competitor'?'Competitor':'Board']++;
    });

    return {totalDayRows,totalTours,uniqueSources,uniqueCities,bySource,byMarket,compCount,boardCount,byState,topCities,byTheme,buckets,stateCompBoard};
  }, [catalog]);

  const COMP_COL  = '#E8732A';
  const BOARD_COL = '#1D9E75';
  const MKT_COLORS = ['#185FA5','#1D9E75','#E8732A','#9333EA','#0D9488','#DC2626','#F59E0B'];

  const secHead = (txt,sub) => (
    <div style={{marginBottom:'12px',marginTop:'4px'}}>
      <div style={{fontSize:'13px',fontWeight:700,color:'#1c1917'}}>{txt}</div>
      {sub && <div style={{fontSize:'11px',color:'#a8a29e',marginTop:'2px'}}>{sub}</div>}
    </div>
  );

  return (
    <div style={{padding:'18px 20px',display:'flex',flexDirection:'column',gap:'20px',maxWidth:'1200px'}}>

      {/* ── Headline metrics ── */}
      {secHead('Dataset Overview', 'Across all states currently loaded')}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'10px'}}>
        {[
          ['Total Tours', stats.totalTours, 'unique itineraries'],
          ['Day-Rows', stats.totalDayRows, 'individual day entries'],
          ['Sources', stats.uniqueSources, 'operators & boards'],
          ['Cities', stats.uniqueCities, 'distinct cities covered'],
        ].map(([label,num,sub])=>(
          <div key={label} style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'8px',padding:'14px 16px'}}>
            <div style={{fontSize:'10px',color:'#57534e',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'4px'}}>{label}</div>
            <div style={{fontSize:'26px',fontWeight:700,color:'#1c1917'}}>{num.toLocaleString()}</div>
            <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'2px'}}>{sub}</div>
          </div>
        ))}
      </div>

      {/* ── Competitor vs Board ── */}
      {secHead('Competitor vs Board', 'Operators we compete with vs tourism boards')}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
        <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'8px',padding:'16px'}}>
          <div style={{fontSize:'11px',fontWeight:700,color:'#57534e',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'12px'}}>Tour type split</div>
          <div style={{display:'flex',gap:'12px',alignItems:'stretch'}}>
            {[['Competitor', stats.compCount, COMP_COL],['Board', stats.boardCount, BOARD_COL]].map(([label,n,col])=>(
              <div key={label} style={{flex:1,background:col+'18',border:`1px solid ${col}40`,borderRadius:'8px',padding:'14px',textAlign:'center'}}>
                <div style={{fontSize:'28px',fontWeight:700,color:col}}>{n}</div>
                <div style={{fontSize:'11px',color:col,fontWeight:600,marginTop:'4px'}}>{label}</div>
                <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'2px'}}>{Math.round(n/(stats.compCount+stats.boardCount)*100)}%</div>
              </div>
            ))}
          </div>
        </div>
        <GroupedHBar items={stats.stateCompBoard} title="Competitor vs Board by State"
          keys={['Competitor','Board']} colors={{Competitor:COMP_COL,Board:BOARD_COL}} labelWidth={50}/>
      </div>

      {/* ── Source & Market ── */}
      {secHead('Source & Market Breakdown', 'Which operators and origin markets contribute the most tours')}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
        <HBar items={stats.bySource} title="Tours by Source"
          colorFn={x=>x.type==='Competitor'?COMP_COL:BOARD_COL} labelWidth={170}
          note="Orange = Competitor · Teal = Board"/>
        <HBar items={stats.byMarket} title="Tours by Origin Market"
          colorFn={(x,i)=>MKT_COLORS[stats.byMarket.indexOf(x)%MKT_COLORS.length]} labelWidth={120}/>
      </div>

      {/* ── Geography ── */}
      {secHead('Geography', 'State coverage and top cities by day-visit volume')}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
        <HBar items={stats.byState} title="Tours per State" labelWidth={60}
          colorFn={()=>BOARD_COL}/>
        <HBar items={stats.topCities} title="Top 20 Cities (by day-row count)" labelWidth={140}
          colorFn={()=>'#185FA5'} note="Each day spent in a city = 1 count"/>
      </div>

      {/* ── Themes & Duration ── */}
      {secHead('Themes & Duration', 'What themes dominate and how long are tours')}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
        <HBar items={stats.byTheme} title="Top 15 Themes (day-row + template frequency)"
          colorFn={()=>'#9333EA'} labelWidth={160}/>
        <GroupedHBar items={stats.buckets} title="Duration Distribution"
          keys={['Competitor','Board']} colors={{Competitor:COMP_COL,Board:BOARD_COL}} labelWidth={90}
          note="Tour length bucketed from template day count"/>
      </div>

    </div>
  );
}
