// ════════════════════════════════════════════════════════════
// Consumer Analysis — state-overlap market fit, computed only from
// real scraped tours in window.MARKET_DATA (no hardcoded affinity numbers).
// ════════════════════════════════════════════════════════════

const CA_MARKETS = ['India', 'Singapore', 'UK', 'Australia', 'New Zealand'];
const CA_FLAGS = {India:'🇮🇳', Singapore:'🇸🇬', UK:'🇬🇧', Australia:'🇦🇺', 'New Zealand':'🇳🇿'};

// One market's real historical state distribution: % of that market's tours
// (deduped by name+source) that touch each state, plus the tour count (n)
// so low-confidence markets read differently from high-confidence ones.
function buildMarketStateProfiles(){
  const allTours = window.MARKET_DATA || [];
  const profiles = {};
  CA_MARKETS.forEach(market=>{
    const tours = allTours.filter(t=>t.market===market);
    const n = tours.length;
    const stateTourCounts = {};
    tours.forEach(t=>{
      const states = new Set(t.states && t.states.length ? t.states : (t.state ? [t.state] : []));
      states.forEach(s=>{ stateTourCounts[s] = (stateTourCounts[s]||0) + 1; });
    });
    const pct = {};
    Object.entries(stateTourCounts).forEach(([s,c])=>{ pct[s] = c / (n || 1); });
    profiles[market] = {n, pct};
  });
  return profiles;
}

// The Builder session is single-state (every day belongs to the currently
// selected stateKey — see App()'s `cur = catalog[stateKey]`).
function itineraryHasContent(days){
  return (days||[]).some(d => (d.location && d.location.trim()) || (d.products && d.products.length));
}

// Fit score per market = % of that market's own real tours that visit the
// currently selected state. e.g. if 8% of India tours visit WA, and WA is
// the selected state, India's fit score is 8%.
function computeMarketFitScores(days, stateKey){
  const totalDaysWithLocation = (days||[]).filter(d =>
    (d.location && d.location.trim()) || (d.products && d.products.length)
  ).length;
  const hasContent = !!stateKey && totalDaysWithLocation > 0;
  const profiles = buildMarketStateProfiles();
  const statesUsed = hasContent ? [stateKey] : [];
  const scores = CA_MARKETS.map(market=>{
    const profile = profiles[market];
    const raw = hasContent ? (profile.pct[stateKey] || 0) : 0;
    const score = Math.min(100, Math.round(raw * 100));
    const label = score >= 60 ? 'Strong fit' : score >= 35 ? 'Moderate fit' : 'Low fit';
    const color = score >= 60 ? '#1D9E75' : score >= 35 ? '#D97706' : '#78716C';
    return {market, score, label, color, n: profile.n, statePct: profile.pct};
  });
  return {scores, statesUsed, totalDaysWithLocation};
}

// Real operators per market, Competitor-only (Board/tourism-board sources
// have no sales channel to promote an itinerary through).
function buildOperatorsByMarket(){
  const allTours = window.MARKET_DATA || [];
  const byMarket = {};
  CA_MARKETS.forEach(market=>{
    const names = new Set();
    allTours.forEach(t=>{
      if (t.market===market && t.source_type==='Competitor') names.add(t.source);
    });
    byMarket[market] = [...names].sort();
  });
  return byMarket;
}

function caScoreQuartileLabel(pct){
  // pct is a 0..1 share of that market's tours touching the state.
  if (pct >= 0.5) return {label:'High', color:'#1D9E75'};
  if (pct >= 0.2) return {label:'Medium', color:'#D97706'};
  if (pct > 0) return {label:'Low', color:'#78716C'};
  return {label:'None', color:'#cbc9c6'};
}

// Coverage-table label — distinct thresholds from caScoreQuartileLabel, used only
// by the "Current market coverage" facts table (Historical fit's replacement).
function caCoverageLabel(pct){
  // pct is a 0..1 share of that market's tours touching the state.
  if (pct <= 0) return {label:'None', color:'#a8a29e'};
  if (pct <= 0.05) return {label:'Rare', color:'#a8a29e'};
  if (pct <= 0.20) return {label:'Some', color:'#D97706'};
  return {label:'Common', color:'#1D9E75'};
}

// Market summary for the AI prediction request: total tours, state visit
// counts, and avg tour duration per market — all derived from window.MARKET_DATA.
function buildAIMarketSummary(){
  const allTours = window.MARKET_DATA || [];
  const summary = {};
  CA_MARKETS.forEach(market=>{
    const tours = allTours.filter(t=>t.market===market);
    const stateVisits = {};
    let daySum = 0, dayCount = 0;
    tours.forEach(t=>{
      const states = new Set(t.states && t.states.length ? t.states : (t.state ? [t.state] : []));
      states.forEach(s=>{ stateVisits[s] = (stateVisits[s]||0) + 1; });
      if (t.total_days){ daySum += t.total_days; dayCount++; }
    });
    summary[market] = {
      totalTours: tours.length,
      stateVisits,
      avgDays: dayCount ? Math.round((daySum/dayCount)*10)/10 : 0,
    };
  });
  return summary;
}

// Board (tourism board) promotion data for the AI prediction request: per state,
// how many board tours visit it and the 5 most-promoted products in those tours —
// used to flag first-mover opportunities where boards push hard but competitors don't sell yet.
function buildBoardDataSummary(){
  const allTours = window.MARKET_DATA || [];
  const boardTours = allTours.filter(t=>t.source_type==='Board');
  const byState = {};
  boardTours.forEach(t=>{
    const states = new Set(t.states && t.states.length ? t.states : (t.state ? [t.state] : []));
    states.forEach(s=>{
      if (!byState[s]) byState[s] = {tours: 0, productCount: new Map()};
      byState[s].tours += 1;
      (t.products||[]).forEach(p=>{
        byState[s].productCount.set(p, (byState[s].productCount.get(p)||0)+1);
      });
    });
  });
  const summary = {};
  Object.entries(byState).forEach(([state, info])=>{
    const topProducts = [...info.productCount.entries()]
      .sort((a,b)=>b[1]-a[1])
      .slice(0,5)
      .map(([p])=>p);
    summary[state] = {boardTours: info.tours, topProducts};
  });
  return summary;
}

// Product name -> {state -> tour count} across all of window.MARKET_DATA, built once
// per call. Used to infer which state a product most likely belongs to, for itineraries
// that span multiple Australian states (the Builder session itself is single-state,
// but a PM can still add products the catalog associates with a different state).
function buildProductStateCounts(){
  const allTours = window.MARKET_DATA || [];
  const counts = {};
  allTours.forEach(t=>{
    const states = t.states && t.states.length ? t.states : (t.state ? [t.state] : []);
    (t.products||[]).forEach(p=>{
      if (!counts[p]) counts[p] = {};
      states.forEach(s=>{ counts[p][s] = (counts[p][s]||0) + 1; });
    });
  });
  return counts;
}

// Resolve a single product's most likely state: most common state across
// window.MARKET_DATA tours containing it; ties and unknown products fall back
// to the Builder's current stateKey.
function resolveProductState(product, productStateCounts, fallbackState){
  const counts = productStateCounts[product];
  if (!counts) return {state: fallbackState, fellBack: true};
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) return {state: fallbackState, fellBack: true};
  const topCount = entries[0][1];
  const tied = entries.filter(([,c])=>c===topCount);
  if (tied.length > 1){
    const tieMatch = tied.find(([s])=>s===fallbackState);
    return {state: tieMatch ? tieMatch[0] : tied[0][0], fellBack: !tieMatch};
  }
  return {state: entries[0][0], fellBack: false};
}

// Groups the itinerary's days/products into per-state regions for the AI prediction
// request. Single-state itineraries still return a one-item regions array (Step 2).
// Logs the resolved payload (and which products fell back to stateKey) for QA.
function buildRegionsFromItinerary(days, stateKey){
  const productStateCounts = buildProductStateCounts();
  const fallbacks = [];

  const dayRegions = (days||[]).map(d=>{
    const products = d.products || [];
    if (!products.length && !((d.location||'').trim())) return null;
    const stateVotes = {};
    products.forEach(p=>{
      const {state, fellBack} = resolveProductState(p, productStateCounts, stateKey);
      stateVotes[state] = (stateVotes[state]||0) + 1;
      if (fellBack) fallbacks.push(p);
    });
    const dayState = Object.keys(stateVotes).length
      ? Object.entries(stateVotes).sort((a,b)=>b[1]-a[1])[0][0]
      : stateKey;
    return {state: dayState, products};
  }).filter(Boolean);

  const byState = {};
  dayRegions.forEach(({state, products})=>{
    if (!byState[state]) byState[state] = {days: 0, products: []};
    byState[state].days += 1;
    products.forEach(p=>{ if (!byState[state].products.includes(p)) byState[state].products.push(p); });
  });

  const regions = Object.entries(byState).map(([state, info])=>({
    state, days: info.days, products: info.products,
  }));
  const total_days = regions.reduce((sum,r)=>sum+r.days, 0);

  console.log('[AI prediction] regions payload:', {regions, total_days});
  if (fallbacks.length){
    console.log('[AI prediction] products with unknown state, fell back to', stateKey + ':', [...new Set(fallbacks)]);
  }

  return {regions, total_days};
}

const AI_PREDICTION_STORAGE_KEY = 'mi_ai_prediction';

// Sorted, comma-separated snapshot of every product currently in the itinerary —
// used to detect "has this itinerary changed enough to warrant re-analysis".
function productFingerprint(products){
  return [...(products||[])].sort().join(',');
}

// Count of products that differ between two fingerprints (added or removed),
// used for the "2 or more products changed" re-analysis threshold.
function fingerprintDiffCount(fpA, fpB){
  const a = new Set((fpA||'').split(',').filter(Boolean));
  const b = new Set((fpB||'').split(',').filter(Boolean));
  let diff = 0;
  a.forEach(x=>{ if(!b.has(x)) diff++; });
  b.forEach(x=>{ if(!a.has(x)) diff++; });
  return diff;
}

function ConsumerAnalysisView({days, stateKey}){
  const {scores, statesUsed, totalDaysWithLocation} = useMemo(()=>computeMarketFitScores(days, stateKey), [days, stateKey]);
  const operatorsByMarket = useMemo(()=>buildOperatorsByMarket(), []);

  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult]   = useState(null);   // {predictions, summary}
  const [aiError, setAiError]     = useState(false);
  const [aiErrorMsg, setAiErrorMsg] = useState('');   // specific red error text (timeout/abort), separate from the generic Ollama-down message
  const [aiProgress, setAiProgress] = useState(0);    // 0-100, fills over ~45s while waiting on the proxy/Ollama
  const aiProgressTimer = useRef(null);
  // Persists across clicks (not reset on re-render) so a second click can abort
  // whatever request the first click started, and the 60s watchdog can abort itself.
  const aiController = useRef(null);

  const [savedPrediction, setSavedPrediction] = useState(null); // {fingerprint, predictions, summary, timestamp}

  // Debug panel (Consumer Analysis AI prediction troubleshooting) — status text,
  // live elapsed-time counter, raw response body, and HTTP status code.
  const [debugVisible, setDebugVisible] = useState(true);
  const [debugStatus, setDebugStatus] = useState('Idle');
  const [debugElapsed, setDebugElapsed] = useState(0);
  const [debugRaw, setDebugRaw] = useState('');
  const [debugHttpStatus, setDebugHttpStatus] = useState(null);
  const debugTimer = useRef(null);

  // Load any saved prediction from localStorage once on mount — persists across
  // page refresh and tab switching without re-calling the API.
  useEffect(()=>{
    try{
      const raw = localStorage.getItem(AI_PREDICTION_STORAGE_KEY);
      if (raw) setSavedPrediction(JSON.parse(raw));
    } catch(e){}
  }, []);

  const hasEnoughData = totalDaysWithLocation > 0;
  const sortedScores = [...scores].sort((a,b)=>b.score-a.score);
  const promoteMarkets = sortedScores.filter(s=>s.score >= 35);

  const allProducts = (days||[]).flatMap(d=>d.products||[]);
  const daysWithLocation = (days||[]).filter(d=>(d.location&&d.location.trim())||(d.products&&d.products.length)).length;
  const currentFingerprint = productFingerprint(allProducts);

  // States detected across the itinerary's products, for the subtitle/warning —
  // same resolution logic as buildRegionsFromItinerary but without the console logging.
  const detectedStates = useMemo(()=>{
    const productStateCounts = buildProductStateCounts();
    const set = new Set();
    allProducts.forEach(p=>{ set.add(resolveProductState(p, productStateCounts, stateKey).state); });
    if (!set.size && stateKey) set.add(stateKey);
    return [...set];
  }, [currentFingerprint, stateKey]);
  const isMultiState = detectedStates.length > 1;

  const meetsMinimums = allProducts.length >= 3 && daysWithLocation >= 2;
  const changedSinceSaved = savedPrediction
    ? fingerprintDiffCount(currentFingerprint, savedPrediction.fingerprint) >= 2
    : true; // no saved prediction yet — nothing to compare against, so allow analysis
  const canAnalyse = meetsMinimums && changedSinceSaved;

  let analyseTooltip;
  if (!meetsMinimums) analyseTooltip = 'Add at least 3 products and 2 days to analyse';
  else if (!changedSinceSaved) analyseTooltip = savedPrediction ? 'No significant changes since last analysis' : undefined;
  if (meetsMinimums && !changedSinceSaved && savedPrediction){
    const diff = fingerprintDiffCount(currentFingerprint, savedPrediction.fingerprint);
    analyseTooltip = diff > 0 ? `Add ${2-diff} more product${2-diff===1?'':'s'} since last analysis to re-analyse` : 'No significant changes since last analysis';
  }

  const showChangedBanner = !!savedPrediction && fingerprintDiffCount(currentFingerprint, savedPrediction.fingerprint) >= 2;

  async function runAiPrediction(){
    // A previous request is still in flight — abort it before starting a fresh one,
    // so a second click can never pile up on top of a hung first click.
    if (aiController.current) aiController.current.abort();
    const controller = new AbortController();
    aiController.current = controller;

    setAiLoading(true); setAiError(false); setAiErrorMsg(''); setAiResult(null); setAiProgress(0);
    setDebugStatus('Sending request to proxy...'); setDebugElapsed(0); setDebugRaw(''); setDebugHttpStatus(null);
    const startedAt = Date.now();
    aiProgressTimer.current = setInterval(()=>{
      const pct = Math.min(99, Math.round(((Date.now()-startedAt)/45000)*100));
      setAiProgress(pct);
    }, 300);
    debugTimer.current = setInterval(()=>{
      setDebugElapsed(Math.floor((Date.now()-startedAt)/1000));
    }, 250);

    // 90s frontend watchdog — if the request hasn't resolved by then, abort it
    // so the button can never be stuck on "Analysing..." forever.
    const watchdog = setTimeout(()=>{ controller.abort(); }, 90000);

    try{
      const {regions, total_days} = buildRegionsFromItinerary(days, stateKey);
      const itinerary = {regions, total_days};
      const marketData = buildAIMarketSummary();
      const boardData = buildBoardDataSummary();
      setDebugStatus('Request sent — waiting for response...');
      const r = await fetch('api/predict', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({itinerary, marketData, boardData}),
        signal: controller.signal,
      });
      setDebugHttpStatus(r.status);
      setDebugStatus('Response received — parsing...');
      const rawText = await r.clone().text();
      setDebugRaw(rawText ? rawText : 'Empty response');
      const data = JSON.parse(rawText || '{}');
      if (data.error || !data.predictions){ setAiError(true); setDebugStatus('Error: ' + (data.error || 'no predictions returned')); }
      else {
        setAiResult(data);
        setDebugStatus('Done');
        const toSave = {
          fingerprint: currentFingerprint,
          products: allProducts,
          predictions: data.predictions,
          summary: data.summary || '',
          timestamp: new Date().toISOString(),
        };
        try{ localStorage.setItem(AI_PREDICTION_STORAGE_KEY, JSON.stringify(toSave)); } catch(e){}
        setSavedPrediction(toSave);
      }
    } catch(e){
      setDebugRaw(e.message || String(e));
      if (e.name === 'AbortError'){ setAiErrorMsg('Analysis timed out — please try again.'); setDebugStatus('Error: request timed out / aborted'); }
      else { setAiError(true); setDebugStatus('Error: ' + (e.message || String(e))); }
    }
    clearTimeout(watchdog);
    if (aiController.current === controller) aiController.current = null;
    clearInterval(aiProgressTimer.current);
    clearInterval(debugTimer.current);
    setDebugElapsed(Math.floor((Date.now()-startedAt)/1000));
    setAiProgress(100);
    setAiLoading(false);
  }

  function clearSavedPrediction(){
    try{ localStorage.removeItem(AI_PREDICTION_STORAGE_KEY); } catch(e){}
    setSavedPrediction(null);
    setAiResult(null);
    setAiError(false);
    setAiErrorMsg('');
  }

  // What to actually render: a fresh result from this session takes priority,
  // otherwise fall back to whatever was persisted in localStorage.
  const displayResult = aiResult || (savedPrediction ? {predictions: savedPrediction.predictions, summary: savedPrediction.summary} : null);

  // Day counts per state, for the coverage-summary table — the Builder
  // session is single-state, so every day-with-content counts against stateKey.
  const dayCountByState = {};
  if (stateKey) dayCountByState[stateKey] = totalDaysWithLocation;

  const cardHd = {fontSize:'12px',fontWeight:700,color:'#1c1917',marginBottom:'8px'};

  if (!hasEnoughData){
    return (
      <div style={{padding:'40px 20px',textAlign:'center',color:'#a8a29e',fontSize:'13px'}}>
        Add locations to your itinerary to see consumer analysis
      </div>
    );
  }

  return (

        <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'8px',overflow:'hidden'}}>

      {/* ── Section B: Promote through ── */}
      <div>
        <div style={cardHd}>Promote through</div>
        {promoteMarkets.length===0 ? (
          <div style={{fontSize:'12px',color:'#a8a29e'}}>Build more of your itinerary to see operator recommendations</div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
            {promoteMarkets.map(s=>{
              const ops = operatorsByMarket[s.market] || [];

      {/* ── Section C: State coverage summary ── */}
      <div>
        <div style={cardHd}>State coverage summary</div>
        <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'8px',overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'0.7fr 0.9fr repeat(5,1fr)',gap:'8px',padding:'8px 14px',background:'#f5f5f4',fontSize:'10px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em'}}>
            <div>State</div><div>Days planned</div>
            {sortedScores.map(sc=><div key={sc.market}>{CA_FLAGS[sc.market]} {sc.market}</div>)}
          </div>
          {statesUsed.map(s=>(
            <div key={s} style={{display:'grid',gridTemplateColumns:'0.7fr 0.9fr repeat(5,1fr)',gap:'8px',padding:'8px 14px',fontSize:'11px',borderTop:'0.5px solid #f0efed',alignItems:'center'}}>
              <div><span style={stateChipStyle(s,true)}>{s}</span></div>
              <div style={{color:'#57534e'}}>{dayCountByState[s]||0}</div>

                const pct = sc.statePct[s] || 0;
                const tourCount = Math.round(pct * sc.n);
                const q = caScoreQuartileLabel(pct);
                return <div key={sc.market} style={{color:q.color,fontWeight:600}}>{tourCount} · {q.label}</div>;

  );
}

// ════════════════════════════════════════════════════════════════════════
// Quotes Dashboard module — merged in from the standalone quotes_dashboard.html
// app, namespace-isolated inside this IIFE so its internal helpers/components
// never collide with builder.html's own top-level names. Only
// QuotesDashboardModule.QuotesDashboardApp is exposed outside this IIFE (used
// by the Quotes tab in viewBody below); everything else stays private to
// this module's closure, matching how quotes_dashboard.html's own App() used
// these same components internally.
//
// Collisions with builder.html's own top-level declarations, and how each was
// resolved:
//   STATE_COL, stateChipStyle, Bar, QA_HEAT_RAMP, qaHeatColor
//     -> referenced-shared: NOT redeclared in this module at all. This module
//        uses builder.html's own top-level copies directly (STATE_COL was
//        extended with an NZ entry for this merge -- see top of file).
//   HBar, DonutChart, QaHeatmap, QaPieChart, QaRangeBar
//     -> renamed with a QD_ prefix (QD_HBar, QD_DonutChart, QD_QaHeatmap,
//        QD_QaPieChart, QD_QaRangeBar) because builder.html already has its
//        own top-level component with the same name but a different
//        signature/prop shape -- sharing would have been incorrect.
//   App() (quotes_dashboard.html's own root component)
//     -> renamed to QuotesDashboardApp (see bottom of this IIFE), since
//        builder.html has its own top-level App().
// Everything else below (CAT_COL, catChipStyle, ANALYTICS_COL, PANEL_COL,
// BAND_COL, STATE_OF_CITY, stateOfCity, PatternsTab, QuoteBrowserTab,
// QuotesTab, AnalyticsTab, etc.) is unique to this module and safe to keep
// under its original name, scoped inside this IIFE.
// ════════════════════════════════════════════════════════════════════════
const QuotesDashboardModule = (function(){
// STATE_COL and stateChipStyle are intentionally NOT redeclared here -- this
// module shares builder.html's own top-level STATE_COL/stateChipStyle (which
// already includes the NZ pseudo-bucket entry added for this merge) as the
// single source of truth. Same reasoning applies to Bar and QA_HEAT_RAMP/
// qaHeatColor further below in this module -- all three are shared, not redeclared.
// Category color palette — same 8-hue categorical set used elsewhere in the
// Quotes dashboard (QA_CAT), reused here so category chips are visually
// consistent with the rest of the app rather than inventing new colors.
const CAT_COL = {
  Transfers:{bg:'#E9F1FB',tx:'#184F95'}, Attraction:{bg:'#FCE9E1',tx:'#B84A1E'},
  Tour:{bg:'#E1F5EC',tx:'#0F7A4E'}, SIC:{bg:'#FDF3DC',tx:'#8A6200'},
  Restaurant:{bg:'#FBE5EE',tx:'#A3306B'}, Guide:{bg:'#E3F8E3',tx:'#1F6B1F'},
  Uncategorised:{bg:'#f5f5f4',tx:'#57534e'},
};
function catChipStyle(c){
  const s = CAT_COL[c] || CAT_COL.Uncategorised;
  return {display:'inline-flex',padding:'2px 8px',borderRadius:'99px',fontSize:'11px',fontWeight:600,background:s.bg,color:s.tx,whiteSpace:'nowrap'};
}
// Bar is shared from builder.html's own top-level Bar component (identical impl) -- not redeclared here.

// One deliberate, consistent color per Analytics SCREEN — kept as the
// screen's "home" color (used for the screen's tab highlight and its main/
// first chart), but no longer forced onto every single panel on that
// screen. When every panel on a screen used this one color, a screen with
// 4-5 panels read as visually flat/monochrome despite having several
// distinct charts. These don't encode any data meaning (unlike STATE_COL/
// CAT_COL above, which map a specific state/category to a specific color) —
// they're just an identity color, the same way a single-series chart is
// normally one color throughout.
const ANALYTICS_COL = {
  length: '#378ADD',   // Trip length screen home color (histogram)
  geo: '#0F766E',      // Cities & states screen home color (city breadth)
  products: '#B45309', // Categories & products screen home color (category mix)
  routes: '#166534',   // Route uniqueness screen home color (top routes)
};

// One color per PANEL ROLE (not per screen) — a small fixed set, cycled
// across the panels within a screen, so a screen with several charts shows
// several colors instead of one flat hex repeated everywhere. The same
// role keeps the same color across every screen it appears on (e.g. every
// "secondary breakdown" panel is always purple), so a panel type stays
// recognizable — this is a visual-variety fix, not a data-encoding one, so
// no legend is needed here either.
const PANEL_COL = {
  primary: '#378ADD',    // the screen's headline chart — same as ANALYTICS_COL for that screen
  secondary: '#7C3AED',  // purple — the screen's second chart
  tertiary: '#D97706',   // amber — third chart
  quaternary: '#0D9488', // teal — fourth chart
  quinary: '#4D7C0F',    // olive/green — fifth chart, if a screen has one (was a hot pink/rose that read badly on screen)
};

// One color per trip-length band — meaningful (short trips are always the
// same color, long trips always another), used as a left-border accent +
// chip on every quote card so a dense grid of "matching quotes" reads as a
// colorful mosaic at a glance instead of a wall of identical gray cards.
const BAND_COL = {
  '1-4d': '#2563EB', '5-7d': '#0D9488', '8-10d': '#16A34A',
  '11-13d': '#CA8A04', '14-16d': '#EA580C', '17d+': '#DC2626',
};

// City -> AU state, ported verbatim from api.php's quotes_state_of_city()
// — the /quotes/templates endpoint's product entries only carry 'city',
// not a precomputed 'state', so this mock page derives it client-side the
// same way the backend does. NZ cities and anything unmapped return null,
// same transparency rule used throughout the app (never guessed at).
const STATE_OF_CITY = {
  sydney:'NSW', canberra:'ACT', melbourne:'VIC',
  'gold coast':'QLD', cairns:'QLD', brisbane:'QLD',
  whitsunday:'QLD', 'hamilton island':'QLD', 'port douglas':'QLD',
  noosa:'QLD', 'airlie beach':'QLD',
  perth:'WA', adelaide:'SA',
  hobart:'TAS', launceston:'TAS',
  darwin:'NT', uluru:'NT',
  'tangalooma island':'QLD',
};
function stateOfCity(city){
  if(!city) return null;
  return STATE_OF_CITY[city.trim().toLowerCase()] || null;
}

// Route legs -> which AU states this template touches, derived from each
// product's own city.
function statesOfTemplate(t){
  const s = new Set();
  (t.coreProducts||[]).concat(t.optionalAddons||[]).forEach(p=>{ const st=stateOfCity(p.city); if(st) s.add(st); });
  return [...s];
}

// buildTplCard — mirrors builder.html's buildTplCard() for the ORIGINAL
// (colleague's, board/competitor-scrape-sourced) Templates tab, but every
// field is mapped to what QUOTES data actually has:
//   t.name / t.type / t.source / t.url / t.pop / boardPct  --> DON'T EXIST
//     for quotes (no tour name, no board/competitor source, no board-
//     promotion signal) — replaced below with quote-specific equivalents.
//   t.states                                              --> statesOfTemplate(t), derived from product city->state
//   t.days[].themes                                       --> NO theme tagging in quotes data; category (Transfers/
//     Tour/Attraction/SIC/Restaurant/Guide) is the closest real equivalent,
//     substituted in the same visual slot per the product owner's decision.
//   "Board alignment %"                                    --> DROPPED entirely, per the product owner's decision
//     (acceptance/rejection rate is a different question and isn't forced
//     into that slot) — shown instead as its own explicit "Reject rate" stat.
function buildCard(t, maxPop, totalQuotes){
  const states = statesOfTemplate(t);
  const allProds = (t.coreProducts||[]).concat(t.optionalAddons||[]);
  const categoryDays = {}; // category -> Set of typicalDay values covering it
  allProds.forEach(p=>{
    const cat = p.category || 'Uncategorised';
    if(!categoryDays[cat]) categoryDays[cat] = new Set();
    if(p.typicalDay) categoryDays[cat].add(p.typicalDay);
  });
  const pop = t.nQuotes || 0;
  return {
    t, dur: t.medianDays, prodCount: allProds.length, allProds, states,
    isMultiState: states.length > 1,
    isTop: pop >= maxPop * 0.6,
    // popPct is this pattern's share of the ENTIRE cleaned dataset (pop /
    // totalQuotes), NOT relative to the single most popular pattern — a
    // full bar would mean literally every quote follows this one pattern.
    // (Previously divided by maxPop instead, which made the bar's meaning
    // impossible to sanity-check since the denominator was never shown.)
    popPct: totalQuotes? Math.round(pop / totalQuotes * 100) : 0,
    pop,
    totalQuotes,
    rejectRate: t.rejectRate,
    categoryDays,
  };
}

function TemplateCard({c, onPreview}){
  const t = c.t;
  const bandColor = BAND_COL[t.tripBand] || '#27500A';
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderTop:'3px solid '+bandColor,borderRadius:'10px',overflow:'hidden'}}>
      <div style={{padding:'11px 13px',borderBottom:'0.5px solid #f5f5f4'}}>
        <div style={{fontSize:'13px',fontWeight:700,lineHeight:1.3,marginBottom:'3px'}}>{t.route}</div>
        <div style={{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}}>
          <span style={{display:'inline-flex',padding:'2px 8px',borderRadius:'99px',fontSize:'11px',fontWeight:600,color:bandColor,background:bandColor+'1a'}}>{t.tripBand}</span>
          <span style={{fontSize:'11px',color:'#a8a29e'}}>from {t.nQuotes.toLocaleString()} real quotes</span>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'3px',marginTop:'5px'}}>
          {c.states.map(s=><span key={s} style={stateChipStyle(s,true)}>{s}</span>)}
          {c.isMultiState? <span style={{display:'inline-flex',alignItems:'center',fontSize:'10px',fontWeight:600,color:'#5B21B6',background:'#EDE9FE',border:'0.5px solid #DDD6FE',borderRadius:'3px',padding:'1px 6px'}}>Multi-state</span>:null}
          {c.isTop? <span style={{display:'inline-flex',alignItems:'center',gap:'2px',fontSize:'10px',fontWeight:600,color:'#27500A',background:'#EAF3DE',border:'0.5px solid #C0DD97',borderRadius:'3px',padding:'1px 6px'}}>★ Most common</span>:null}
        </div>
      </div>

      <div style={{display:'flex',alignItems:'stretch',borderBottom:'0.5px solid #f5f5f4',background:'#fafaf9'}}>
        {[['Median days',c.dur],['Products',c.prodCount],['Quotes on this exact pattern',c.pop.toLocaleString()]].map(([label,val])=>(
          <React.Fragment key={label}>
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',padding:'8px 4px',gap:'1px'}}>
              <div style={{fontSize:'17px',fontWeight:700}}>{val}</div>
              <div style={{fontSize:'9px',color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.05em'}}>{label}</div>
            </div>
            <div style={{width:'0.5px',background:'#e7e5e4'}}/>
          </React.Fragment>
        ))}
        <div style={{flex:2,padding:'8px 10px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'1px'}}>
          {/* No bar here deliberately — every pattern is only a few percent
              of the whole dataset, so a 0-100% bar would always look nearly
              empty and couldn't visually distinguish a common pattern from
              a rare one. The plain fraction says the same thing without
              promising a visual comparison it can't deliver. */}
          <div style={{fontSize:'15px',fontWeight:700}}>{c.pop.toLocaleString()} <span style={{fontSize:'11px',fontWeight:400,color:'#a8a29e'}}>of {(c.totalQuotes||0).toLocaleString()}</span></div>
          <div style={{fontSize:'9px',color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.05em'}}>Quotes for this pattern</div>
        </div>
      </div>

      {c.allProds.length? (
        <div style={{padding:'9px 13px',borderBottom:'0.5px solid #f5f5f4'}}>
          <div style={{fontSize:'9px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'5px'}}>Top products</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'3px'}}>
            {c.allProds.slice(0,5).map((p,i)=><span key={i} style={{...catChipStyle(p.category),borderRadius:'6px',whiteSpace:'normal',lineHeight:1.3}}>{p.productname}</span>)}
            {c.allProds.length>5? <span style={{fontSize:'10px',color:'#a8a29e',padding:'2px 4px'}}>+{c.allProds.length-5} more</span>:null}
          </div>
        </div>
      ):null}

      {Object.keys(c.categoryDays).length? (
        <div style={{padding:'9px 13px',borderBottom:'0.5px solid #f5f5f4'}}>
          <div style={{fontSize:'9px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'5px'}}>Categories covered</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'3px'}}>
            {Object.keys(c.categoryDays).slice(0,4).map(cat=><span key={cat} style={catChipStyle(cat)}>{cat}</span>)}
            {Object.keys(c.categoryDays).length>4? <span style={{fontSize:'10px',color:'#a8a29e',padding:'2px 4px'}}>+{Object.keys(c.categoryDays).length-4} more</span>:null}
          </div>
        </div>
      ):null}

      <div style={{padding:'10px 13px',display:'flex',alignItems:'center',gap:'8px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'5px',padding:'7px 10px',borderRadius:'6px',fontSize:'12px',border:'0.5px solid #d6d3d1',color:'#57534e',cursor:'pointer',whiteSpace:'nowrap',flex:1,justifyContent:'center'}} onClick={()=>onPreview(t)}>Preview</div>
        {c.rejectRate!=null? <div style={{fontSize:'9px',color:'#d4d4d4',flexShrink:0}} title="Reject rate — not a meaningful signal for this dataset (quotes were built manually via questionnaires, not real customer decisions)">{c.rejectRate}%</div>:null}
      </div>
    </div>
  );
}

    if(p.typicalDay) categoryDays[cat].add(p.typicalDay);

  const totalDaysSet = new Set();

function PatternsTab(){
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [sortBy, setSortBy] = useState('pop');
  const [stateFilter, setStateFilter] = useState([]);
  const [categoryFilter, setCategoryFilter] = useState([]);
  const [preview, setPreview] = useState(null);

  useEffect(()=>{
    // minQuotes=1: show EVERY route+trip-band pattern, not just the ones
    // with >=12 matching quotes the live dashboard's own Templates tab
    // requires for reliability — this mock intentionally trades some
    // noise (rare, thin patterns) for full coverage of what exists.
    // source=clean: use the day-numbering/route-cleaned 3,847-quote set
    // (quotes_clean/), same dataset every other tab in this mock uses —
    // NOT the live uncleaned table the shipped dashboard's Templates tab
    // still reads (that one is deliberately left untouched).
    fetch('quotes/templates?minQuotes=1&source=clean')
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setData)
      .catch(()=>setError('Could not load templates — is the itinerary_builder server running?'));
  }, []);

  const allCards = useMemo(()=>{
    if(!data) return [];
    const maxPop = Math.max(1, ...data.templates.map(t=>t.nQuotes||0));
    return data.templates.map(t=>buildCard(t, maxPop, data.totalQuotes));
  }, [data]);

  const cards = useMemo(()=>{
    let list = allCards;
    if(stateFilter.length){
      list = list.filter(c=>stateFilter.every(s=>c.states.includes(s)));
    }
    if(categoryFilter.length){
      list = list.filter(c=>categoryFilter.every(cat=>Object.keys(c.categoryDays).includes(cat)));
    }
    const sorters = {
      pop: (a,b)=>b.pop-a.pop,
      'dur-d': (a,b)=>b.dur-a.dur,
      'dur-a': (a,b)=>a.dur-b.dur,
      reject: (a,b)=>(b.rejectRate||0)-(a.rejectRate||0),
    };
    return list.slice().sort(sorters[sortBy]||sorters.pop);
  }, [allCards, sortBy, stateFilter, categoryFilter]);

  // Count badges (per state / per category) — same idea as the colleague's
  // Templates tab, which shows "how many results this option would match"
  // right in the filter chip, not just its label. Counted against allCards
  // (unfiltered by state/category, though sort still applies conceptually)
  // so a chip's own count doesn't shrink to 0 the moment you select it.
  const allStates = useMemo(()=>{
    if(!data) return [];
    const s = new Set();
    allCards.forEach(c=>c.states.forEach(x=>s.add(x)));
    return [...s].sort();
  }, [data, allCards]);
  const stateCounts = useMemo(()=>{
    const counts = {};
    allStates.forEach(s=>{ counts[s] = allCards.filter(c=>c.states.includes(s)).length; });
    return counts;
  }, [allCards, allStates]);

  const allCategories = useMemo(()=>{
    if(!data) return [];
    const s = new Set();
    allCards.forEach(c=>Object.keys(c.categoryDays).forEach(x=>s.add(x)));
    return [...s].sort();
  }, [data, allCards]);
  const categoryCounts = useMemo(()=>{
    const counts = {};
    allCategories.forEach(cat=>{ counts[cat] = allCards.filter(c=>Object.keys(c.categoryDays).includes(cat)).length; });
    return counts;
  }, [allCards, allCategories]);

  const hasActiveFilters = stateFilter.length>0 || categoryFilter.length>0;
  function clearAllFilters(){ setStateFilter([]); setCategoryFilter([]); }

  if(error) return <div style={{padding:'40px',textAlign:'center',color:'#991B1B'}}>{error}</div>;
  if(!data) return <div style={{padding:'40px',textAlign:'center',color:'#a8a29e'}}>Loading…</div>;

  return (
    <div style={{display:'flex',height:'100vh'}}>
      <div style={{width:'220px',minWidth:'220px',background:'#fff',borderRight:'0.5px solid #e7e5e4',overflowY:'auto',padding:'12px 10px',display:'flex',flexDirection:'column',gap:'12px'}}>
        <div>
          <div style={{fontSize:'10px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>Sort by</div>
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{width:'100%',border:'0.5px solid #d6d3d1',borderRadius:'6px',padding:'6px 8px',fontSize:'12px',background:'#fff',cursor:'pointer'}}>
            <option value="pop">Most common (by quote count)</option>
            <option value="dur-d">Longest first</option>
            <option value="dur-a">Shortest first</option>
            <option value="reject">Highest reject rate</option>
          </select>
        </div>
        <div>
          <div style={{fontSize:'10px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>States</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
            {allStates.map(s=>{
              const active = stateFilter.includes(s);
              return (
                <div key={s} onClick={()=>setStateFilter(prev=>prev.includes(s)?prev.filter(x=>x!==s):[...prev,s])}
                  style={active?{...stateChipStyle(s),cursor:'pointer',gap:'4px'}:{cursor:'pointer',display:'inline-flex',alignItems:'center',gap:'4px',padding:'3px 8px',borderRadius:'5px',fontSize:'11px',background:'#f5f5f4',color:'#57534e',border:'0.5px solid #e7e5e4'}}>
                  {s}<span style={{fontSize:'10px',opacity:.7}}>{stateCounts[s]}</span>
                </div>
              );
            })}
          </div>
        </div>
        <div>
          <div style={{fontSize:'10px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>Categories</div>
          <div style={{display:'flex',flexDirection:'column',gap:'3px'}}>
            {allCategories.map(cat=>{
              const active = categoryFilter.includes(cat);
              return (
                <div key={cat} onClick={()=>setCategoryFilter(prev=>prev.includes(cat)?prev.filter(x=>x!==cat):[...prev,cat])}
                  style={{cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 9px',borderRadius:'6px',fontSize:'11px',fontWeight:active?600:400,background:active?'#EAF3DE':'#fafaf9',color:active?'#27500A':'#57534e',border:'0.5px solid '+(active?'#C0DD97':'#e7e5e4')}}>
                  {cat}<span style={{fontSize:'10px',color:active?'#27500A':'#a8a29e',opacity:active?.65:1}}>{categoryCounts[cat]}</span>
                </div>
              );
            })}
          </div>
        </div>
        <div style={{fontSize:'11px',color:'#a8a29e',lineHeight:1.5,borderTop:'0.5px solid #f5f5f4',paddingTop:'12px'}}>
          Built from {data.totalQuotes.toLocaleString()} real quotes,{' '}
          {data.coveragePct}% coverage ({data.coveredQuotes.toLocaleString()} quotes grouped into a pattern).
          <div style={{marginTop:'6px',color:'#92400E'}}>No minimum-quotes floor — includes patterns built from as few as 1 real quote.</div>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
        <div style={{marginBottom:'10px'}}>
          <div style={{fontSize:'16px',fontWeight:700}}>Itinerary Patterns</div>
          <div style={{fontSize:'11px',color:'#a8a29e',marginTop:'2px'}}>
            Same card layout as the existing Itinerary Templates section, adapted to what the Quotes dataset actually
            contains — no theme tags or board-alignment score exist for quotes, so those are replaced with category
            coverage and reject rate respectively. Everything else (route, states, day-by-day, core products, typical
            hotels) is real data from past quotes.
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px',marginTop:'10px'}}>
            <span style={{fontSize:'12px',color:'#57534e'}}>{cards.length} of {allCards.length} itinerary patterns shown</span>
            {hasActiveFilters? <button onClick={clearAllFilters} style={{padding:'4px 10px',borderRadius:'6px',fontSize:'11px',border:'0.5px solid #d6d3d1',background:'#fff',color:'#57534e',cursor:'pointer'}}>✕ Clear filters</button>:null}
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:'8px'}}>
          {cards.map((c,i)=><TemplateCard key={i} c={c} onPreview={setPreview}/>)}
        </div>
      </div>

      <PreviewModal t={preview} onClose={()=>setPreview(null)}/>
    </div>
  );
}

// Renders one quote's metadata (quotes_metadata/{quote_no}.json — route,
// trip_band, category_mix, days per city/state, product/hotel variety) —
// fetched on demand only when the "Add analytics" button is clicked, not
// automatically for every quote opened, since most quote-detail views are
// just someone skimming the raw itinerary, not asking for the breakdown.
// Compact category/city breakdown, shared by the itinerary card (compact
// view) and QuoteDetailModal (expanded view) — same data, same dense inline-
// chip layout in both places, so the two never drift apart or duplicate a
// separate "Show analytics" panel.
function QuoteCategoryCityStrip({quoteNo}){
  const [meta, setMeta] = useState(null);
  const [error, setError] = useState(null);

  useEffect(()=>{
    setMeta(null);
    fetch('quotes/metadata/'+encodeURIComponent(quoteNo))
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setMeta)
      .catch(()=>setError('Could not load category/city breakdown for this quote.'));
  }, [quoteNo]);

  if(error) return <div style={{fontSize:'11px',color:'#991B1B'}}>{error}</div>;
  if(!meta) return <div style={{fontSize:'11px',color:'#a8a29e'}}>Loading…</div>;

  const catMix = Object.entries(meta.category_mix||{});
  const cityDays = Object.entries(meta.days_per_city||{});
  const stateDays = Object.entries(meta.days_per_state||{});
  if(!catMix.length && !cityDays.length) return null;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
      {catMix.length? (
        <div style={{display:'flex',alignItems:'baseline',gap:'6px',flexWrap:'wrap'}}>
          <span style={{fontSize:'9px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',flexShrink:0}}>By category</span>
          {catMix.map(([cat,n])=><span key={cat} style={catChipStyle(cat)}>{cat} {n}</span>)}
        </div>
      ):null}
      {cityDays.length? (
        <div style={{display:'flex',alignItems:'baseline',gap:'6px',flexWrap:'wrap'}}>
          <span style={{fontSize:'9px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',flexShrink:0}}>Days/city</span>
          {cityDays.map(([city,n])=><span key={city} style={{fontSize:'11px',color:'#57534e',background:'#f5f5f4',borderRadius:'6px',padding:'2px 7px'}}>{city} {n}d</span>)}
          {stateDays.map(([state,n])=><span key={state} style={stateChipStyle(state,true)}>{state} {n}d</span>)}
        </div>
      ):null}
    </div>
  );
}

function QuoteDetailModal({q, onClose}){
  const [full, setFull] = useState(null);
  const [loadingFull, setLoadingFull] = useState(false);
  // Reset the lazily-fetched full quote whenever a DIFFERENT quote is
  // opened, so re-opening the modal for a new quote doesn't show stale data.
  useEffect(()=>{ setFull(null); }, [q && q.quote_no]);

  // Callers like InlineQuoteList pass a "light" quote object (export-
  // clean?light=1 — quote_no/route/total_days/etc only, no products/hotels
  // arrays at all, by design, to keep list fetches fast). Detect that here
  // by the arrays being entirely absent (a real full quote always has both,
  // even if empty) and lazily fetch the full quote so products/hotels never
  // silently show as "0" just because the caller used the light endpoint.
  const isLight = q && !('products' in q) && !('hotels' in q);
  useEffect(()=>{
    if(!isLight){ return; }
    setLoadingFull(true);
    // quotes/clean/{quote_no}: reads quotes_clean/ (city casing already
    // normalized by clean_quotes.php), NOT the live table — keeps this
    // modal consistent with every other tab in the mock, which reads the
    // cleaned dataset exclusively.
    fetch('quotes/clean/'+encodeURIComponent(q.quote_no))
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(data=>setFull({...q, ...data}))
      .catch(()=>setFull({...q, products:[], hotels:[]}))
      .finally(()=>setLoadingFull(false));
  }, [q && q.quote_no, isLight]);

  if(!q) return null;
  const effective = isLight? (full||q) : q;
  const products = effective.products||[];
  const hotels = effective.hotels||[];

  // Analytics renders as its OWN modal-styled panel to the right of the
  // main quote panel (same card look: white background, rounded corners,
  // shadow, its own header+close) rather than being stuffed inside the same
  // box — the two are visually distinct "boxes" side by side, not one long
  // scrolling column.
  const QuoteDetailsBox = (
    <div style={{background:'#fff',borderRadius:'12px',width:'100%',maxWidth:'860px',maxHeight:'calc(100vh - 24px)',display:'flex',flexDirection:'column',overflow:'hidden',boxShadow:'0 20px 60px rgba(0,0,0,.2)'}} onClick={e=>e.stopPropagation()}>
      <div style={{padding:'16px 20px',borderBottom:'0.5px solid #e7e5e4',display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:'8px',flexShrink:0}}>
        <div>
          <div style={{fontSize:'16px',fontWeight:700}}>{(q.route||'Unrouted') + ' (#' + (q.quote_no||'').replace(/^TDU/i,'') + ')'}</div>
          <div style={{display:'flex',alignItems:'center',gap:'8px',marginTop:'4px',flexWrap:'wrap'}}>
            <span style={{fontSize:'12px',color:'#a8a29e'}}>{q.quotestage}</span>

        </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px 20px',display:'flex',flexDirection:'column',gap:'16px'}}>

            {(()=>{

                if(!byDay[d]) byDay[d] = [];

              });
              const dayKeys = Object.keys(byDay).map(Number).sort((a,b)=>a-b);

                      {state? <span style={stateChipStyle(state,true)}>{state}</span>:null}
                    </div>
                    <div style={{fontSize:'12px',fontWeight:700}}>{city||'—'}</div>
                    <div style={{display:'flex',flexDirection:'column',gap:'3px',marginTop:'1px'}}>
                      {items.map((p,i)=><span key={i} style={{...catChipStyle(p.category),borderRadius:'6px',whiteSpace:'normal',lineHeight:1.3}}>{p.productname}</span>)}
                    </div>
                  </div>
                );
              });
            })()}
          </div>
        </div>
        {hotels.length? (
          <div>
            <div style={{fontSize:'10px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'8px'}}>Hotels ({hotels.length})</div>
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {hotels.map((h,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'12px',border:'0.5px solid #f1f0ef',borderRadius:'6px',padding:'6px 10px'}}>
                  <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{h.productname}</span>
                  <span style={{color:'#a8a29e',whiteSpace:'nowrap'}}>{h.city}</span>
                </div>
              ))}
            </div>
          </div>
        ):null}
      </div>
    </div>
  );

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px'}} onClick={onClose}>
      <div style={{display:'flex',gap:'8px',maxWidth:'1300px',width:'100%',justifyContent:'center'}}>
        {QuoteDetailsBox}
      </div>
    </div>
  );
}

// Page navigator: numbered blocks of 10 (1-10, then 11-20, 21-30, ...) —
// unlike a typical search-results pager, clicking "next block" (»») always
// advances to the NEXT set of 10 numbers rather than resetting the visible
// range back to 1-10, so you can jump straight to e.g. page 26 by opening
// the 21-30 block and clicking 26, without paging through 1-25 one at a time.
function PageNav({page, totalPages, onGoTo}){
  const BLOCK = 10;
  const blockStart = Math.floor((page - 1) / BLOCK) * BLOCK + 1;
  const blockEnd = Math.min(totalPages, blockStart + BLOCK - 1);
  const pageNumbers = [];
  for (let p = blockStart; p <= blockEnd; p++) pageNumbers.push(p);

  const btnStyle = (active, disabled)=>({
    padding:'6px 10px', borderRadius:'6px', fontSize:'12px', fontWeight:active?700:400,
    border:'0.5px solid '+(active?'#27500A':'#d6d3d1'),
    background:disabled?'#f5f5f4':(active?'#EAF3DE':'#fff'),
    color:disabled?'#cbc9c6':(active?'#27500A':'#1c1917'),
    cursor:disabled?'not-allowed':'pointer', minWidth:'34px', textAlign:'center',
  });

  const blockBtnStyle = (disabled)=>({
    ...btnStyle(false, disabled),
    display:'flex', alignItems:'center', gap:'3px', fontSize:'11px', fontWeight:600,
    padding:'6px 9px',
  });

  const hasPrevBlock = blockStart > 1;
  const prevBlockStart = Math.max(1, blockStart - BLOCK);
  const prevBlockEnd = blockStart - 1;
  const hasNextBlock = blockEnd < totalPages;
  const nextBlockStart = blockStart + BLOCK;
  const nextBlockEnd = Math.min(totalPages, blockStart + 2 * BLOCK - 1);

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'5px',marginTop:'18px',flexWrap:'wrap'}}>
      <button onClick={()=>onGoTo(prevBlockStart)} disabled={!hasPrevBlock} style={blockBtnStyle(!hasPrevBlock)} title={hasPrevBlock? "Jump to pages "+prevBlockStart+"–"+prevBlockEnd : undefined}>‹‹{hasPrevBlock? ' '+prevBlockStart+'-'+prevBlockEnd : ''}</button>
      <button onClick={()=>onGoTo(Math.max(1,page-1))} disabled={page<=1} style={btnStyle(false, page<=1)} title="Previous page">‹</button>
      {pageNumbers.map(p=><button key={p} onClick={()=>onGoTo(p)} style={btnStyle(p===page,false)}>{p}</button>)}
      <button onClick={()=>onGoTo(Math.min(totalPages,page+1))} disabled={page>=totalPages} style={btnStyle(false, page>=totalPages)} title="Next page">›</button>
      <button onClick={()=>onGoTo(nextBlockStart)} disabled={!hasNextBlock} style={blockBtnStyle(!hasNextBlock)} title={hasNextBlock? "Jump to pages "+nextBlockStart+"–"+nextBlockEnd : undefined}>{hasNextBlock? nextBlockStart+'-'+nextBlockEnd+' ' : ''}››</button>
      <div style={{fontSize:'11px',color:'#a8a29e',marginLeft:'8px'}}>Page {page} of {totalPages.toLocaleString()}</div>
    </div>
  );
}

function QuoteBrowserTab({seed}){
  const [page, setPage] = useState(1);
  const [pageSize] = useState(80);
  const [stateFilter, setStateFilter] = useState('');
  const [stageFilter, setStageFilter] = useState('');
  const [cityFilter, setCityFilter] = useState((seed&&seed.city)||'');
  const [routeFilter, setRouteFilter] = useState((seed&&seed.route)||'');
  const [dayMode, setDayMode] = useState(seed&&seed.days? 'exact' : (seed&&seed.minDays? 'atLeast':'any'));
  const [dayValue, setDayValue] = useState((seed&&(seed.days||seed.minDays))||7);
  const [q, setQ] = useState('');
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [detail, setDetail] = useState(null);
  const [cityOptions, setCityOptions] = useState([]);
  const [totalCleanQuotes, setTotalCleanQuotes] = useState(null);

  // City list for the dropdown — same source (clean-analytics'
  // cityFrequency, always the full unfiltered list) as the dropdown in the
  // Analytics tab, so both tabs offer the identical set of cities. Also
  // grabs the real total cleaned-quote count (NOT hardcoded — that count
  // changes whenever the cleaning rules or source data change, e.g. it
  // dropped from 3,864 to 3,847 after the junk-city fix).
  useEffect(()=>{
    fetch('quotes/clean-analytics')
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(d=>{ setCityOptions(d.cityFrequency.map(c=>c.city)); setTotalCleanQuotes(d.totalQuotesUnfiltered); })
      .catch(()=>setCityOptions([]));
  }, []);

  // A new seed (clicking through from Analytics again) should re-apply,
  // even if the tab was already mounted — otherwise a second drill-down
  // click while already on this tab would silently do nothing.
  useEffect(()=>{
    if(!seed) return;
    setCityFilter(seed.city||'');
    setRouteFilter(seed.route||'');
    setDayMode(seed.days? 'exact' : (seed.minDays? 'atLeast':'any'));
    setDayValue(seed.days||seed.minDays||7);
    setStateFilter(''); setStageFilter(''); setQ('');
  }, [seed]);

  useEffect(()=>{
    const params = new URLSearchParams({page, pageSize});
    if(stateFilter) params.set('state', stateFilter);
    if(stageFilter) params.set('stage', stageFilter);
    if(cityFilter.trim()) params.set('city', cityFilter.trim());
    if(routeFilter.trim()) params.set('route', routeFilter.trim());
    if(dayMode==='exact') params.set('days', dayValue);
    if(dayMode==='atLeast') params.set('minDays', dayValue);
    if(q.trim()) params.set('q', q.trim());
    setData(null);
    // export-clean: browses only the 3,864 quotes that passed the day-
    // numbering/route cleaning pass (clean_quotes.php) — the excluded ones
    // (bad day sequencing, missing city, etc.) are deliberately left out of
    // this view, not just hidden.
    fetch('quotes/export-clean?'+params.toString())
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setData)
      .catch(()=>setError('Could not load quotes — is the itinerary_builder server running?'));
  }, [page, pageSize, stateFilter, stageFilter, cityFilter, routeFilter, dayMode, dayValue, q]);

  // Reset to page 1 whenever a filter changes (not when only the page itself changes).
  useEffect(()=>{ setPage(1); }, [stateFilter, stageFilter, cityFilter, routeFilter, dayMode, dayValue, q]);

  const ALL_STATES = ['NSW','VIC','QLD','WA','SA','TAS','NT','ACT'];

  return (
    <div style={{display:'flex',height:'100%'}}>
      <div style={{width:'220px',minWidth:'220px',background:'#fff',borderRight:'0.5px solid #e7e5e4',overflowY:'auto',padding:'12px 10px',display:'flex',flexDirection:'column',gap:'12px'}}>
        <div>
          <div style={{fontSize:'10px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>Search quote #</div>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="e.g. TDU301" style={{width:'100%',border:'0.5px solid #d6d3d1',borderRadius:'6px',padding:'6px 8px',fontSize:'12px'}}/>
        </div>
        <div>
          <div style={{fontSize:'10px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>City</div>
          <select value={cityFilter} onChange={e=>setCityFilter(e.target.value)} style={{width:'100%',border:'0.5px solid #d6d3d1',borderRadius:'6px',padding:'6px 8px',fontSize:'12px',background:'#fff',cursor:'pointer'}}>
            <option value="">Any city</option>
            {cityOptions.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:'10px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>State</div>
          <select value={stateFilter} onChange={e=>setStateFilter(e.target.value)} style={{width:'100%',border:'0.5px solid #d6d3d1',borderRadius:'6px',padding:'6px 8px',fontSize:'12px',background:'#fff',cursor:'pointer'}}>
            <option value="">All states</option>
            {ALL_STATES.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:'10px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>Trip length</div>
          <div style={{display:'flex',gap:'4px',marginBottom:'6px'}}>
            {[['any','Any'],['exact','Exactly'],['atLeast','At least']].map(([k,label])=>(
              <div key={k} onClick={()=>setDayMode(k)} style={{flex:1,textAlign:'center',padding:'4px 0',borderRadius:'5px',fontSize:'10px',fontWeight:dayMode===k?700:400,cursor:'pointer',background:dayMode===k?'#EAF3DE':'#f5f5f4',color:dayMode===k?'#27500A':'#57534e'}}>{label}</div>
            ))}
          </div>
          {dayMode!=='any'? (
            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <input type="range" min={1} max={20} value={dayValue} onChange={e=>setDayValue(Number(e.target.value))} style={{flex:1}}/>
              <div style={{fontSize:'12px',fontWeight:600,minWidth:'26px',textAlign:'right'}}>{dayValue}d</div>
            </div>
          ):null}
        </div>
        <div>
          <div style={{fontSize:'10px',fontWeight:600,color:'#57534e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>Stage</div>
          <select value={stageFilter} onChange={e=>setStageFilter(e.target.value)} style={{width:'100%',border:'0.5px solid #d6d3d1',borderRadius:'6px',padding:'6px 8px',fontSize:'12px',background:'#fff',cursor:'pointer'}}>
            <option value="">All stages</option>
            {['Accepted','Rejected','Auto Rejected','Accounts - Reconciliation','Created','On Ground'].map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        {data? (
          <div style={{fontSize:'11px',color:'#a8a29e',lineHeight:1.5,borderTop:'0.5px solid #f5f5f4',paddingTop:'12px'}}>
            {data.totalMatching.toLocaleString()} of {totalCleanQuotes!=null?totalCleanQuotes.toLocaleString():'—'} cleaned quotes match these filters.<br/>Every individual quote — not grouped into a pattern.
          </div>
        ):null}
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
        <div style={{marginBottom:'10px'}}>
          <div style={{fontSize:'16px',fontWeight:700}}>All Quotes (Cleaned, Unpatterned)</div>
          <div style={{fontSize:'11px',color:'#a8a29e',marginTop:'2px'}}>
            Every CLEANED quote, one card each — no grouping. This is the same {totalCleanQuotes!=null?totalCleanQuotes.toLocaleString():'—'}-quote set
            behind the Itinerary Patterns tab, just browsed individually instead of merged into route patterns. Quotes
            excluded during cleaning (bad day sequencing, missing/junk city, etc.) are not shown here.
          </div>
          {routeFilter? (
            <div style={{marginTop:'8px',fontSize:'11px',color:'#166534',background:'#EAF3DE',border:'0.5px solid #C0DD97',borderRadius:'6px',padding:'5px 9px',display:'inline-block'}}>
              Filtered to route: <b>{routeFilter}</b>
            </div>
          ):null}
          {(stateFilter||stageFilter||cityFilter||routeFilter||dayMode!=='any'||q)? (
            <div style={{marginTop:'10px'}}>
              <button onClick={()=>{setStateFilter('');setStageFilter('');setCityFilter('');setRouteFilter('');setDayMode('any');setQ('');}} style={{padding:'4px 10px',borderRadius:'6px',fontSize:'11px',border:'0.5px solid #d6d3d1',background:'#fff',color:'#57534e',cursor:'pointer'}}>✕ Clear filters</button>
            </div>
          ):null}
        </div>

        {error? <div style={{padding:'40px',textAlign:'center',color:'#991B1B'}}>{error}</div>:null}
        {!error && !data? <div style={{padding:'40px',textAlign:'center',color:'#a8a29e'}}>Loading…</div>:null}

        {data? (
          <React.Fragment>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:'8px'}}>
              {data.quotes.map(qt=>{
                const bandColor = BAND_COL[qt.trip_band] || '#a8a29e';
                return (
                <div key={qt.quote_no} style={{background:'#fff',border:'0.5px solid #e7e5e4',borderLeft:'3px solid '+bandColor,borderRadius:'8px',padding:'11px 13px',cursor:'pointer'}} onClick={()=>setDetail(qt)}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <div style={{fontSize:'13px',fontWeight:700}}>{qt.quote_no}</div>
                    <span style={{fontSize:'10px',fontWeight:600,color:bandColor,background:bandColor+'1a',borderRadius:'99px',padding:'1px 7px'}}>{qt.total_days? qt.total_days+'d':'—'}</span>
                  </div>
                  {qt.route? <div style={{fontSize:'11px',color:'#0C447C',marginTop:'2px'}}>{qt.route}</div>:null}
                  <div style={{display:'flex',flexWrap:'wrap',gap:'3px',marginTop:'6px'}}>
                    {(qt.states_touched||[]).length? qt.states_touched.map(s=><span key={s} style={stateChipStyle(s,true)}>{s}</span>) : <span style={{fontSize:'10px',color:'#a8a29e'}}>No mapped state</span>}
                  </div>
                  <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'6px'}}>{(qt.products||[]).length} products{(qt.hotels||[]).length?', '+qt.hotels.length+' hotels':''}</div>
                </div>
              );})}
            </div>

            <PageNav page={page} totalPages={data.totalPages} onGoTo={setPage}/>
          </React.Fragment>
        ):null}
      </div>

      <QuoteDetailModal q={detail} onClose={()=>setDetail(null)}/>
    </div>
  );
}

// ── Analytics tab ────────────────────────────────────────────────────────
// Split into two sub-tabs per the product owner's explicit request (a wall
// of 7 clumped charts was unreadable and mostly non-interactive):
//   Overview — one clear focus per screen (Trip length / Cities & states /
//     Categories & products / Route uniqueness), still fully interactive —
//     clicking anything filters that screen's own inline quote list.
//   Explore  — a single persistent filter bar (day, city, category, route)
//     that combines freely, with one live quote list that updates as you
//     adjust filters — the "just let me poke at the data" view.
// Both share InlineQuoteList so clicking ANYTHING shows the matching quotes
// right there, not a separate step or a different tab.
// Deliberately ignores quotestage throughout (per the product owner: these
// quotes were built manually via questionnaires, not real customer
// transactions, so accept/reject carries no meaning here).

// Interactive bar-chart histogram — every bar is clickable (calls
// onBarClick with its x-value) and shows a hover tooltip via title=.
// No charting library dependency (this mock has no build step/bundler).
// Bars are capped at MAX_BAR_W so a chart with few buckets (e.g. 20 days)
// doesn't stretch each bar to 100+px wide on a maximized monitor — real
// histograms read as a cluster of reasonably-proportioned bars, not a
// handful of enormous rectangles with elongated gaps. The chart itself is
// centered (not flex-stretched) so the unused width becomes honest
// whitespace on both sides rather than being forced into the bars.
function Histogram({data, xKey, yKey, color, height, onBarClick, activeX}){
  const max = Math.max(1, ...data.map(d=>d[yKey]));
  const MAX_BAR_W = 34;
  return (
    <div style={{display:'flex',alignItems:'flex-end',justifyContent:'center',gap:'4px',height:(height||160)+'px',padding:'0 2px'}}>
      {data.map((d,i)=>{
        const h = Math.max(2, Math.round(d[yKey]/max*(height||160)));
        const active = activeX!=null && d[xKey]===activeX;
        return (
          <div key={i} style={{width:MAX_BAR_W+'px',flexShrink:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',height:'100%',cursor:onBarClick?'pointer':'default'}}
            onClick={()=>onBarClick&&onBarClick(d[xKey])} title={d[xKey]+' days: '+d[yKey].toLocaleString()+' quotes — click to see them below'}>
            <div style={{width:'100%',height:h+'px',background:active?'#166534':(color||'#378ADD'),borderRadius:'2px 2px 0 0',transition:'height .2s'}}/>
            <div style={{fontSize:'9px',color:active?'#166534':'#a8a29e',marginTop:'3px',fontWeight:active?700:400}}>{d[xKey]}</div>
          </div>
        );
      })}
    </div>
  );
}

// Horizontal bar row — clickable when onClick is passed, with a real numeric
// label explaining what the number MEANS (not a bare digit like "9544").
function QD_HBar({label, value, valueLabel, max, color, onClick, chip, active, labelWidth, stacked}){
  const pct = Math.round(value/(max||1)*100);
  const labelEl = chip
    ? <div style={{width:'92px',flexShrink:0,display:'flex',justifyContent:'flex-start'}}>
        <span style={{...chip,justifyContent:'center',display:'inline-flex',whiteSpace:'nowrap'}}>{label}</span>
      </div>
    : <div style={stacked
        ? {fontSize:'11px',color:onClick?'#0C447C':'#57534e',fontWeight:active?700:400,lineHeight:1.3,marginBottom:'2px'}
        : {fontSize:'11px',color:onClick?'#0C447C':'#57534e',fontWeight:active?700:400,width:labelWidth||'110px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',flexShrink:0}}
        title={stacked? undefined : label}>{label}</div>;

  if(stacked){
    return (
      <div onClick={onClick} style={{cursor:onClick?'pointer':'default',padding:'4px 5px',borderRadius:'5px',background:active?'#EAF3DE':'transparent'}}
        onMouseEnter={e=>{if(onClick&&!active)e.currentTarget.style.background='#f5f5f4';}} onMouseLeave={e=>{if(!active)e.currentTarget.style.background='transparent';}}>
        {labelEl}
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <Bar pct={pct} color={color}/>
          <div style={{fontSize:'10px',color:'#a8a29e',textAlign:'right',flexShrink:0,whiteSpace:'nowrap'}}>{valueLabel||value.toLocaleString()}</div>
        </div>
      </div>
    );
  }

  return (
    <div onClick={onClick} style={{display:'flex',alignItems:'center',gap:'8px',cursor:onClick?'pointer':'default',padding:'3px 5px',borderRadius:'5px',background:active?'#EAF3DE':'transparent'}}
      onMouseEnter={e=>{if(onClick&&!active)e.currentTarget.style.background='#f5f5f4';}} onMouseLeave={e=>{if(!active)e.currentTarget.style.background='transparent';}}>
      {labelEl}
      <Bar pct={pct} color={color}/>
      <div style={{fontSize:'10px',color:'#a8a29e',minWidth:'128px',textAlign:'right',flexShrink:0}}>{valueLabel||value.toLocaleString()}</div>
    </div>
  );
}

// InlineQuoteList — the shared "show me the quotes behind this number"
// component. Fetches quotes/export-clean?light=1 for whatever filter object
// it's given and renders a compact, scrollable card list right where it's
// placed (never a separate tab/step) — clicking a card opens the same
// QuoteDetailModal used everywhere else in this app.
function buildExportParams(filters, page, pageSize, light){
  const params = new URLSearchParams({page, pageSize});
  if(light !== false) params.set('light', 1);
  if(filters.days!=null) params.set('days', filters.days);
  if(filters.minDays!=null) params.set('minDays', filters.minDays);
  if(filters.maxDays!=null) params.set('maxDays', filters.maxDays);
  if(filters.city) params.set('city', filters.city);
  if(filters.cityRules) params.set('cityRules', filters.cityRules);
  if(filters.numCities!=null) params.set('numCities', filters.numCities);
  if(filters.numCitiesMode) params.set('numCitiesMode', filters.numCitiesMode);
  if(filters.state) params.set('state', filters.state);
  if(filters.stateMode) params.set('stateMode', filters.stateMode);
  if(filters.route) params.set('route', filters.route);
  if(filters.routes) params.set('routes', filters.routes);
  if(filters.category) params.set('category', filters.category);
  if(filters.product) params.set('product', filters.product);
  if(filters.hotel) params.set('hotel', filters.hotel);
  if(filters.band) params.set('band', filters.band);
  if(filters.month) params.set('month', filters.month);
  if(filters.hasHotels) params.set('hasHotels', 1);
  if(filters.transferStyle) params.set('transferStyle', filters.transferStyle);
  if(filters.duplicatesOnly) params.set('duplicatesOnly', 1);
  if(filters.originalsOnly) params.set('originalsOnly', 1);
  return params;
}
function InlineQuoteList({filters, emptyHint}){
  const [page, setPage] = useState(1);
  const [data, setData] = useState(null);
  const [detail, setDetail] = useState(null);
  const hasAnyFilter = filters && (filters.days!=null||filters.minDays!=null||filters.city||filters.state||filters.route||filters.category||filters.product||filters.hotel||filters.band||filters.month);

  useEffect(()=>{ setPage(1); }, [filters.days, filters.minDays, filters.city, filters.state, filters.route, filters.category, filters.product, filters.hotel, filters.band, filters.month]);
  useEffect(()=>{
    if(!hasAnyFilter){ setData(null); return; }
    const params = buildExportParams(filters, page, 48);
    setData(null);
    fetch('quotes/export-clean?'+params.toString())
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setData)
      .catch(()=>setData({quotes:[],totalMatching:0,totalPages:0}));
  }, [filters.days, filters.minDays, filters.city, filters.route, filters.category, page]);

  if(!hasAnyFilter) return <div style={{fontSize:'11px',color:'#a8a29e',padding:'14px 0',textAlign:'center'}}>{emptyHint||'Click a bar or row above to see the quotes behind it.'}</div>;
  if(!data) return <div style={{fontSize:'11px',color:'#a8a29e',padding:'14px 0',textAlign:'center'}}>Loading quotes…</div>;

  return (
    <div>
      <div style={{fontSize:'11px',color:'#57534e',marginBottom:'8px'}}>{data.totalMatching.toLocaleString()} matching quote{data.totalMatching===1?'':'s'}</div>
      {data.quotes.length? (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:'8px'}}>
          {data.quotes.map(qt=>{
            const bandColor = BAND_COL[qt.trip_band] || '#a8a29e';
            return (
            <div key={qt.quote_no} onClick={()=>setDetail(qt)} style={{background:'#fff',border:'0.5px solid #e7e5e4',borderLeft:'3px solid '+bandColor,borderRadius:'6px',padding:'8px 10px',cursor:'pointer'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                <div style={{fontSize:'12px',fontWeight:700}}>{qt.quote_no}</div>
                <span style={{fontSize:'9px',fontWeight:600,color:bandColor,background:bandColor+'1a',borderRadius:'99px',padding:'1px 6px'}}>{qt.total_days?qt.total_days+'d':'—'}</span>
              </div>
              {qt.route? <div style={{fontSize:'10px',color:'#0C447C',marginTop:'2px'}}>{qt.route}</div>:null}
              <div style={{display:'flex',flexWrap:'wrap',gap:'2px',marginTop:'4px'}}>
                {(qt.states_touched||[]).slice(0,4).map(s=><span key={s} style={stateChipStyle(s,true)}>{s}</span>)}
              </div>
            </div>
          );})}
        </div>
      ):<div style={{fontSize:'11px',color:'#a8a29e'}}>No quotes match this exact combination.</div>}
      {data.totalPages>1? <PageNav page={page} totalPages={data.totalPages} onGoTo={setPage}/>:null}
      <QuoteDetailModal q={detail} onClose={()=>setDetail(null)}/>
    </div>
  );
}

// Shared data-fetching hook — both sub-tabs hit the same endpoint with the
// same filter shape, so the fetch/loading/error plumbing lives in one place.
function useCleanAnalytics(filters){
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  useEffect(()=>{
    const params = new URLSearchParams();
    if(filters.days!=null) params.set('days', filters.days);
    if(filters.minDays!=null) params.set('minDays', filters.minDays);
    if(filters.city) params.set('city', filters.city);
    if(filters.state) params.set('state', filters.state);
    if(filters.route) params.set('route', filters.route);
    if(filters.category) params.set('category', filters.category);
    if(filters.product) params.set('product', filters.product);
    if(filters.hotel) params.set('hotel', filters.hotel);
    if(filters.band) params.set('band', filters.band);
    if(filters.month) params.set('month', filters.month);
    setData(null);
    fetch('quotes/clean-analytics'+(params.toString()?'?'+params.toString():''))
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setData)
      .catch(()=>setError('Could not load analytics — is the itinerary_builder server running?'));
  }, [filters.days, filters.minDays, filters.city, filters.state, filters.route, filters.category, filters.product, filters.hotel, filters.band, filters.month]);
  return {data, error};
}
