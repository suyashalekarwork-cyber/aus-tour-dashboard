                    <QD_HBar key={i} label={r.route} value={r.count} max={maxRouteCount} color={ANALYTICS_COL.routes} stacked
                      active={routeFilter===r.route}
                      valueLabel={r.count.toLocaleString()+' quotes on this route'}
                      onClick={()=>setRouteFilter(prev=>prev===r.route?'':r.route)}/>
                  ))}
                </div>
              </Panel>
              <Panel title="Variety within each route" sub="Same top routes — DISTINCT product/day combos among quotes on it.">
                {data.productMetricsAvailable? (
                  <div style={{display:'flex',flexDirection:'column',gap:'4px',maxHeight:'280px',overflowY:'auto'}}>
                    {routeCombos.map((r,i)=>(
                      <QD_HBar key={i} label={r.route} value={r.distinctProductCombos} max={Math.max(1,...routeCombos.map(x=>x.distinctProductCombos))} color={PANEL_COL.secondary} stacked
                        active={routeFilter===r.route}
                        valueLabel={r.distinctProductCombos.toLocaleString()+' combos / '+r.quotes.toLocaleString()+' quotes'}
                        onClick={()=>setRouteFilter(prev=>prev===r.route?'':r.route)}/>
                    ))}
                  </div>
                ):(
                  <div style={{fontSize:'11px',color:'#a8a29e',padding:'8px 0'}}>Not shown while any filter is active — clear filters above.</div>
                )}
              </Panel>
            </div>
            <div style={{marginTop:'8px'}}>
              <Panel title={routeFilter? 'Quotes on route: '+routeFilter : 'Matching quotes'}><InlineQuoteList filters={filters} emptyHint="Click a route on either side to see its quotes."/></Panel>
            </div>
          </React.Fragment>
        ):null}
      </div>
    </div>
  );
}

// ── Product deep-dive: ported from the live dashboard's "Cumulative
// Analytics" tab (quotes_products()/QuotesCumulativeAnalytics) — category
// mix by trip-length band, product city-concentration (single-city vs.
// spread-out products), and comment-field mining. Entirely quotestage-free
// in the original too, so nothing here needed reframing. Reads only
// quotes/clean-products (the cleaned 3,847-quote set) via its own fetch,
// separate from the shared clean-analytics data the other screens use.
// Folded into the Products screen as a compact block instead of its own
// full-page section. Also fixes a dead panel from the original: "Comment-
// field mining" used to render as an empty box with just a caption (Panel
// doesn't support the "wide" prop it was passed, and its body was a bare
// empty div) — that caption is now folded into the comment-rate panel's own
// sub-caption instead of wasting a whole empty panel's worth of space.
// Small hollow (donut) pie chart — data is a plain {category: pct} map that
// already sums to ~100, so no lines/total math is needed here (unlike
// QD_QaPieChart, which computes % share from raw counts itself).
function QD_DonutChart({data, counts, innerRadiusFrac, size, activeCategory, onCategoryClick}){
  const entries = Object.entries(data||{});
  const r = 55, cx = 65, cy = 65, innerR = r * (innerRadiusFrac==null?0.6:innerRadiusFrac);
  let acc = 0;
  const total = entries.reduce((s,[,pct])=>s+pct, 0) || 1;
  // A single 100%-share entry (e.g. filtered down to exactly one category)
  // makes start/end land on the EXACT same point on the circle — SVG's arc
  // command can't draw a true full circle that way (zero sweep angle), so
  // the path silently rendered nothing. Clamping just shy of the full turn
  // keeps it a valid arc while looking like a complete circle.
  const FULL_TURN_EPSILON = 0.0001;
  const slices = entries.map(([cat,pct])=>{
    const start = acc/total*2*Math.PI - Math.PI/2;
    acc += pct;
    let end = acc/total*2*Math.PI - Math.PI/2;
    if (end - start >= 2*Math.PI - FULL_TURN_EPSILON) end -= FULL_TURN_EPSILON;
    const large = (end-start) > Math.PI ? 1 : 0;
    const mid = (start+end)/2;
    // Active slice is "embossed" by nudging it outward along its own
    // bisector before drawing — reads as popped-out/pressed rather than
    // just recoloring, so the click registers as a physical action.
    const active = activeCategory===cat;
    const pushX = active? 4*Math.cos(mid) : 0, pushY = active? 4*Math.sin(mid) : 0;
    const x1o = cx+pushX + r*Math.cos(start), y1o = cy+pushY + r*Math.sin(start);
    const x2o = cx+pushX + r*Math.cos(end), y2o = cy+pushY + r*Math.sin(end);
    const x1i = cx+pushX + innerR*Math.cos(end), y1i = cy+pushY + innerR*Math.sin(end);
    const x2i = cx+pushX + innerR*Math.cos(start), y2i = cy+pushY + innerR*Math.sin(start);
    const path = `M ${x1o} ${y1o} A ${r} ${r} 0 ${large} 1 ${x2o} ${y2o} L ${x1i} ${y1i} A ${innerR} ${innerR} 0 ${large} 0 ${x2i} ${y2i} Z`;
    const color = (CAT_COL[cat]||CAT_COL.Uncategorised).tx;
    const count = counts? (counts[cat]??null) : null;
    return {cat, pct, path, color, count, active};
  });
  // Legend sits BESIDE the donut (not on tiny slivers inside it, which was
  // unreadable) — sorted biggest-share-first so the list reads like a
  // ranking, matching how someone would scan a legend.
  const legendEntries = [...slices].sort((a,b)=>b.pct-a.pct);
  const anyDimmed = activeCategory!=null;
  function toggle(cat){ if(onCategoryClick) onCategoryClick(cat); }
  return (
    <div style={{display:'inline-flex',alignItems:'center',gap:'12px'}}>
      <svg viewBox="0 0 130 130" style={{width:(size||130)+'px',height:(size||130)+'px',flexShrink:0,overflow:'visible'}}>
        {slices.map((s,i)=>(
          <path key={i} d={s.path} fill={s.color}
            opacity={anyDimmed && !s.active? .3 : .85}
            stroke="#fff" strokeWidth={1.5}
            onClick={onCategoryClick? ()=>toggle(s.cat) : undefined}
            style={{cursor:onCategoryClick?'pointer':'default',filter:s.active?'drop-shadow(0 2px 3px rgba(0,0,0,.35))':'none',transition:'opacity .15s, filter .15s'}}>
            <title>{s.cat}: {s.pct}%{s.count!=null? ' ('+s.count.toLocaleString()+')':''}</title>
          </path>
        ))}
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
        {legendEntries.map((s,i)=>(
          <div key={i} onClick={onCategoryClick? ()=>toggle(s.cat) : undefined}
            style={{display:'flex',alignItems:'center',gap:'6px',cursor:onCategoryClick?'pointer':'default',padding:'2px 5px',borderRadius:'5px',background:s.active?'#EAF3DE':'transparent',opacity:anyDimmed && !s.active? .5:1,transition:'opacity .15s, background .15s'}}>
            <span style={{display:'inline-block',width:'8px',height:'8px',borderRadius:'2px',background:s.color,opacity:.85,flexShrink:0}}/>
            <span style={{fontSize:'11px',color:s.active?'#27500A':'#1c1917',fontWeight:s.active?700:600,minWidth:'32px'}}>{Math.round(s.pct*10)/10}%</span>
            <span style={{fontSize:'11px',color:s.active?'#27500A':'#57534e',fontWeight:s.active?600:400}}>{s.cat}</span>
            {s.count!=null? <span style={{fontSize:'10px',color:'#a8a29e'}}>({s.count.toLocaleString()})</span>:null}
          </div>
        ))}
      </div>
    </div>
  );
}

function ProductDeepDiveCompact({categoryFilter, productFilter, cityFilter, onProductClick, onCategoryClick, onCityClick}){
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [extra, setExtra] = useState(null);
  // The donut's OWN data, fetched separately from `data` below and always
  // ignoring categoryFilter (product/city filters still apply). Clicking
  // a slice sets categoryFilter, which would otherwise collapse this same
  // city's data to 100% one category — the whole point of a "click a
  // slice to filter the rest of the screen" interaction is comparing
  // categories against each other, so the donut itself has to keep
  // showing every category's true share regardless of which one is
  // selected as the active filter.
  const [donutData, setDonutData] = useState(null);
  // The city dropdown here IS cityFilter/onCityClick (the SAME control
  // used by the "Products"/"Most common hotels" panels below on this
  // screen) — previously this was a separate, disconnected local
  // `selectedCity` state, so picking a city here did nothing for those
  // other panels even though it looked like a working filter. Falls back
  // to the first available city only for browsing when no filter is set.
  const [fallbackCity, setFallbackCity] = useState('');
  const selectedCity = cityFilter || fallbackCity;

  useEffect(()=>{
    // Deliberately does NOT setData(null) here — clicking a donut slice
    // (or any other filter) used to blank the whole panel to a "Loading…"
    // placeholder while refetching, which made the donut you just clicked
    // vanish for a moment. Keeping the last-known data on screen during
    // the refetch means the click just updates numbers/emboss in place.
    let cancelled = false;
    const params = new URLSearchParams();
    if(categoryFilter) params.set('category', categoryFilter);
    if(productFilter) params.set('product', productFilter);
    if(cityFilter) params.set('city', cityFilter);
    const qs = params.toString();
    fetch('quotes/clean-products'+(qs?'?'+qs:''))
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(d=>{ if(!cancelled) setData(d); })
      .catch(()=>{ if(!cancelled) setError('Could not load product deep-dive — is the itinerary_builder server running?'); });
    return ()=>{ cancelled = true; };
  }, [categoryFilter, productFilter, cityFilter]);

  useEffect(()=>{
    let cancelled = false;
    const params = new URLSearchParams();
    if(productFilter) params.set('product', productFilter);
    if(cityFilter) params.set('city', cityFilter);
    const qs = params.toString();
    fetch('quotes/clean-products'+(qs?'?'+qs:''))
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(d=>{ if(!cancelled) setDonutData(d); })
      .catch(()=>{});
    return ()=>{ cancelled = true; };
  }, [productFilter, cityFilter]);

  // quotes/clean-extra is dataset-wide and ignores filters entirely (no
  // quotes_read_filters() call on that endpoint) — fetched once, separate
  // from the filter-reactive effect above, so it's never re-requested with
  // params it would silently ignore.
  useEffect(()=>{
    fetch('quotes/clean-extra').then(r=>r.ok?r.json():null).then(setExtra).catch(()=>setExtra(null));
  }, []);

  if(error) return <div style={{color:'#991B1B',fontSize:'11px',padding:'8px 0'}}>{error}</div>;
  if(!data) return <div style={{color:'#a8a29e',fontSize:'11px',padding:'8px 0'}}>Loading product deep-dive…</div>;

  const bandOrder = ['1-4d','5-7d','8-10d','11-13d','14-16d','17d+'];
  const bandsPresent = bandOrder.filter(b=>data.categoryByTripBand[b]);
  const maxDistinct = extra? Math.max(1, ...extra.distinctProductsByBand.map(b=>b.median)) : 1;

  // Answer the panel's own "does trip length shift the category mix"
  // question instead of leaving it to be eyeballed: compare the shortest
  // vs longest present band directly (band is ordinal, so a "shifts as
  // trips get longer" framing is more natural here than a single-biggest-
  // deviation callout) and report the category that moved most.
  let bandShift = null;
  if(bandsPresent.length>=2){
    const first = data.categoryByTripBand[bandsPresent[0]];
    const last = data.categoryByTripBand[bandsPresent[bandsPresent.length-1]];
    const cats = new Set([...Object.keys(first.categoryShare), ...Object.keys(last.categoryShare)]);
    cats.forEach(cat=>{
      const delta = (last.categoryShare[cat]||0) - (first.categoryShare[cat]||0);
      if(!bandShift || Math.abs(delta) > Math.abs(bandShift.delta)) bandShift = {cat, delta, from:first.categoryShare[cat]||0, to:last.categoryShare[cat]||0};
    });
  }

  // City-level headline numbers for the KPI strip — same idea as the
  // "Cleaned quotes / Total products / ..." tiles at the top of the Quotes
  // tab, just for this Products screen: distinct cities selling anything,
  // dataset-wide distinct product count (a product sold in 5 cities counts
  // once here, not 5 times — union across cities, not a sum), and the
  // average distinct-products-per-city (sum of each city's own count,
  // divided by city count — a product sold everywhere DOES count once per
  // city here, since "how varied is a typical city's own menu" is a
  // different question from "how many distinct products exist overall").
  const byCity = (donutData||data).byCity||[];
  const totalCitiesWithProducts = byCity.length;
  const totalBookingsAllCities = byCity.reduce((s,c)=>s+c.totalLineItems, 0);
  const avgDistinctPerCity = totalCitiesWithProducts? Math.round(byCity.reduce((s,c)=>s+c.distinctProducts,0)/totalCitiesWithProducts) : 0;
  const avgBookingsPerCity = totalCitiesWithProducts? Math.round(totalBookingsAllCities/totalCitiesWithProducts) : 0;
  const cityOptions = byCity.map(c=>c.city);
  const activeCity = selectedCity && byCity.find(c=>c.city===selectedCity) ? selectedCity : (cityOptions[0]||'');
  const cityInfo = byCity.find(c=>c.city===activeCity);

  return (
    <React.Fragment>
      <div style={{display:'flex',flexWrap:'wrap',gap:'10px',marginBottom:'8px'}}>
        <KpiTile label="Distinct products (overall)" value={(donutData||data).distinctProductsOverall!=null? (donutData||data).distinctProductsOverall.toLocaleString() : '—'} bg="#E9F1FB" fg="#184F95"/>
        <KpiTile label="Cities selling products" value={totalCitiesWithProducts} bg="#EAF3DE" fg="#27500A"/>
        <KpiTile label="Avg. distinct products / city" value={avgDistinctPerCity} sub="each city's own menu size" bg="#FDF3DC" fg="#8A6200"/>
        <KpiTile label="Avg. bookings / city" value={avgBookingsPerCity.toLocaleString()} bg="#FCE9E1" fg="#B84A1E"/>
      </div>

      {cityInfo? (
        <Panel title="Products by city" sub="Two different % breakdowns for the selected city: how its BOOKINGS split by category vs. how its MENU of distinct products splits by category — a category can dominate one without dominating the other.">
          <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px',flexWrap:'wrap'}}>
            <select value={activeCity} onChange={e=>{ setFallbackCity(e.target.value); if(onCityClick) onCityClick(e.target.value); }} style={{border:'0.5px solid #d6d3d1',borderRadius:'6px',padding:'6px 10px',fontSize:'12px',background:'#fff',cursor:'pointer'}}>
              {cityOptions.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            <div style={{fontSize:'10px',color:'#a8a29e'}}>{cityInfo.totalLineItems.toLocaleString()} bookings across {cityInfo.distinctProducts.toLocaleString()} distinct products</div>
            {cityFilter? <span style={{fontSize:'10px',color:'#27500A',fontWeight:600}}>Filtering "Products" and "Most common hotels" below to {cityFilter} too.</span>:null}
          </div>
          <div style={{display:'flex',justifyContent:'space-around',flexWrap:'wrap',gap:'32px'}}>
            <div>
              <div style={{fontSize:'11px',color:'#57534e',fontWeight:600,marginBottom:'8px',textAlign:'center'}}>% of bookings</div>
              <QD_DonutChart data={cityInfo.categoryShareByVolume} counts={cityInfo.categoryCountByVolume} size={150}
                activeCategory={categoryFilter||null} onCategoryClick={onCategoryClick}/>
            </div>
            <div>
              <div style={{fontSize:'11px',color:'#57534e',fontWeight:600,marginBottom:'8px',textAlign:'center'}}>% of distinct products</div>
              <QD_DonutChart data={cityInfo.categoryShareByVariety} counts={cityInfo.categoryCountByVariety} size={150}
                activeCategory={categoryFilter||null} onCategoryClick={onCategoryClick}/>
            </div>
          </div>
          {categoryFilter? <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'10px',textAlign:'center'}}>Filtering everything below to "{categoryFilter}" — click the slice again to clear.</div>:null}
        </Panel>
      ):null}

      <div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:'8px'}}>
        <Panel title="Category mix by trip length" sub="Each band's share adds to 100% within that band — a 4-day and a 14-day trip stay comparable despite very different line-item totals.">
          {bandShift? (
            <div style={{fontSize:'11px',fontWeight:600,color:'#1c1917',marginBottom:'8px',padding:'6px 9px',background:'#FAFAF9',borderRadius:'6px',border:'0.5px solid #e7e5e4'}}>
              {bandShift.cat} share {bandShift.delta>0?'rises':'falls'} from {bandShift.from}% ({bandsPresent[0]}) to {bandShift.to}% ({bandsPresent[bandsPresent.length-1]}) as trips get longer.
            </div>
          ):null}
          <div style={{display:'flex',flexDirection:'column',gap:'5px'}}>
            {bandsPresent.map(band=>{
              const info = data.categoryByTripBand[band];
              return (
                <div key={band} style={{display:'flex',alignItems:'center',gap:'8px'}}>
                  <div style={{fontSize:'10px',fontWeight:600,width:'54px',flexShrink:0}}>{band}</div>
                  <div style={{display:'flex',flex:1,height:'14px',borderRadius:'3px',overflow:'hidden'}}>
                    {Object.entries(info.categoryShare).map(([cat,pct])=>(
                      <div key={cat} style={{width:pct+'%',background:(CAT_COL[cat]||CAT_COL.Uncategorised).tx,opacity:.85}} title={cat+': '+pct+'%'}/>
                    ))}
                  </div>
                  <div style={{fontSize:'9px',color:'#a8a29e',minWidth:'70px',textAlign:'right'}}>{info.totalLineItems.toLocaleString()} lines</div>
                </div>
              );
            })}
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'8px',marginTop:'8px',paddingTop:'8px',borderTop:'0.5px solid #f5f5f4'}}>
            {Object.keys(CAT_COL).filter(cat=>cat!=='Uncategorised').map(cat=>(
              <div key={cat} style={{display:'flex',alignItems:'center',gap:'4px',fontSize:'9px',color:'#57534e'}}>
                <span style={{display:'inline-block',width:'9px',height:'9px',borderRadius:'2px',background:CAT_COL[cat].tx,opacity:.85}}/>
                {cat}
              </div>
            ))}
          </div>
        </Panel>
        <Panel title="Real variety, not just volume" sub="Median DISTINCT products per quote, by band — a 14-day trip using more products, or mostly repeating the same ones?">
          {extra? (
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {extra.distinctProductsByBand.filter(b=>b.band!=='Unknown').map(b=>(
                <QD_HBar key={b.band} label={b.band} value={b.median} max={maxDistinct} color={PANEL_COL.tertiary} valueLabel={b.median+' distinct products'}/>
              ))}
            </div>
          ):<div style={{fontSize:'11px',color:'#a8a29e'}}>Loading…</div>}
        </Panel>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginTop:'8px'}}>
        <Panel title="Most single-city products" sub={'Booked ≥30 times, almost entirely in one city.'+(onProductClick? ' Click one to filter the quote list below.':'')}>
          <div style={{display:'flex',flexDirection:'column',gap:'5px',maxHeight:'220px',overflowY:'auto'}}>
            {data.cityConcentration.mostConcentrated.map((p,i)=>(
              <div key={i} onClick={onProductClick? ()=>onProductClick(p.productname) : undefined}
                style={{fontSize:'10px',cursor:onProductClick?'pointer':'default',padding:'2px 4px',borderRadius:'5px',background:productFilter===p.productname?'#EAF3DE':'transparent'}}>
                <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:productFilter===p.productname?700:400,color:onProductClick?'#0C447C':'#1c1917'}} title={p.productname}>{p.productname}</div>
                <div style={{color:'#a8a29e',fontSize:'9px'}}>{p.topCityShare}% in {p.topCity}</div>
              </div>
            ))}
          </div>
        </Panel>
        <Panel title="Most spread-out products" sub={"Sell across many cities, not tied to one."+(onProductClick? ' Click one to filter the quote list below.':'')}>
          <div style={{display:'flex',flexDirection:'column',gap:'5px',maxHeight:'220px',overflowY:'auto'}}>
            {data.cityConcentration.mostSpread.map((p,i)=>(
              <div key={i} onClick={onProductClick? ()=>onProductClick(p.productname) : undefined}
                style={{fontSize:'10px',cursor:onProductClick?'pointer':'default',padding:'2px 4px',borderRadius:'5px',background:productFilter===p.productname?'#EAF3DE':'transparent'}}>
                <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:productFilter===p.productname?700:400,color:onProductClick?'#0C447C':'#1c1917'}} title={p.productname}>{p.productname}</div>
                <div style={{color:'#a8a29e',fontSize:'9px'}}>{p.distinctCities} cities · top {p.topCityShare}%</div>
              </div>
            ))}
          </div>
        </Panel>
        <Panel title="Most likely to carry a comment" sub={'Only '+data.comments.totalWithComment.toLocaleString()+' lines ever have one (median '+data.comments.medianCommentLength+' chars) — signals complexity, not what it says.'+(onProductClick? ' Click one to filter the quote list below.':'')}>
          <div style={{display:'flex',flexDirection:'column',gap:'4px',maxHeight:'220px',overflowY:'auto'}}>
            {data.comments.topCommentProducts.map((p,i)=>(
              <QD_HBar key={i} label={p.productname} value={p.commentRate} max={100} color={PANEL_COL.quinary} stacked
                active={productFilter===p.productname}
                valueLabel={p.commentRate+'%'}
                onClick={onProductClick? ()=>onProductClick(p.productname) : undefined}/>
            ))}
          </div>
        </Panel>
      </div>

    </React.Fragment>
  );
}

// Hotel-specific breakdown — every other deep-dive here covers PRODUCTS but
// not hotels; this fills that gap: most common hotels, hotels-per-quote
// distribution, and hotel city-concentration (single-city vs. spread-out,
// same idea as the product version above but for hotels).
function HotelsCompact({hotelFilter, onHotelClick, categoryFilter, productFilter, cityFilter}){
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  useEffect(()=>{
    // Keeps last-known data on screen during refetch (no setData(null))
    // so clicking a filter elsewhere doesn't blank this whole panel to a
    // loading placeholder — same fix as ProductDeepDiveCompact's donuts.
    let cancelled = false;
    const params = new URLSearchParams();
    if(categoryFilter) params.set('category', categoryFilter);
    if(productFilter) params.set('product', productFilter);
    if(cityFilter) params.set('city', cityFilter);
    if(hotelFilter) params.set('hotel', hotelFilter);
    const qs = params.toString();
    fetch('quotes/clean-hotels'+(qs?'?'+qs:''))
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(d=>{ if(!cancelled) setData(d); })
      .catch(()=>{ if(!cancelled) setError('Could not load hotel breakdown — is the itinerary_builder server running?'); });
    return ()=>{ cancelled = true; };
  }, [categoryFilter, productFilter, cityFilter, hotelFilter]);

  if(error) return <div style={{color:'#991B1B',fontSize:'11px',padding:'8px 0'}}>{error}</div>;
  if(!data) return <div style={{color:'#a8a29e',fontSize:'11px',padding:'8px 0'}}>Loading hotels…</div>;

  const maxHotelQ = Math.max(1, ...data.mostCommonHotels.map(h=>h.quotes));
  const maxHistCount = Math.max(1, ...data.hotelsPerQuoteHistogram.map(h=>h.count));

  return (
    <div style={{display:'grid',gridTemplateColumns:'1.1fr 1fr 1fr',gap:'8px'}}>
      <Panel title="Most common hotels" sub={data.distinctHotelsSeen.toLocaleString()+' distinct hotels seen across '+data.totalQuotes.toLocaleString()+' quotes.'+(onHotelClick? ' Click one to filter the quote list below to it.':'')}>
        <div style={{display:'flex',flexDirection:'column',gap:'4px',maxHeight:'220px',overflowY:'auto'}}>
          {data.mostCommonHotels.map((h,i)=>(
            <QD_HBar key={i} label={h.hotelname} value={h.quotes} max={maxHotelQ} color={PANEL_COL.quaternary}
              active={hotelFilter===h.hotelname}
              valueLabel={h.quotes.toLocaleString()+' quotes'}
              onClick={onHotelClick? ()=>onHotelClick(h.hotelname) : undefined}/>
          ))}
        </div>
      </Panel>
      <Panel title="Hotel bookings per quote" sub={"Each bar = how many quotes had that many hotel BOOKINGS (a quote with 2 separate stays at the same hotel counts as 2). Median: "+data.medianHotelsPerQuote+" bookings, but only "+data.medianDistinctHotelsPerQuote+" distinct hotel(s) — so most of the time those bookings are at different hotels, not repeat stays at the same one. The dip at exactly 1 booking is real, not a glitch: quotes tend to be either no accommodation at all (day-trips/transfers-only) or a multi-city trip needing several stays — a single one-hotel quote is the less common middle case."}>
        <div style={{overflowX:'auto',paddingBottom:'2px'}}>
          <div style={{fontSize:'9px',color:'#78716C',marginBottom:'4px'}}>Quotes, by number of hotel bookings (x-axis below = bookings per quote)</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:'6px',height:'150px',minWidth:Math.max(220, data.hotelsPerQuoteHistogram.length*28)+'px',padding:'0 4px'}}>
            {data.hotelsPerQuoteHistogram.map(h=>{
              const barH = Math.max(2, Math.round(h.count/maxHistCount*90));
              return (
                <div key={h.hotels} style={{flex:'1 1 0',minWidth:'20px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',height:'100%'}} title={h.count.toLocaleString()+' quotes had exactly '+h.hotels+' hotel booking(s)'}>
                  <div style={{fontSize:'9px',fontWeight:600,color:'#57534e',marginBottom:'2px'}}>{h.count.toLocaleString()}</div>
                  <div style={{width:'100%',height:barH+'px',background:PANEL_COL.quaternary,borderRadius:'2px 2px 0 0'}}/>
                  <div style={{fontSize:'8px',color:'#a8a29e',marginTop:'3px',whiteSpace:'nowrap'}}>{h.hotels}</div>
                </div>
              );
            })}
          </div>
        </div>
      </Panel>
      <Panel title="Hotel city-concentration" sub={'Of '+data.cityConcentration.hotelsWithEnoughData+' hotels booked ≥10 times.'+(onHotelClick? ' Click one to filter the quote list below.':'')}>
        <div style={{display:'flex',flexDirection:'column',gap:'4px',maxHeight:'220px',overflowY:'auto'}}>
          {data.cityConcentration.mostConcentrated.slice(0,6).map((h,i)=>(
            <div key={i} onClick={onHotelClick? ()=>onHotelClick(h.hotelname) : undefined}
              style={{fontSize:'10px',cursor:onHotelClick?'pointer':'default',padding:'2px 4px',borderRadius:'5px',background:hotelFilter===h.hotelname?'#EAF3DE':'transparent'}}>
              <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:hotelFilter===h.hotelname?700:400,color:onHotelClick?'#0C447C':'#1c1917'}} title={h.hotelname}>{h.hotelname}</div>
              <div style={{color:'#a8a29e',fontSize:'9px'}}>{h.topCityShare}% in {h.topCity}</div>
            </div>
          ))}
        </div>
      </Panel>
    </div>
  );
}

// QD_QaRangeBar — ported near-verbatim from the live dashboard's box-plot
// component (builder.html). Genuinely quotestage-free in the original too —
// pure trip-length statistics, no acceptance framing anywhere in this
// component. Staggers p25/median/p75 labels onto extra tiers when they'd
// otherwise overlap (common when a filter narrows the IQR to a few days).
// scaleMax is now a REQUIRED prop, not derived from this box's own max — a
// group of box plots shown together (by-state, by-band) must all scale
// against the SAME max (the largest max across the whole group), or a
// short-trip box and a long-trip box both stretch to fill the same width
// and become visually indistinguishable despite covering wildly different
// day ranges. Callers pass the group's shared max; a single stand-alone box
// plot passes its own max as scaleMax.
function QaRangeBarStatsTable({min, p25, median, p75, max, unit, n}){
  const rows = [['Min', min], ['25th percentile', p25], ['Median', median], ['75th percentile', p75], ['Max', max]];
  return (
    <table style={{borderCollapse:'collapse',fontSize:'12px',width:'100%'}}>
      <tbody>
        {n!=null? (
          <tr><td style={{padding:'4px 10px 4px 0',color:'#a8a29e'}}>Quotes (n)</td><td style={{padding:'4px 0',textAlign:'right',fontWeight:600}}>{n.toLocaleString()}</td></tr>
        ):null}
        {rows.map(([label,v])=>(
          <tr key={label}>
            <td style={{padding:'4px 10px 4px 0',color:'#a8a29e'}}>{label}</td>
            <td style={{padding:'4px 0',textAlign:'right',fontWeight:label==='Median'?700:600}}>{v}{unit||''}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

// Full-size modal for a single box plot — the compact inline SVGs are
// deliberately small/dense to fit many side by side, which makes them hard
// to read closely (small text, no numeric table). Clicking a compact box
// plot opens this: the same shape rendered much larger, plus every number
// spelled out in a plain table beside it, so the chart is never the ONLY
// place a number lives.
function QaRangeBarModal({box, unit, onClose}){
  if(!box) return null;
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.35)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:'12px',padding:'20px 22px',maxWidth:'720px',width:'100%',boxShadow:'0 8px 30px rgba(0,0,0,0.25)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
          <div style={{fontSize:'15px',fontWeight:700}}>{box.title}</div>
          <div onClick={onClose} style={{cursor:'pointer',fontSize:'13px',color:'#a8a29e',padding:'2px 8px'}}>✕ Close</div>
        </div>
        <div style={{display:'flex',gap:'20px',flexWrap:'wrap',alignItems:'center'}}>
          <div style={{flex:'2 1 380px',minWidth:'320px'}}>
            <QD_QaRangeBar {...box} unit={unit} scaleMax={box.max} compact={false} large/>
          </div>
          <div style={{flex:'1 1 180px',minWidth:'180px'}}>
            <QaRangeBarStatsTable {...box} unit={unit}/>
          </div>
        </div>
        {box.note? <div style={{fontSize:'11px',color:'#a8a29e',marginTop:'10px'}}>{box.note}</div>:null}
      </div>
    </div>
  );
}

function QD_QaRangeBar({title, note, min, p25, median, p75, max, unit, scaleMax, compact, large, onExpand, color}){
  const boxColor = color || ANALYTICS_COL.length;
  const W = large?600:480, H = large?150:(compact?80:104), padX = large?26:20;
  const effectiveScaleMax = Math.max(scaleMax||max, 1);
  const x = v => padX + Math.min(1, v/effectiveScaleMax) * (W - padX*2);
  const midY = large?90:(compact?48:64), boxH = large?32:(compact?16:22);
  const fs = large? {val:'11',valLabel:'8',axis:'9',axisLabel:'7'} : {val:'6.5',valLabel:'4.5',axis:'6.5',axisLabel:'4.5'};
  const MIN_GAP = large?60:34;
  const topPoints = [
    {key:'p25', v:p25, label:'25th pct', bold:false},
    {key:'median', v:median, label:'Median', bold:true},
    {key:'p75', v:p75, label:'75th pct', bold:false},
  ].sort((a,b)=>x(a.v)-x(b.v));
  let lastX = -Infinity, tier = 0;
  const tiers = topPoints.map(p=>{
    const px = x(p.v);
    if (px - lastX < MIN_GAP) { tier++; } else { tier = 0; }
    lastX = px;
    return {...p, tier};
  });
  const tierStep = large?22:12;

  return (
    <div onClick={onExpand} style={{background:'#fafaf9',border:'0.5px solid #e7e5e4',borderRadius:'8px',padding:compact?'8px 10px':'10px 12px',flex:compact?'1 1 220px':'1 1 280px',minWidth:compact?'200px':'260px',cursor:onExpand?'zoom-in':'default',position:'relative'}}>
      <div style={{fontSize:compact?'11px':'12px',fontWeight:600,marginBottom:compact?'4px':'8px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{title}</span>
        {onExpand? <span style={{fontSize:'10px',color:'#a8a29e'}}>⤢ expand</span>:null}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block'}} role="img"
        aria-label={`Trip length: minimum ${min}, 25th percentile ${p25}, median ${median}, 75th percentile ${p75}, maximum ${max}${unit||''}`}>
        <line x1={x(min)} x2={x(p25)} y1={midY} y2={midY} stroke="#a8a29e" strokeWidth="1.5"/>
        <line x1={x(p75)} x2={x(max)} y1={midY} y2={midY} stroke="#a8a29e" strokeWidth="1.5"/>
        <line x1={x(min)} x2={x(min)} y1={midY-8} y2={midY+8} stroke="#a8a29e" strokeWidth="1.5"/>
        <line x1={x(max)} x2={x(max)} y1={midY-8} y2={midY+8} stroke="#a8a29e" strokeWidth="1.5"/>
        <rect x={x(p25)} y={midY-boxH/2} width={Math.max(2,x(p75)-x(p25))} height={boxH} fill={boxColor} opacity="0.25" stroke={boxColor} strokeWidth="1.5"/>
        <line x1={x(median)} x2={x(median)} y1={midY-boxH/2} y2={midY+boxH/2} stroke={boxColor} strokeWidth="2.5"/>
        <text x={x(min)} y={midY+20} fontSize={fs.axis} fill="#57534e" textAnchor="middle">{min}{unit||''}</text>
        <text x={x(min)} y={midY+27} fontSize={fs.axisLabel} fill="#a8a29e" textAnchor="middle">Min</text>
        <text x={x(max)} y={midY+20} fontSize={fs.axis} fill="#57534e" textAnchor="middle">{max}{unit||''}</text>
        <text x={x(max)} y={midY+27} fontSize={fs.axisLabel} fill="#a8a29e" textAnchor="middle">Max</text>
        {tiers.map(p=>{
          const baseY = midY - boxH/2 - 11 - p.tier*tierStep;
          return (
          <g key={p.key}>
            {p.tier>0 && <line x1={x(p.v)} x2={x(p.v)} y1={baseY+6} y2={midY-boxH/2} stroke="#d6d3d1" strokeWidth="1" strokeDasharray="2,2"/>}
            <text x={x(p.v)} y={baseY} fontSize={p.bold?fs.val:fs.axis} fontWeight={p.bold?'700':'400'} fill={p.bold?'#1c1917':'#57534e'} textAnchor="middle">{p.v}{unit||''}</text>
            <text x={x(p.v)} y={baseY+7} fontSize={fs.valLabel} fill="#a8a29e" textAnchor="middle">{p.label}</text>
          </g>);
        })}
      </svg>
      {note? <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'8px'}}>{note}</div>:null}
    </div>
  );
}

// Bar + line spread chart — a plain, presentation-friendly stand-in for a
// box plot. Bars = median trip length per group (the single number people
// actually want, labeled right on top of the bar). The line connects the
// MAX of each group across the top, so "how much longer can this group's
// trip get" reads as an ordinary rising/falling line — no box-plot
// vocabulary (percentiles, IQR, whiskers) anywhere on screen. Min is shown
// as plain text under each bar instead of a second visual layer, since two
// overlapping lines (max line + min line) is exactly the "what am I looking
// at" problem this is meant to fix.
function BarLineSpread({rows, unit, max, height, color, keyField, labelField, onBarClick, activeKey}){
  const topPad = 26; // room for the max-line's dot + number so it never sits at y=0 and clips against the SVG's own top edge
  const H = (height||170) + topPad;
  const barAreaH = H - 56 - topPad; // room for: max-line dots/labels above, then bar, then axis labels below
  const W = Math.max(320, rows.length*70);
  const pad = 30;
  const xStep = rows.length>1 ? (W-pad*2)/(rows.length-1) : 0;
  const xAt = i => rows.length>1 ? pad + i*xStep : W/2;
  const toY = v => topPad + barAreaH - Math.round(Math.min(1,v/max)*barAreaH);

  return (
    <div style={{overflowX:'auto'}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',minWidth:W+'px',height:H+'px',display:'block',overflow:'visible'}}>
        {/* max-value line, connecting one point per group across the top */}
        <polyline fill="none" stroke="#94A3B8" strokeWidth="2"
          points={rows.map((r,i)=>xAt(i)+','+toY(r.max)).join(' ')}/>
        {rows.map((r,i)=>(
          <g key={'max'+i}>
            <circle cx={xAt(i)} cy={toY(r.max)} r="3" fill="#94A3B8"/>
            <text x={xAt(i)} y={toY(r.max)-8} fontSize="9" fill="#78716C" textAnchor="middle">{r.max}{unit||''}</text>
          </g>
        ))}
        {/* median bars — clickable when onBarClick is given, to show that one group's box plot inline below */}
        {rows.map((r,i)=>{
          const bw = Math.min(46, xStep*0.55) || 46;
          const active = activeKey===r[keyField];
          return (
            <g key={'bar'+i} onClick={onBarClick? ()=>onBarClick(r[keyField]) : undefined} style={{cursor:onBarClick?'pointer':'default'}}>
              <rect x={xAt(i)-bw/2} y={toY(r.median)} width={bw} height={topPad+barAreaH-toY(r.median)} fill={color} opacity={active?1:0.85} rx="3" stroke={active?'#1c1917':'none'} strokeWidth={active?1.5:0}/>
              <text x={xAt(i)} y={toY(r.median)-6} fontSize="11" fontWeight="700" fill="#1c1917" textAnchor="middle">{r.median}{unit||''}</text>
            </g>
          );
        })}
        {/* axis labels */}
        {rows.map((r,i)=>{
          const active = activeKey===r[keyField];
          return (
          <g key={'lbl'+i} onClick={onBarClick? ()=>onBarClick(r[keyField]) : undefined} style={{cursor:onBarClick?'pointer':'default'}}>
            <text x={xAt(i)} y={topPad+barAreaH+18} fontSize="10" fontWeight={active?800:600} fill={active?'#0C447C':'#57534e'} textAnchor="middle">{r[labelField]}</text>
            <text x={xAt(i)} y={topPad+barAreaH+31} fontSize="8" fill="#a8a29e" textAnchor="middle">{r.n.toLocaleString()}q · min {r.min}{unit||''}</text>
          </g>
          );
        })}
      </svg>
      <div style={{display:'flex',alignItems:'center',gap:'14px',marginTop:'2px',fontSize:'9px',color:'#78716C'}}>
        <span><span style={{display:'inline-block',width:'9px',height:'9px',background:color,borderRadius:'2px',marginRight:'4px',verticalAlign:'middle'}}/>Bar = median (typical trip)</span>
        <span><span style={{display:'inline-block',width:'9px',height:'9px',background:'#94A3B8',borderRadius:'50%',marginRight:'4px',verticalAlign:'middle'}}/>Line = longest trip seen (max)</span>
        {onBarClick? <span>Click a bar to see its full box plot below.</span>:null}
      </div>
    </div>
  );
}

// Trip-length box plot — ported from the live dashboard's Analytics tab
// (QD_QaRangeBar + the percentile logic in quotes_outcomes()), now folded INTO
// the Trip Length screen as a compact panel row instead of its own
// full-page section — the box plots are smaller (280px min-width instead
// of 320px) and grouped 3-4 per row so "by state" and "by band" each take
// far less vertical space than a standalone screen did.
// Line chart for a metric with a genuinely NARROW range (e.g. 1.25-1.62)
// where a 0-based bar chart would visually flatten every bar to "about the
// same height" — not a rendering bug, just the wrong chart for a small
// spread. Zooms the y-axis to the data's own min/max (with a little
// padding) instead of starting at 0, and prints every value directly next
// to its dot so the reader never has to estimate a height by eye. The
// y-axis is labeled in plain words, not a bare unit, since "1.25" alone
// answers nothing.
function PaceLineChart({rows, labelField, yLabel, color, onPointClick, activeLabel}){
  labelField = labelField || 'band';
  yLabel = yLabel || 'Median products per day';
  color = color || '#DB2777';
  const vals = rows.map(r=>r.median);
  const dataMin = Math.min(...vals), dataMax = Math.max(...vals);
  const pad = Math.max(0.1, (dataMax-dataMin)*0.35);
  const yMin = Math.max(0, dataMin-pad), yMax = dataMax+pad;
  const W = Math.max(440, rows.length*90), H = 204, padX = 30, padLeft = 74, padTop = 30, padBottom = 48;
  const plotH = H-padTop-padBottom;
  const plotW = W-padLeft-padX;
  // keep the first/last data point away from the plot's own edges so a
  // value label centered on them never overlaps the y-axis tick labels or
  // gets clipped against the right edge
  const seriesPad = Math.min(30, plotW*0.08);
  const xAt = i => rows.length>1 ? padLeft+seriesPad + i*((plotW-seriesPad*2)/(rows.length-1)) : padLeft+plotW/2;
  const yAt = v => padTop + plotH - ((v-yMin)/(yMax-yMin))*plotH;

  // 4 evenly-spaced tick marks so the axis reads like a real chart, not a
  // caption underneath explaining what the line means.
  const ticks = [0,1,2,3].map(i=>yMin + (yMax-yMin)*i/3);

  return (
    <div style={{overflowX:'auto'}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',minWidth:W+'px',height:H+'px',display:'block'}}>
        {/* y-axis title, rotated alongside the axis itself */}
        <text x="16" y={padTop+plotH/2} fontSize="9" fontWeight="600" fill="#57534e" textAnchor="middle" transform={`rotate(-90 16 ${padTop+plotH/2})`}>{yLabel}</text>
        {/* gridlines + numeric ticks — kept clear of the plotted line/dots via padLeft + seriesPad above */}
        {ticks.map((t,i)=>(
          <g key={'tick'+i}>
            <line x1={padLeft} x2={W-padX} y1={yAt(t)} y2={yAt(t)} stroke="#f0eeec" strokeWidth="1"/>
            <text x={padLeft-10} y={yAt(t)+3} fontSize="8" fill="#a8a29e" textAnchor="end">{t.toFixed(2)}</text>
          </g>
        ))}
        <polyline fill="none" stroke={color} strokeWidth="2.5"
          points={rows.map((r,i)=>xAt(i)+','+yAt(r.median)).join(' ')}/>
        {rows.map((r,i)=>(
          <g key={r[labelField]} onClick={onPointClick? ()=>onPointClick(r[labelField]) : undefined} style={{cursor:onPointClick?'pointer':'default'}}>
            <circle cx={xAt(i)} cy={yAt(r.median)} r={activeLabel===r[labelField]?6:4} fill={color}/>
            <text x={xAt(i)} y={Math.max(padTop-8, yAt(r.median)-11)} fontSize="11" fontWeight={activeLabel===r[labelField]?900:700} fill="#1c1917" textAnchor="middle">{r.median}</text>
            <text x={xAt(i)} y={H-padBottom+16} fontSize="10" fontWeight={activeLabel===r[labelField]?800:600} fill={activeLabel===r[labelField]?'#0C447C':'#57534e'} textAnchor="middle">{r[labelField]}</text>
            <text x={xAt(i)} y={H-padBottom+28} fontSize="8" fill="#a8a29e" textAnchor="middle">{r.n.toLocaleString()}q</text>
            {r.example? <text x={xAt(i)} y={H-padBottom+40} fontSize="8" fill="#a8a29e" textAnchor="middle">e.g. {r.example.products}/{r.example.days}d</text>:null}
          </g>
        ))}
      </svg>
    </div>
  );
}
function TripLengthSpreadCompact({stateFilter, onStateClick}){
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [extra, setExtra] = useState(null);
  const [expanded, setExpanded] = useState(null);

  useEffect(()=>{
    fetch('quotes/clean-spread')
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(setData)
      .catch(()=>setError('Could not load trip-length spread — is the itinerary_builder server running?'));
    fetch('quotes/clean-extra').then(r=>r.ok?r.json():null).then(setExtra).catch(()=>setExtra(null));
  }, []);

  if(error) return <div style={{color:'#991B1B',fontSize:'11px',padding:'8px 0'}}>{error}</div>;
  if(!data) return <div style={{color:'#a8a29e',fontSize:'11px',padding:'8px 0'}}>Loading trip-length spread…</div>;

  const stateMax = Math.max(1, ...data.byState.map(s=>s.max));
  const paceRows = (extra? extra.productsPerDayByBand : []).filter(b=>b.band!=='Unknown');
  // Same click drives both the box plot shown below AND the shared state
  // filter (so "Matching quotes" reacts too) — one selection, not two
  // separate states to keep in sync.
  const selectedStateRow = stateFilter? data.byState.find(s=>s.state===stateFilter) : null;

  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
      <Panel title="Trip-length spread by state"
        sub={"Each bar is the typical (median) trip length for that state — the line above it tracks the longest trip seen in each state. Minimum is printed under the state name."+(onStateClick? ' Click a bar for its full box plot below and to filter the quote list at the bottom.':'')}>
        <BarLineSpread rows={data.byState} unit="d" max={stateMax} color={PANEL_COL.quaternary} keyField="state" labelField="state"
          onBarClick={onStateClick} activeKey={stateFilter}/>
        {selectedStateRow? (
          <div style={{marginTop:'12px',paddingTop:'10px',borderTop:'0.5px solid #f5f5f4'}}>
            <QD_QaRangeBar title={selectedStateRow.state+' · '+selectedStateRow.n.toLocaleString()+'q'} unit="d" scaleMax={stateMax} color={PANEL_COL.quaternary}
              min={selectedStateRow.min} p25={selectedStateRow.p25} median={selectedStateRow.median} p75={selectedStateRow.p75} max={selectedStateRow.max}
              onExpand={()=>setExpanded({title:selectedStateRow.state+' — trip-length spread', min:selectedStateRow.min, p25:selectedStateRow.p25, median:selectedStateRow.median, p75:selectedStateRow.p75, max:selectedStateRow.max, n:selectedStateRow.n})}/>
          </div>
        ):null}
      </Panel>
      <Panel title="Pace of activity by trip length" sub="Median products booked per day of trip, by band — the small line under each point is a real quote whose own products/days ratio matches that median, so the rate is never just an abstract number. The range is genuinely narrow (about 1.25 to 1.6): longer trips mostly add more days at the SAME rate, not busier days.">
        {extra? (paceRows.length? (
          <PaceLineChart rows={paceRows}/>
        ):<div style={{fontSize:'11px',color:'#a8a29e'}}>No data.</div>):<div style={{fontSize:'11px',color:'#a8a29e'}}>Loading…</div>}
      </Panel>
      <QaRangeBarModal box={expanded} unit="d" onClose={()=>setExpanded(null)}/>
    </div>
  );
}

// (quotes_seasonality()): travel-date-derived monthly/seasonal volume,
// AU-vs-NZ split, and the city×month heatmap. Deliberately drops the

// lost by leaving it out of a project where quotestage isn't meaningful.
// Category mix crossed with state — does Queensland skew Tour/Attraction

// stacked colored segments (same category colors used everywhere else) so
// states with very different volumes stay visually comparable via % share.

// products per day) is the SAME metric/scale as the by-band pace chart
// right above it, so keeping both in one screen makes them easy to compare

function PaceByStateCompact({stateFilter, onStateClick}){

function CategoryByStateCompact({stateFilter, onStateClick}){
  const [data, setData] = useState(null);
  useEffect(()=>{
    fetch('quotes/clean-extra').then(r=>r.ok?r.json():null).then(setData).catch(()=>setData(null));
  }, []);
  if(!data) return <Panel title="Category mix by state"><div style={{fontSize:'11px',color:'#a8a29e'}}>Loading…</div></Panel>;
  const states = Object.entries(data.categoryByState).sort((a,b)=>b[1].totalLineItems-a[1].totalLineItems);

  // Answer the panel's own question instead of leaving it for the viewer to
  // eyeball: find the single category/state combo whose share deviates
  // furthest from that category's average share across all states, and say
  // it in one sentence. Weighted by totalLineItems so a tiny, noisy state
  // can't produce a misleading "biggest skew" callout.
  const catAvg = {};
  const catWeight = {};
  states.forEach(([,info])=>{
    Object.entries(info.categoryShare).forEach(([cat,pct])=>{
      catAvg[cat] = (catAvg[cat]||0) + pct*info.totalLineItems;
      catWeight[cat] = (catWeight[cat]||0) + info.totalLineItems;
    });
  });
  Object.keys(catAvg).forEach(cat=>{ catAvg[cat] = catWeight[cat]? catAvg[cat]/catWeight[cat] : 0; });
  let biggest = null;
  states.forEach(([state,info])=>{
    if(info.totalLineItems < 30) return; // skip states too small to trust a % comparison
    Object.entries(info.categoryShare).forEach(([cat,pct])=>{
      const dev = pct - (catAvg[cat]||0);
      if(!biggest || Math.abs(dev) > Math.abs(biggest.dev)) biggest = {state, cat, dev, pct};
    });
  });

  return (
    <Panel title="Category mix by state" sub={"Each state's own line-item total, shown as % share."+(onStateClick? ' Click a state to filter the quote list below.':'')}>
      {biggest? (
        <div style={{fontSize:'11px',fontWeight:600,color:'#1c1917',marginBottom:'8px',padding:'6px 9px',background:'#FAFAF9',borderRadius:'6px',border:'0.5px solid #e7e5e4'}}>
          {biggest.state} skews most: {biggest.cat} is {biggest.pct}% of its lines, {biggest.dev>0?'+':''}{Math.round(biggest.dev)}pp vs. the {Math.round(catAvg[biggest.cat])}% average across states.
        </div>
      ):null}
      <div style={{display:'flex',flexDirection:'column',gap:'5px'}}>
        {states.map(([state,info])=>(
          <div key={state} onClick={onStateClick? ()=>onStateClick(state) : undefined}
            style={{display:'flex',alignItems:'center',gap:'8px',cursor:onStateClick?'pointer':'default',padding:'2px 4px',borderRadius:'5px',background:stateFilter===state?'#EAF3DE':'transparent'}}>
            <span style={{...stateChipStyle(state),width:'40px',justifyContent:'center',flexShrink:0}}>{state}</span>
            <div style={{display:'flex',flex:1,height:'14px',borderRadius:'3px',overflow:'hidden'}}>
              {Object.entries(info.categoryShare).map(([cat,pct])=>(
                <div key={cat} style={{width:pct+'%',background:(CAT_COL[cat]||CAT_COL.Uncategorised).tx,opacity:.85}} title={cat+': '+pct+'%'}/>
              ))}
            </div>
            <div style={{fontSize:'9px',color:'#a8a29e',minWidth:'70px',textAlign:'right'}}>{info.totalLineItems.toLocaleString()} lines</div>
          </div>
        ))}
      </div>
    </Panel>
  );
}

function CityTypeahead({value, onChange, options, placeholder}){
  const [open, setOpen] = useState(false);
  const [rect, setRect] = useState(null);
  const inputRef = useRef(null);
  const boxRef = useRef(null);

  useEffect(()=>{
    if(!open) return;
    function onDocDown(e){
      if(inputRef.current && inputRef.current.contains(e.target)) return;
      if(boxRef.current && boxRef.current.contains(e.target)) return;
      setOpen(false);
    }
    function onScrollOrResize(){
      if(inputRef.current) setRect(inputRef.current.getBoundingClientRect());
    }
    window.addEventListener('mousedown', onDocDown);
    window.addEventListener('scroll', onScrollOrResize, true);
    window.addEventListener('resize', onScrollOrResize);
    return ()=>{
      window.removeEventListener('mousedown', onDocDown);
      window.removeEventListener('scroll', onScrollOrResize, true);
      window.removeEventListener('resize', onScrollOrResize);
    };
  }, [open]);

  const matches = useMemo(()=>{
    const q = value.trim().toLowerCase();
    const pool = q? options.filter(c=>c.toLowerCase().includes(q)) : options;
    return pool.slice(0, 40);
  }, [value, options]);

  function openDropdown(){
    if(inputRef.current) setRect(inputRef.current.getBoundingClientRect());
    setOpen(true);
  }

  const dropdownHeight = 220;

  return (
    <div style={{position:'relative'}}>
      <input ref={inputRef} value={value}
        onChange={e=>{ onChange(e.target.value); openDropdown(); }}
        onFocus={openDropdown}
        placeholder={placeholder}
        style={{width:'100%',border:'0.5px solid #d6d3d1',borderRadius:'6px',padding:'6px 8px',fontSize:'12px',boxSizing:'border-box'}}/>
      {/* Reserves real space in the sidebar's normal flow while open, so
          the dropdown pushes the filters below it down instead of
          floating over and hiding them. */}
      {open? <div style={{height:dropdownHeight+4}}/> : null}
      {open && rect? (
        <div ref={boxRef} style={{position:'fixed',top:rect.bottom+4,left:rect.left,width:rect.width,maxHeight:dropdownHeight,overflowY:'auto',background:'#fff',border:'0.5px solid #d6d3d1',borderRadius:'8px',boxShadow:'0 6px 20px rgba(0,0,0,.12)',zIndex:1000}}>
          {matches.length===0? (
            <div style={{padding:'8px 10px',fontSize:'11px',color:'#a8a29e'}}>No matching city</div>
          ):matches.map(c=>(
            <div key={c} onMouseDown={()=>{ onChange(c); setOpen(false); }}
              style={{padding:'6px 10px',fontSize:'12px',cursor:'pointer',color:'#1c1917'}}
              onMouseEnter={e=>e.currentTarget.style.background='#f5f5f4'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              {c}
            </div>
          ))}
        </div>
      ):null}
    </div>
  );
}

// QD_QaPieChart — ported from the live dashboard (arc math preserved exactly),
// with a legend column. Clicking a slice/legend row calls onSliceClick.
function QD_QaPieChart({title, sub, data, activeKey, onSliceClick}){
  const total = data.reduce((s,d)=>s+d.lines, 0) || 1;
  const r = 62, cx = 70, cy = 70;
  let acc = 0;
  const slices = data.map((d,i)=>{
    const start = acc/total*2*Math.PI - Math.PI/2;
    acc += d.lines;
    const end = acc/total*2*Math.PI - Math.PI/2;
    const large = (end-start) > Math.PI ? 1 : 0;
    const x1 = cx + r*Math.cos(start), y1 = cy + r*Math.sin(start);
    const x2 = cx + r*Math.cos(end), y2 = cy + r*Math.sin(end);
    const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
    const color = (CAT_COL[d.category]||CAT_COL.Uncategorised).tx;
    return {...d, path, color};
  });
  const hasActive = activeKey!=null;
  return (
    <div style={{background:'#fff',border:'0.5px solid #e7e5e4',borderRadius:'10px',padding:'14px 16px'}}>
      <div style={{fontSize:'12px',fontWeight:600}}>{title}</div>
      {sub? <div style={{fontSize:'10px',color:'#a8a29e',marginTop:'2px',marginBottom:'10px'}}>{sub}</div>:<div style={{marginBottom:'10px'}}/>}
      <div style={{display:'flex',gap:'16px',alignItems:'center',flexWrap:'wrap'}}>
        <svg viewBox="0 0 140 140" style={{width:'140px',height:'140px',flexShrink:0}}>
          {slices.map((s,i)=>(
            <path key={i} d={s.path} fill={s.color}
              opacity={!hasActive || activeKey===s.category ? 1 : 0.3}
              stroke="#fff" strokeWidth={activeKey===s.category?3:2}
              style={{cursor:onSliceClick?'pointer':'default'}}
              onClick={()=>onSliceClick&&onSliceClick(s.category)}>
              <title>{s.category}: {s.pct}% ({s.lines.toLocaleString()} lines)</title>
            </path>
          ))}
        </svg>
        <div style={{display:'flex',flexDirection:'column',gap:'5px',flex:1,minWidth:'160px'}}>
          {slices.map((s,i)=>(
            <div key={i} onClick={()=>onSliceClick&&onSliceClick(s.category)} style={{display:'flex',alignItems:'center',gap:'6px',cursor:onSliceClick?'pointer':'default',opacity:!hasActive||activeKey===s.category?1:0.45}}>
              <span style={{width:'9px',height:'9px',borderRadius:'2px',background:s.color,flexShrink:0}}/>
              <span style={{fontSize:'11px',flex:1}}>{s.category}</span>
              <span style={{fontSize:'11px',color:'#57534e',fontWeight:600}}>{s.pct}%</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Sliding-pill segmented control for "Unique only" / "Duplicates included".
// The two labels are very different lengths, so the pill can't just be a
// CSS 50/50 split (either clips the longer label or doesn't cover the
// shorter one) — this measures each label's real rendered width via refs
// and positions/sizes the pill in pixels to exactly match whichever one
// is active. Supports both a plain click on either label AND dragging the
// pill itself: while dragging, the pill follows the pointer with no
// transition (so it feels grabbed, not animated); on release it snaps to
// whichever side the pointer ended up past the midpoint of, same as a
// click would have chosen.
function UniqueToggle({value, onChange, leftLabel, rightLabel}){
  const trackRef = useRef(null);
  const leftRef = useRef(null);
  const rightRef = useRef(null);
  const [pill, setPill] = useState({left:0, width:0});
  const [dragBox, setDragBox] = useState(null); // {left,width} while actively dragging, else null

  useLayoutEffect(()=>{
    const el = value? leftRef.current : rightRef.current;
    if(!el) return;
    setPill({left: el.offsetLeft, width: el.offsetWidth});
  }, [value]);

  function startDrag(e){
    e.preventDefault();
    const startX = e.touches? e.touches[0].clientX : e.clientX;
    // Both endpoints' exact boxes, captured once — the pill morphs smoothly
    // between them by drag progress instead of sliding at a fixed width and
    // only snapping to the correct width after the drag ends (which is what
    // made it look like a small bubble awkwardly trying to cover the wider
    // label while in transit).
    const leftBox = {left: leftRef.current.offsetLeft, width: leftRef.current.offsetWidth};
    const rightBox = {left: rightRef.current.offsetLeft, width: rightRef.current.offsetWidth};
    const fromBox = value? leftBox : rightBox;
    const toBox = value? rightBox : leftBox;
    const track = trackRef.current;
    const travel = toBox.left - fromBox.left; // signed distance between the two endpoints

    function move(ev){
      const x = ev.touches? ev.touches[0].clientX : ev.clientX;
      const delta = x - startX;
      const t = travel!==0? Math.max(0, Math.min(1, delta / travel)) : 0;
      setDragBox({
        left: fromBox.left + (toBox.left - fromBox.left) * t,
        width: fromBox.width + (toBox.width - fromBox.width) * t,
      });
    }
    function end(ev){
      const x = (ev.changedTouches? ev.changedTouches[0].clientX : ev.clientX);
      const trackRect = track.getBoundingClientRect();
      const midpoint = trackRect.left + trackRect.width / 2;
      onChange(x < midpoint);
      setDragBox(null);
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', end);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', end);
    }
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end);
  }

  const pillLeft = dragBox? dragBox.left : pill.left;
  const pillWidth = dragBox? dragBox.width : pill.width;

  return (
    <div ref={trackRef} onMouseDown={startDrag} onTouchStart={startDrag} style={{position:'relative',display:'inline-flex',padding:'3px',borderRadius:'99px',background:'#dcdad8',boxShadow:'inset 0 1px 3px rgba(0,0,0,.18), inset 0 -1px 0 rgba(255,255,255,.5)',cursor:'grab'}}>
      <div style={{position:'absolute',zIndex:0,top:'3px',bottom:'3px',left:pillLeft,width:pillWidth,borderRadius:'99px',background:'#fff',boxShadow:'0 1px 3px rgba(0,0,0,.22), 0 0 0 0.5px rgba(0,0,0,.04)',transition:dragBox?'none':'left .22s cubic-bezier(.4,0,.2,1), width .22s cubic-bezier(.4,0,.2,1)'}}/>
      <div ref={leftRef} style={{position:'relative',zIndex:1,padding:'5px 12px',fontSize:'11px',fontWeight:value?700:500,cursor:'pointer',color:value?'#27500A':'#57534e',transition:'color .2s',whiteSpace:'nowrap'}}>{leftLabel||'Unique only'}</div>
      <div ref={rightRef} style={{position:'relative',zIndex:1,padding:'5px 12px',fontSize:'11px',fontWeight:!value?700:500,cursor:'pointer',color:!value?'#27500A':'#57534e',transition:'color .2s',whiteSpace:'nowrap'}}>{rightLabel||'Duplicates included'}</div>
    </div>
  );
}

                        <span style={{fontSize:'11px',color:'#a8a29e'}}>{qt.quotestage}</span>
                      </div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:'3px',marginTop:'5px'}}>
                        {(qt.states_touched||[]).map(s=><span key={s} style={stateChipStyle(s,true)}>{s}</span>)}
                      </div>
                    </div>

                    <div style={{display:'flex',alignItems:'stretch',borderBottom:'0.5px solid #f5f5f4',background:'#fafaf9'}}>
                      {[['Days',qt.total_days||'—'],['Products',qt.total_products||0],['Hotels',qt.total_hotels||0]].map(([label,val],i)=>(
                        <React.Fragment key={label}>
                          {i>0? <div style={{width:'0.5px',background:'#e7e5e4'}}/>:null}
                          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',padding:'8px 4px',gap:'1px'}}>
                            <div style={{fontSize:'17px',fontWeight:700}}>{val}</div>
                            <div style={{fontSize:'9px',color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.05em'}}>{label}</div>
                          </div>
                        </React.Fragment>
                      ))}
                    </div>

                    {(()=>{
                      const catMix = qt.category_mix && typeof qt.category_mix==='object' ? Object.entries(qt.category_mix) : [];
                      const cityDays = qt.days_per_city && typeof qt.days_per_city==='object' ? Object.entries(qt.days_per_city) : [];
                      const stateDays = qt.days_per_state && typeof qt.days_per_state==='object' ? Object.entries(qt.days_per_state) : [];
                      if(!catMix.length && !cityDays.length) return null;
                      return (
                        <div style={{padding:'9px 13px',borderBottom:'0.5px solid #f5f5f4',display:'flex',flexDirection:'column',gap:'6px'}}>
                          {catMix.length? (
                            <div style={{display:'flex',alignItems:'baseline',gap:'6px',flexWrap:'wrap'}}>
                              <span style={{fontSize:'9px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',flexShrink:0}}>By category</span>
                              {catMix.map(([cat,n])=><span key={cat} style={catChipStyle(cat)}>{cat} {n}</span>)}
                            </div>
                          ):null}
                          {cityDays.length? (
                            <div style={{display:'flex',alignItems:'baseline',gap:'6px',flexWrap:'wrap'}}>
                              <span style={{fontSize:'9px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',flexShrink:0}}>Days/city</span>
                              {cityDays.map(([city,n])=><span key={city} style={{fontSize:'11px',color:'#57534e',background:'#f5f5f4',borderRadius:'6px',padding:'2px 7px'}}>{city} {n}d</span>)}
                              {stateDays.map(([state,n])=><span key={state} style={stateChipStyle(state,true)}>{state} {n}d</span>)}
                            </div>
                          ):null}
                        </div>
                      );
                    })()}

                    {uniqProductNames.length? (
                      <div style={{padding:'9px 13px',borderBottom:'0.5px solid #f5f5f4'}}>
                        <div style={{fontSize:'9px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'5px'}}>Top products</div>
                        <div style={{display:'flex',flexWrap:'wrap',gap:'3px'}}>
                          {uniqProductNames.slice(0,5).map((p,i)=><span key={i} style={{...catChipStyle((products.find(x=>x.productname===p)||{}).category),borderRadius:'6px',whiteSpace:'normal',lineHeight:1.3}}>{p}</span>)}
                          {uniqProductNames.length>5? <span style={{fontSize:'10px',color:'#a8a29e',padding:'2px 4px'}}>+{uniqProductNames.length-5} more</span>:null}
                        </div>
                      </div>
                    ):null}

                    <div style={{padding:'9px 13px',borderBottom:'0.5px solid #f5f5f4'}}>
                      <div style={{fontSize:'9px',fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'5px'}}>Hotels</div>
                      {uniqHotelNames.length? (
                        <div style={{display:'flex',flexWrap:'wrap',gap:'3px'}}>
                          {uniqHotelNames.map((h,i)=><span key={i} style={{display:'inline-flex',padding:'2px 8px',borderRadius:'6px',fontSize:'11px',fontWeight:600,background:'#FDF3DC',color:'#8A6200',whiteSpace:'normal',lineHeight:1.3}}>{h}</span>)}
                        </div>
                      ):<div style={{fontSize:'11px',color:'#a8a29e'}}>No hotels recorded</div>}
                    </div>

                    <div style={{padding:'10px 13px',display:'flex',alignItems:'center',gap:'8px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:'5px',padding:'7px 10px',borderRadius:'6px',fontSize:'12px',border:'0.5px solid #d6d3d1',color:'#57534e',cursor:'pointer',whiteSpace:'nowrap',flex:1,justifyContent:'center'}} onClick={()=>setDetail(qt)}>View full itinerary</div>
                    </div>

                  </div>
                );
              }

              if(showUniqueOnly){
                // Plain 2-per-row grid, originals only — no duplicate strip.
                // quotes is already originals-only here (originalsOnly=1
                // on the fetch), so every page is a consistent, full page
                // of distinct itineraries rather than a mixed page with
                // some duplicates filtered out client-side after the fact.
                return (
                  <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'10px',alignItems:'start'}}>
                    {quotes.map(qt=>renderCard(qt, false))}
                  </div>
                );
              }

              return (
                <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
                  {rows.map((row,i)=>(
                    <div key={row.original? row.original.quote_no : i} style={{display:'flex',gap:'12px',alignItems:'start'}}>
                      <div style={{flex:'0 0 44%',maxWidth:'44%'}}>
                        {row.original? renderCard(row.original, false) : <div style={{fontSize:'11px',color:'#a8a29e',padding:'12px'}}>Original quote not on this page.</div>}
                      </div>
                      <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:'6px'}}>
                        {row.duplicates.length? (
                          <React.Fragment>
                            <div style={{fontSize:'10px',fontWeight:600,color:'#92400E',textTransform:'uppercase',letterSpacing:'.05em'}}>{row.duplicates.length} duplicate{row.duplicates.length===1?'':'s'} of this itinerary →</div>
                            <div style={{display:'flex',gap:'10px',overflowX:'auto',paddingBottom:'4px'}}>
                              {row.duplicates.map(d=>renderCard(d, true))}
                            </div>
                          </React.Fragment>
                        ):(
                          <div style={{fontSize:'11px',color:'#a8a29e',padding:'12px 0'}}>No duplicates of this itinerary.</div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              );
            })()}
            {data.totalPages>1? <div style={{marginTop:'14px'}}><PageNav page={page} totalPages={data.totalPages} onGoTo={setPage}/></div>:null}
          </React.Fragment>
        ):null}
        </React.Fragment>
        )}
        </div>
      </div>
      )}
      </div>
      <QuoteDetailModal q={detail} onClose={()=>setDetail(null)}/>
    </div>
  );
}
